<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}טודירה — חיפוש דירות בזמן אמת{% endblock %}</title>
  <meta name="description" content="בוט חיפוש דירות אישי שסורק את שוק הדירות ומתריע לך ברגע שמופיעה דירה שמתאימה בדיוק לסינון שלך.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="טודירה">
  <meta property="og:title" content="טודירה — חיפוש דירות בזמן אמת">
  <meta property="og:description" content="בוט חיפוש דירות אישי שסורק את שוק הדירות ומתריע לך ברגע שמופיעה דירה שמתאימה בדיוק לסינון שלך.">
  <meta property="og:image" content="{{ request.base_url }}static/todira-brand.webp">
  <meta property="og:url" content="{{ request.url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="טודירה — חיפוש דירות בזמן אמת">
  <meta name="twitter:description" content="בוט חיפוש דירות אישי שסורק את שוק הדירות ומתריע לך ברגע שמופיעה דירה שמתאימה בדיוק לסינון שלך.">
  <meta name="twitter:image" content="{{ request.base_url }}static/todira-brand.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site">
    <div class="header-inner">
      <a class="brand" href="/"><span class="crown">👑</span> טודירה</a>
      <nav class="site-nav">
        <a href="/apartments{{ '?uid=' ~ uid if uid else '' }}" class="{{ 'active' if active_page == 'apartments' else '' }}">דירות</a>
        <a href="/liked{{ '?uid=' ~ uid if uid else '' }}" class="{{ 'active' if active_page == 'liked' else '' }}">שמורות</a>
        <a href="/filter{{ '?uid=' ~ uid if uid else '' }}" class="{{ 'active' if active_page == 'filter' else '' }}">הסינון שלי</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <a class="brand" href="/"><span class="crown">👑</span> טודירה</a>
      <nav class="footer-nav">
        <a href="/apartments{{ '?uid=' ~ uid if uid else '' }}">דירות</a>
        <a href="/liked{{ '?uid=' ~ uid if uid else '' }}">שמורות</a>
        <a href="/filter{{ '?uid=' ~ uid if uid else '' }}">הסינון שלי</a>
        <a href="https://t.me/AmirDirotBot" target="_blank">הבוט בטלגרם</a>
      </nav>
      <p class="footer-note">נבנה באהבה על ידי טודי המלך 🐾 · © טודירה</p>
    </div>
  </footer>
  <script>
    (function () {
      var els = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window) || !els.length) {
        els.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      els.forEach(function (el) { io.observe(el); });
    })();
  </script>
</body>
</html>
