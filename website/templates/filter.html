{% extends "base.html" %}
{% set active_page = "filter" %}
{% block title %}הסינון שלי — טודירה{% endblock %}
{% block content %}
<div class="page-banner reveal">
  <div class="pb-text">
    <h1>🎛️ הסינון שלי</h1>
    <p>עריכה בסיסית כאן. לעריכה מלאה (סוג נכס, שכונות, מאפיינים) — ב-/filter בטלגרם</p>
  </div>
  <div class="pb-count"><b>{{ f.cities|length }}</b><span>ערים בסינון</span></div>
</div>

<div class="settings-card reveal">
  <form method="post" action="/filter">
    <input type="hidden" name="uid" value="{{ uid }}">
    <div class="field">
      <label><span class="field-icon">📍</span> ערים</label>
      <input type="text" name="cities" value="{{ f.cities|join(', ') }}" placeholder="תל אביב, רמת גן, גבעתיים">
      <div class="field-hint">מופרדות בפסיקים</div>
    </div>
    <div class="field-row">
      <div class="field">
        <label><span class="field-icon">💰</span> מחיר מינימלי</label>
        <input type="number" name="price_min" value="{{ f.price_min or '' }}" placeholder="0">
      </div>
      <div class="field">
        <label><span class="field-icon">💰</span> מחיר מקסימלי</label>
        <input type="number" name="price_max" value="{{ f.price_max or '' }}" placeholder="ללא הגבלה">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label><span class="field-icon">🛏️</span> חדרים מינימום</label>
        <input type="number" step="0.5" name="rooms_min" value="{{ f.rooms_min or '' }}">
      </div>
      <div class="field">
        <label><span class="field-icon">🛏️</span> חדרים מקסימום</label>
        <input type="number" step="0.5" name="rooms_max" value="{{ f.rooms_max or '' }}">
      </div>
    </div>
    <button class="btn block" type="submit">💾 שמור שינויים</button>
  </form>
</div>
{% endblock %}
