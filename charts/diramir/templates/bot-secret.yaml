# Holds every non-Postgres secret (Telegram token, plus the scraper's optional Yad2
# cookie/2captcha key). Named "bot-secret" per the plan, but also read by the scraper CronJob —
# kept as one object rather than near-duplicate secrets per component, since a k8s Secret can be
# referenced by more than one workload with no downside.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bot-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  telegram-bot-token: {{ .Values.telegramBotToken | quote }}
  {{- if .Values.geminiApiKey }}
  gemini-api-key: {{ .Values.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.yad2CookieHeader }}
  yad2-cookie-header: {{ .Values.yad2CookieHeader | quote }}
  {{- end }}
  {{- if .Values.twocaptchaApiKey }}
  twocaptcha-api-key: {{ .Values.twocaptchaApiKey | quote }}
  {{- end }}
