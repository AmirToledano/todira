# Runs `alembic upgrade head` before the bot/scraper start using the schema.
#
# Deliberately "post-install,pre-upgrade", NOT "pre-install" — Postgres is part of THIS SAME
# chart release, so a pre-install hook would fire before Postgres itself is even created on a
# fresh install. post-install runs after the normal (non-hook) resources — including Postgres —
# have been created; the retry loop below then covers the remaining race where the Postgres pod
# exists but isn't accepting connections yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    app: {{ .Release.Name }}-migrations
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: "{{ .Values.botImage.repository }}:{{ .Values.botImage.tag | default "latest" }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 30); do
                alembic -c migrations/alembic.ini upgrade head && exit 0
                echo "Migration attempt $i failed (Postgres likely still starting) — retrying in 5s..."
                sleep 5
              done
              echo "Migrations failed after 30 attempts"
              exit 1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-secret
                  key: database-url
