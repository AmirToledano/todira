apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.password | quote }}
  database-url: "postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.dbname }}"
