# Secrets are deliberately NOT in this file — supply them at deploy time via `--set` or an
# untracked `-f values-secret.yaml`, never committed:
#   postgres.password        (required)
#   telegramBotToken         (required)
#   geminiApiKey             (optional — free-tier key from https://aistudio.google.com/apikey;
#                             onboarding falls back to plain regex parsing if unset)
#   zenrowsApiKey            (required for real Yad2 scraping — free-tier key from
#                             https://zenrows.com; without it the scraper CronJob just logs an
#                             error and finds 0 listings every run, see scraper/YAD2_NOTES.md)

botImage:
  repository: ghcr.io/CHANGE-ME/todira-bot
  tag: latest
scraperImage:
  repository: ghcr.io/CHANGE-ME/todira-scraper
  tag: latest
websiteImage:
  repository: ghcr.io/CHANGE-ME/todira-website
  tag: latest

website:
  nodePort: 30080 # http://<node public IP>:30080 — kept as a direct fallback even with HTTPS below
  # real HTTPS via Caddy (see caddy-deployment.yaml) — requires the EC2 security group to allow
  # inbound 80+443, and this DNS name to already point at the node's public IP (it does, via
  # DuckDNS)
  domain: todira.duckdns.org

replicas: 1 # bot MUST stay at 1 — Telegram rejects concurrent getUpdates pollers on one token

postgres:
  image: postgres:16-alpine
  dbname: dorin
  user: dorin
  storageSize: 2Gi

scraper:
  schedule: "*/10 * * * *" # every 10 minutes — tune down later if Yad2 tolerates it fine
  # scraper/yad2_client.py's CITY_SLUG_TO_ID now has real Yad2 IDs for 24 cities (was 3) — see
  # that file's comment for the full list and how they were verified. Deliberately only added
  # jerusalem/haifa/beer-sheva here (3 -> 6 cities, 2x) rather than enabling all 24 at once: each
  # additional city here is a recurring ZenRows request-credit cost every 10 minutes, not a
  # one-time thing, and this assistant doesn't know the account's ZenRows plan/credit budget.
  # Adding more is just appending a slug from CITY_SLUG_TO_ID below (comma-separated, no spaces)
  # once you've checked https://app.zenrows.com's dashboard has room for it.
  cities: "tel-aviv,ramat-gan,givatayim,jerusalem,haifa,beer-sheva"

resources:
  bot:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  scraper:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  postgres:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  website:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  caddy:
    requests: { cpu: "25m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "96Mi" }
