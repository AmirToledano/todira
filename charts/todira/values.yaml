# Secrets are deliberately NOT in this file — supply them at deploy time via `--set` or an
# untracked `-f values-secret.yaml`, never committed:
#   postgres.password        (required)
#   telegramBotToken         (required)
#   geminiApiKey             (optional — free-tier key from https://aistudio.google.com/apikey;
#                             onboarding falls back to plain regex parsing if unset)
#   zenrowsApiKey            (required for real Yad2 scraping — free-tier key from
#                             https://zenrows.com; without it the scraper CronJob just logs an
#                             error and finds 0 listings every run, see scraper/YAD2_NOTES.md)
#   ownerTelegramUserId      (optional — the owner's own numeric Telegram user ID, e.g. from
#                             @userinfobot; when set, the website's /contact form pushes each
#                             submission straight to this Telegram chat via the existing bot
#                             token, no separate email/notification service needed. Without it,
#                             /contact submissions are still safely stored in the DB
#                             (contact_messages table) — just not proactively pushed anywhere.)
#   sessionSecretKey         (optional but should be set for real — signs the website's real-login
#                             session cookie set by the Telegram Login Widget (/auth/telegram/
#                             callback in website/main.py). Generate with e.g.
#                             `python -c "import secrets; print(secrets.token_hex(32))"`. Without
#                             it, the website falls back to a well-known insecure dev value, which
#                             means anyone could forge a login session — fine for a first deploy of
#                             this feature, not for real use.)
#   whatsappAccessToken      (required for the WhatsApp webhook to send replies — from the Meta
#                             app dashboard's WhatsApp > API Setup page. The free "temporary" token
#                             there expires after 24h; a permanent one needs a System User token,
#                             see PROJECT_STATE.md.)
#   whatsappPhoneNumberId    (required — same API Setup page, "Phone Number ID".)
#   whatsappWebhookVerifyToken (required — any string you make up yourself; must match exactly
#                             what's entered in the Meta app dashboard's webhook config screen.
#                             Generate with e.g. `python -c "import secrets;
#                             print(secrets.token_hex(16))"`.)
#   whatsappAppSecret        (required for the webhook to accept any POST at all — it fails CLOSED
#                             without this, rejecting every incoming message, rather than accepting
#                             unverified requests. From the Meta app dashboard: App settings >
#                             Basic > App Secret > Show.)

botImage:
  repository: ghcr.io/CHANGE-ME/todira-bot
  tag: latest
scraperImage:
  repository: ghcr.io/CHANGE-ME/todira-scraper
  tag: latest
websiteImage:
  repository: ghcr.io/CHANGE-ME/todira-website
  tag: latest

website:
  nodePort: 30080 # http://<node public IP>:30080 — kept as a direct fallback even with HTTPS below
  # real HTTPS via Caddy (see caddy-deployment.yaml) — requires the EC2 security group to allow
  # inbound 80+443, and this DNS name to already point at the node's public IP (it does, via
  # DuckDNS)
  domain: todira.duckdns.org

replicas: 1 # bot MUST stay at 1 — Telegram rejects concurrent getUpdates pollers on one token

postgres:
  image: postgres:16-alpine
  dbname: dorin
  user: dorin
  storageSize: 2Gi

scraper:
  # Rotation, not "trim the list" — chosen 2026-08-31 after the owner explicitly wanted every
  # selectable city scraped ("תוסיף כל מקום וחוק בארץ... אנחנו רוצים להיות זמינים לכל בן אדם"),
  # but "*/10 * * * *" x 42 cities burned the ENTIRE monthly ZenRows free-tier credit pool (5,000
  # credits, ~25 credits/request with premium_proxy+js_render) in about 2 days (5,285 credits /
  # 217 requests, confirmed via the ZenRows dashboard). Every city stays scraped — just not every
  # run. scraper/main.py picks a `citiesPerRun`-sized slice of `cities`, rotating deterministically
  # by calendar day, so every city gets refreshed roughly once per `ceil(len(cities)/citiesPerRun)`
  # days. At 6/day, daily: 6 requests/day x ~30 days ≈ 180 requests/month ≈ 4,500 credits — safely
  # under the 5,000 budget with room for manual/dev use — and every city cycles back within a week.
  # Tune `citiesPerRun` up (and/or `schedule` more frequent) once on a paid ZenRows plan.
  schedule: "0 3 * * *" # once daily, 03:00 UTC (low-traffic hour)
  citiesPerRun: 6
  # scraper/yad2_client.py's CITY_SLUG_TO_ID must have a real Yad2 ID for every slug listed here,
  # or that city silently scrapes nothing when its turn in the rotation comes up.
  cities: "tel-aviv,ramat-gan,givatayim,jerusalem,haifa,beer-sheva,rishon-lezion,petah-tikva,ashdod,netanya,bnei-brak,holon,ashkelon,rehovot,bat-yam,beit-shemesh,kfar-saba,herzliya,hadera,raanana,nahariya,eilat,modiin,ramat-hasharon,ramla,nazareth,lod,hod-hasharon,kiryat-ata,kiryat-gat,kiryat-motzkin,kiryat-bialik,kiryat-ono,yavne,or-yehuda,tzfat,afula,tiberias,dimona,mevaseret-zion,har-gilo,karmiel"

resources:
  bot:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  scraper:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  postgres:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  website:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  caddy:
    requests: { cpu: "25m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "96Mi" }
