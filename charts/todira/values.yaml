# Secrets are deliberately NOT in this file — supply them at deploy time via `--set` or an
# untracked `-f values-secret.yaml`, never committed:
#   postgres.password        (required)
#   telegramBotToken         (required)
#   geminiApiKey             (optional — free-tier key from https://aistudio.google.com/apikey;
#                             onboarding falls back to plain regex parsing if unset)
#   zenrowsApiKey            (required for real Yad2 scraping — free-tier key from
#                             https://zenrows.com; without it the scraper CronJob just logs an
#                             error and finds 0 listings every run, see scraper/YAD2_NOTES.md)
#   ownerTelegramUserId      (optional — the owner's own numeric Telegram user ID, e.g. from
#                             @userinfobot; when set, the website's /contact form pushes each
#                             submission straight to this Telegram chat via the existing bot
#                             token, no separate email/notification service needed. Without it,
#                             /contact submissions are still safely stored in the DB
#                             (contact_messages table) — just not proactively pushed anywhere.)
#   sessionSecretKey         (optional but should be set for real — signs the website's real-login
#                             session cookie set by the Telegram Login Widget (/auth/telegram/
#                             callback in website/main.py). Generate with e.g.
#                             `python -c "import secrets; print(secrets.token_hex(32))"`. Without
#                             it, the website falls back to a well-known insecure dev value, which
#                             means anyone could forge a login session — fine for a first deploy of
#                             this feature, not for real use.)
#   whatsappAccessToken      (required for the WhatsApp webhook to send replies — from the Meta
#                             app dashboard's WhatsApp > API Setup page. The free "temporary" token
#                             there expires after 24h; a permanent one needs a System User token,
#                             see PROJECT_STATE.md.)
#   whatsappPhoneNumberId    (required — same API Setup page, "Phone Number ID".)
#   whatsappWebhookVerifyToken (required — any string you make up yourself; must match exactly
#                             what's entered in the Meta app dashboard's webhook config screen.
#                             Generate with e.g. `python -c "import secrets;
#                             print(secrets.token_hex(16))"`.)
#   whatsappAppSecret        (required for the webhook to accept any POST at all — it fails CLOSED
#                             without this, rejecting every incoming message, rather than accepting
#                             unverified requests. From the Meta app dashboard: App settings >
#                             Basic > App Secret > Show.)
#   googleClientId           (optional — enables real Google Sign-In, website/main.py's
#                             /auth/google/start + /auth/google/callback. From a Google Cloud OAuth
#                             Client, application type "Web application" — authorized redirect URI
#                             must be exactly https://<website.domain>/auth/google/callback.
#                             Without it, the route 400s cleanly rather than breaking the deploy.)
#   googleClientSecret       (optional — same OAuth Client as above, required alongside
#                             googleClientId for Google Sign-In to work at all.)
#   growPageCode             (optional — real payment-gateway checkout via Grow/Meshulam,
#   growUserId                website/grow_client.py, 2026-09-05. All three required together —
#   growApiKey                get them from Grow support once the owner's business is registered
#                             and a Grow account exists. Without them, /upgrade falls back to the
#                             earlier informal click-trust flow (a Bit transfer outside this
#                             system), exactly as before this feature shipped.)
#   brightDataApiKey         (optional — on-demand listing-description enrichment for paying
#   brightDataDatasetId       users, common/dorin_common/bright_data_client.py, 2026-09-05 (used by
#                             both the scraper and website pods since 2026-09-07). Both required
#                             together; brightDataDatasetId needs a Bright Data Scraper Studio
#                             scraper the owner builds targeting Yad2 listing DETAIL pages — see
#                             that module's own docstring for why this can't just reuse the
#                             existing (broken) search-results scraper. Without these, listings
#                             are sent with no description, exactly as before this feature shipped.)
#   brightDataDescriptionField (optional — the field name in that scraper's own output schema
#                             that holds the description text; defaults to "description" if unset.)
#   takbullWebhookSecret     (optional — real payment-gateway checkout via Takbull, website/
#                             takbull_client.py, 2026-09-06. A fixed secret WE generate — e.g.
#                             `python -c "import secrets; print(secrets.token_urlsafe(24))"` — that
#                             must also be the exact path segment used when registering Takbull's
#                             one webhook URL in their dashboard (Settings > ממשקים > אוטומציה >
#                             הוסף חדש, Event Trigger "עסקה חדשה"): https://<website.domain>/
#                             webhooks/takbull/<this-same-secret>. Takbull has no signature scheme
#                             of its own, so this is what stands in for one — see that module's own
#                             docstring. Required alongside website.takbullPaymentPageUrl below for
#                             /upgrade to offer this path; without it, /upgrade falls back to Grow
#                             if configured, else the informal click-trust flow, exactly as before
#                             this feature shipped.)

# "true" (default) hits Grow's sandbox checkout endpoint instead of the real one — see
# website/grow_client.py's module docstring for why (the integration is unverified against Grow's
# own docs; this sandbox's network egress blocks every Grow/Meshulam docs domain). Flip to "false"
# only after a real sandbox checkout has been run end to end and the logs confirm the request/
# response field names actually match what Grow sends.
growSandbox: "true"

botImage:
  repository: ghcr.io/CHANGE-ME/todira-bot
  tag: latest
scraperImage:
  repository: ghcr.io/CHANGE-ME/todira-scraper
  tag: latest
websiteImage:
  repository: ghcr.io/CHANGE-ME/todira-website
  tag: latest

website:
  nodePort: 30080 # http://<node public IP>:30080 — kept as a direct fallback even with HTTPS below
  # real HTTPS via Caddy (see caddy-deployment.yaml) — requires the EC2 security group to allow
  # inbound 80+443, and this DNS name to already point at the node's public IP (it does — a real
  # owned root domain via Porkbun as of 2026-09-07, replacing the old todira.duckdns.org
  # subdomain; the switch was needed because Meta's WhatsApp Business "Domain verification"
  # option explicitly refuses to verify a subdomain of a shared free service like DuckDNS, only a
  # root domain)
  domain: todira.app
  # E.164 digits (no leading '+') of the actual WhatsApp number people message — builds the
  # /account page's wa.me channel-linking deep link. Not secret. Leave empty to hide that option
  # until it's known (it's a display value, not an API credential, so it's not the same as the
  # whatsappPhoneNumberId secret documented above).
  whatsappPublicNumber: "972524983967"
  # Informal Bit/PayBox payment instructions on /upgrade/pay (2026-09-05) — used only while Grow
  # isn't configured. ownerBitPhone: the owner's own phone number, shown plainly for the customer
  # to Bit-transfer to (no verified "open the app pre-filled" deep link exists for Bit, so this is
  # just a display value). ownerPayboxUrl: a PayBox payment link the owner generates himself from
  # the PayBox app, if he has one — omit to just hide that option. Neither is secret.
  ownerBitPhone: ""
  ownerPayboxUrl: ""
  # Takbull's one shared hosted payment page (2026-09-06) — lists all 3 plans (weekly/biweekly/
  # monthly, matching website/main.py's PLAN_PRICES_ILS) as cart items the customer picks from; see
  # website/takbull_client.py's module docstring. Not secret (it's a public checkout link the
  # owner shares with anyone anyway) — takbullWebhookSecret above is the sensitive half. Empty
  # hides this /upgrade path (falls back to Grow if configured, else the informal flow).
  takbullPaymentPageUrl: "https://paypage.takbull.co.il/4BPyx"

replicas: 1 # bot MUST stay at 1 — Telegram rejects concurrent getUpdates pollers on one token

postgres:
  image: postgres:16-alpine
  dbname: dorin
  user: dorin
  storageSize: 2Gi

scraper:
  # History (see PROJECT_STATE.md for the full incident trail): a 42-city-every-10-minutes
  # schedule burned an entire monthly ZenRows credit pool in ~2 days (2026-08-31); a later
  # Playwright-proxy-level bug billed every sub-resource of a rendered page separately, burning a
  # whole paid plan's credits in hours (2026-09-01/09-02, fixed by switching to ZenRows' flat-rate
  # Fetch API). Per-run city rotation (citiesPerRun) existed for a while as a stopgap to fit
  # whatever budget was available, at the cost of full coverage every run.
  #
  # 2026-09-03: replaced the whole per-city approach. yad2_client.py's fetch_all_listings() now
  # sweeps 7 broad Yad2 REGIONS (not 42 cities) every run — confirmed live that a single region
  # request returns real listings spanning several cities at once (e.g. tel-aviv-area alone
  # returned Tel Aviv, Ramat Gan, Givatayim, Bat Yam, and Holon together). ~175 credits per
  # full-country sweep vs. 1,050 for the old 42-city loop, on the SAME plan — no per-run city
  # selection or rotation needed anymore, so citiesPerRun/cities are gone from here; the region
  # list itself lives in yad2_client.py's REGION_SLUGS, not configured per-deploy.
  # 2026-09-03: bumped from once-daily (03:00 UTC) to every 2 hours during the reference bot
  # dorin.app's own apparent active window (established live via the owner's own WhatsApp
  # screenshots of it: listings start arriving ~08:00 and continue until ~00:00 Israel time, then
  # stop overnight — presumably deliberate, so a notification doesn't land while people are
  # asleep). 8 runs/day (08:00,10:00,...,22:00 Israel time — scraper-cronjob.yaml's `timeZone`
  # field handles Israel's DST automatically, no UTC math needed here) × 30 days × 175 credits/run
  # (7-region sweep, see REGION_SLUGS above) = 42,000 credits/month — safely under the existing
  # ZenRows Build plan's 45,000/month with margin, no upgrade. Owner explicitly chose to stay on
  # the current $19/mo plan rather than spend more for a tighter interval (Launch, $58/mo, would
  # allow every 30 min — see PROJECT_STATE.md for the full frequency/cost table if that changes).
  schedule: "0 8,10,12,14,16,18,20,22 * * *"
  # 2026-09-03: frozen at the owner's explicit, urgent request — the product isn't ready to be
  # live yet and every scheduled run spends real ZenRows credits regardless of whether anyone is
  # actually using the site/bot. `suspend: true` on the CronJob (below) means k8s stops scheduling
  # new runs entirely — a currently-running job, if any, still finishes, but no new one starts.
  # Flip back to `false` (or delete this line) when ready to resume automatic scraping.
  suspended: true

resources:
  bot:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  scraper:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  postgres:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  website:
    # 2026-09-06: bumped from 50m/250m — confirmed root cause of a live "technical hiccup" report
    # was a genuine urllib3.ReadTimeoutError to generativelanguage.googleapis.com (Gemini itself
    # slow to respond, both retry attempts timing out), NOT this pod's own CPU — but a quarter-core
    # HARD ceiling is tight for a pod that's now making live outbound Gemini calls on ordinary chat
    # messages (not just onboarding), where two requests landing close together could plausibly add
    # cgroup CPU-throttling delay on top of Gemini's own latency. Cheap, safe precaution, not a
    # proven fix for that specific incident.
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }
  caddy:
    requests: { cpu: "25m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "96Mi" }
  healthcheck:
    requests: { cpu: "10m", memory: "16Mi" }
    limits: { cpu: "50m", memory: "32Mi" }

# healthcheck-cronjob.yaml — a self-hosted watchdog that DMs the owner on Telegram when
# /healthz fails, added 2026-09-08 (pre-launch reliability pass). Complements the new liveness
# probes (website/bot/postgres/caddy Deployments): those auto-restart a broken Pod, but silently
# — the owner would never know the site was flapping unless this tells them. IMPORTANT SCOPE
# LIMIT: this runs AS A JOB INSIDE THE SAME CLUSTER/NODE it's checking, so it cannot detect the
# one failure mode that matters most for a true single-point-of-failure box — the whole node
# going down. If the node is dead, this CronJob doesn't run either, so no alert ever fires. Real
# coverage for that requires an EXTERNAL uptime monitor (a free UptimeRobot/Better Uptime check
# hitting https://<domain>/healthz from outside this infrastructure entirely) — that's an account
# signup only the owner can do, not something deployable from here.
healthcheck:
  schedule: "*/15 * * * *"
