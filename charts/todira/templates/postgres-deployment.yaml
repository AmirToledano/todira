apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
spec:
  # single-replica Deployment, not StatefulSet — acceptable simplification for a single-node
  # personal deployment (plan Section 7); revisit if this ever needs to scale or survive node
  # loss more gracefully.
  replicas: 1
  strategy:
    type: Recreate # avoid two postgres pods ever attaching to the same RWO volume at once
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
      annotations:
        # Forces a pod restart whenever postgres-secret.yaml's rendered content changes (e.g. a
        # rotated POSTGRES_PASSWORD) — the image tag never changes between deploys on its own, so
        # without this Kubernetes has no reason to recreate the pod, and it would silently keep
        # running with the stale password. Same pattern as bot/website/caddy's own checksum
        # annotations; found missing here 2026-09-07 during the audit that added those.
        checksum/postgres-secret: {{ include (print $.Template.BasePath "/postgres-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.dbname | quote }}
            # PGDATA in a subdirectory of the mount, not the mount root itself — some volume
            # provisioners leave a lost+found/ dir at the root, which makes postgres refuse to
            # initialize a "non-empty" data directory otherwise.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-secret
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Added 2026-09-08 (pre-launch reliability pass, same as website/bot's own new probes) —
          # pg_isready ships in every postgres:*-alpine image, so no extra tooling needed. A
          # readiness failure alone (DB still starting up / recovering from a crash) takes this
          # pod out of Service rotation without killing it; a SUSTAINED failure (failureThreshold)
          # also trips the liveness probe, which actually restarts the container — the two
          # together mean "briefly busy" doesn't get treated the same as "actually stuck."
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.postgres.requests.cpu }}
              memory: {{ .Values.resources.postgres.requests.memory }}
            limits:
              cpu: {{ .Values.resources.postgres.limits.cpu }}
              memory: {{ .Values.resources.postgres.limits.memory }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres-pvc
