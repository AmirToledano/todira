apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-facebook-scraper
  labels:
    app: {{ .Release.Name }}-facebook-scraper
spec:
  # 2026-09-15: a SEPARATE CronJob, deliberately — not just another source added to the main
  # scraper-cronjob.yaml's own _SOURCE_SCRAPERS loop. Every request here runs through the
  # DEDICATED scraping account's own real, authenticated session (see set-facebook-cookies-
  # secret.yaml) from this cluster's own datacenter IP — the classic profile Facebook's own
  # Account-Integrity/automation detection is built to catch. The real downside of getting this
  # wrong is a checkpoint/restriction on a real account, not a recoverable "try again later" the
  # way a blocked Yad2/Komo/Homeless request is — so this needs its own independent schedule and
  # its own independent suspend switch, never tied to the main scraper's cadence or suspend state.
  # See scraper/main.py's own SCRAPE_SOURCES/_active_source_scrapers comments for the code-level
  # half of this same kill-switch: the main CronJob never sets SCRAPE_SOURCES, so it can never
  # accidentally start scraping Facebook even if this file's own suspend is somehow misconfigured.
  schedule: {{ .Values.scraper.facebook.schedule | quote }}
  # Defaults to suspended (true) if unset — the opposite fail-safe direction from the main
  # scraper's own `| default false`, deliberately: Facebook scraping must never start just because
  # this key was accidentally omitted from a values override.
  #
  # 2026-09-24 REAL BUG FOUND LIVE: `| default true` looks right but Sprig's `default` substitutes
  # whenever the piped-in value is the Go ZERO VALUE for its type — and `false` IS the zero value
  # for a bool. So `.Values.scraper.facebook.suspended: false | default true` was silently
  # evaluating to `true` regardless — explicitly setting `suspended: false` in values.yaml (done in
  # #323, "Turn on the Facebook Marketplace CronJob") never actually took effect on the deployed
  # CronJob. Confirmed live: values.yaml has said `false` since #323, yet `kubectl get cronjob
  # todira-facebook-scraper -o jsonpath='{.spec.suspend}'` still read `true` tonight — the Facebook
  # scraper has never actually run in production. `hasKey` checks whether the key is PRESENT in the
  # map at all, independent of its boolean value, so an explicit `false` is respected while an
  # omitted key still safely defaults to suspended.
  suspend: {{ if hasKey .Values.scraper.facebook "suspended" }}{{ .Values.scraper.facebook.suspended }}{{ else }}true{{ end }}
  timeZone: "Asia/Jerusalem"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Same reasoning as scraper-cronjob.yaml's own backoffLimit: 0 — a pod crash must fail
      # visibly, never trigger a silent, unbounded retry that re-runs requests against the live
      # Facebook account from scratch.
      backoffLimit: 0
      # 2026-10-24: a run takes about 6 minutes, but one hung for over an hour (its browser stuck at ~550 MiB), ran into
      # the main scraper's run, and the node swapped until the website failed its health checks and restarted. A run
      # still going after 20 minutes is stopped. 2026-10-29 (code review): 20 minutes from :24 ran well into the :30 main run;
      # measured today a run takes about 7.5 minutes (:24 to :31:30), so a run still going after 11 minutes is stopped.
      # Later the same day the run also waits up to 3 minutes for a main run to finish (SCRAPER_LOCK_WAIT_SECONDS below):
      # 3 + 7.5 + a margin = 14 minutes.
      activeDeadlineSeconds: 840
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-facebook-scraper
        spec:
          restartPolicy: Never
          containers:
            - name: facebook-scraper
              # 2026-10-19: the image with a headless browser (scraper/Dockerfile.facebook) when CI built one.
              {{- if and .Values.facebookImage .Values.facebookImage.repository }}
              image: "{{ .Values.facebookImage.repository }}:{{ .Values.facebookImage.tag | default "latest" }}"
              {{- else }}
              image: "{{ .Values.scraperImage.repository }}:{{ .Values.scraperImage.tag | default "latest" }}"
              {{- end }}
              env:
                # 2026-10-29 (owner approved): never alongside the main scraper - wait up to 3 minutes for it to finish,
                # otherwise skip this hour's run (scraper/main.py _take_run_lock).
                - name: SCRAPER_SKIP_IF_BUSY
                  value: "true"
                - name: SCRAPER_LOCK_WAIT_SECONDS
                  value: "180"
                # 2026-10-14: at most two glibc malloc arenas, so a multi-threaded Python process keeps less freed memory
                # to itself on the 2 GB server (the default allows 8 per CPU).
                - name: MALLOC_ARENA_MAX
                  value: "2"
                # 2026-10-09: the retry pass of this job can announce a Yad2 listing, and its card is completed from Yad2's own
                # item JSON just before it is sent (scraper/notifier.py _maybe_fetch_description).
                - name: YAD2_ITEM_API
                  value: {{ .Values.scraper.yad2ItemApi | default false | quote }}
                # 2026-10-09: this job only scrapes Facebook, but run_once() also ends with the Homeless description catch-up, which here had no
                # cap setting and used its default of 30 per run - 13 and 30 "Failed to fetch Homeless listing detail page" errors in the 06:00 and
                # 12:00 UTC runs, each a wasted ZenRows credit. The main scraper job owns that catch-up.
                - name: HOMELESS_BACKFILL_MAX_PER_RUN
                  value: "0"
                # Fixed (not a secret) — see scraper/main.py's _active_source_scrapers: this is
                # the actual opt-in that makes this CronJob's own run touch Facebook at all.
                # 2026-09-22: facebook_groups added — genuinely inert on its own even once
                # deployed, since _scrape_facebook_groups() is a real no-op whenever
                # FACEBOOK_GROUPS_TRACKED_IDS (below) is unset/empty, same "safe to merge before
                # it's actually configured" pattern as every optional cap in this file.
                - name: SCRAPE_SOURCES
                  value: "facebook_marketplace,facebook_groups"
                # 2026-10-19 (owner approved): the groups feed in a browser session - every joined group, no id list.
                - name: FACEBOOK_GROUPS_BROWSER
                  value: {{ .Values.scraper.facebookGroups.browser | default false | quote }}
                - name: FACEBOOK_GROUPS_SCROLLS
                  value: {{ .Values.scraper.facebookGroups.scrolls | default 14 | quote }}
                - name: FACEBOOK_MARKETPLACE_HOURS
                  value: {{ .Values.scraper.facebook.marketplaceHours | default "" | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-postgres-secret
                      key: database-url
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: telegram-bot-token
                - name: OWNER_TELEGRAM_USER_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: owner-telegram-user-id
                      optional: true
                # Signs the "?t=" login links the scraper puts in notification links (todira_common/uid_token.py).
                # MUST be the same secret the website verifies with (website-deployment.yaml) — until
                # 2026-10-05 only the website had it, so this job signed with the dev-only fallback key and
                # every link opened logged-out ("open a personal link from the Telegram bot").
                - name: SESSION_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: session-secret-key
                      optional: true
                - name: WEBSITE_URL
                  value: "https://{{ .Values.website.domain }}"
                # 2026-10-22: the "share this flat" button on listing cards (owner approved the wording).
                - name: BOT_SHARE_BUTTON
                  value: "1"
                # The dedicated scraping account's real session cookie — see
                # set-facebook-cookies-secret.yaml's own header comment for how this key is set
                # (typed directly into that workflow's own GitHub Actions form, never through a
                # chat/AI session). optional: true so a values/chart deploy alone can never crash
                # this pod — a genuinely missing cookie surfaces as a real, logged
                # FacebookFetchError inside the run instead (see facebook_client.py's own
                # _get_cookie_header), same "fail visibly, not silently" standard as everywhere
                # else in this project.
                - name: FACEBOOK_COOKIES
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: facebook-cookies
                      optional: true
                # Real ACCOUNT-SAFETY cap (not a credit-cost one) on new-listing detail-page
                # fetches per run — see scraper/main.py's own _FACEBOOK_MAX_NEW_DETAIL_FETCHES_ENV_VAR
                # comment. Same optional-only-if-set pattern as komoMaxNewDetailFetchesPerRun etc.
                # in scraper-cronjob.yaml, so Python's own conservative default (15) applies when
                # this is left unset here.
                # 2026-10-08: also read the Marketplace feed around each city centre (scraper/main.py's
                # _FACEBOOK_MARKETPLACE_POINTS) - the default point alone returned 3 rentals, 13 points 20.
                - name: FACEBOOK_MARKETPLACE_POINTS
                  value: {{ .Values.scraper.facebook.marketplacePoints | default false | quote }}
                {{- if .Values.scraper.facebook.maxNewDetailFetchesPerRun }}
                - name: FACEBOOK_MAX_NEW_DETAIL_FETCHES_PER_RUN
                  value: {{ .Values.scraper.facebook.maxNewDetailFetchesPerRun | quote }}
                {{- end }}
                # 2026-09-22: comma-separated Facebook numeric group ids to track — see
                # scraper/main.py's own _FACEBOOK_GROUPS_TRACKED_IDS_ENV_VAR comment. Left unset
                # here (no default) until the owner confirms which groups to track; unset/empty
                # means _scrape_facebook_groups() is a genuine no-op, never an error.
                #
                # 2026-09-22 fix: `with` (not `if .Values.scraper.facebookGroups.trackedIds`
                # directly) — when every key under values.yaml's scraper.facebookGroups: block is
                # commented out, that key parses as nil, not an empty map, and Go templates can't
                # dot into a nil interface's field. `with` treats a nil/zero value as falsy and
                # skips its body instead of erroring, so this stays a real no-op either way. This
                # exact nil pointer broke `helm upgrade` in production run 35796719451.
                {{- with .Values.scraper.facebookGroups }}
                {{- if .trackedIds }}
                - name: FACEBOOK_GROUPS_TRACKED_IDS
                  value: {{ .trackedIds | quote }}
                {{- end }}
                # 2026-09-24: separate rent/sale group id lists — see scraper/main.py's own
                # _FACEBOOK_GROUPS_SALE_TRACKED_IDS_ENV_VAR comment for why a group needs its own
                # deal_type rather than the single hardcoded RENT every tracked group used to get.
                # Same no-default/left-unset pattern as trackedIds above.
                {{- if .saleTrackedIds }}
                - name: FACEBOOK_GROUPS_SALE_TRACKED_IDS
                  value: {{ .saleTrackedIds | quote }}
                {{- end }}
                {{- if .maxNewDetailFetchesPerRun }}
                - name: FACEBOOK_GROUPS_MAX_NEW_DETAIL_FETCHES_PER_RUN
                  value: {{ .maxNewDetailFetchesPerRun | quote }}
                {{- end }}
                {{- end }}
                # Same flag/value as the main scraper-cronjob.yaml uses — one shared kill switch
                # for "no real Telegram sends this run", not a separate Facebook-only one.
                - name: NOTIFICATIONS_SUSPENDED
                  value: {{ .Values.scraper.notificationsSuspended | default false | quote }}
              resources:
                requests:
                  cpu: {{ .Values.resources.scraper.requests.cpu }}
                  memory: {{ .Values.resources.scraper.requests.memory }}
                limits:
                  cpu: {{ .Values.resources.scraper.limits.cpu }}
                  memory: {{ .Values.resources.scraper.limits.memory }}
