# Holds every non-Postgres secret (Telegram token, Gemini/ZenRows keys). Named "bot-secret" per
# the plan, but also read by the scraper CronJob — kept as one object rather than near-duplicate
# secrets per component, since a k8s Secret can be referenced by more than one workload with no
# downside.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bot-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  telegram-bot-token: {{ .Values.telegramBotToken | quote }}
  {{- if .Values.geminiApiKey }}
  gemini-api-key: {{ .Values.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.zenrowsApiKey }}
  zenrows-api-key: {{ .Values.zenrowsApiKey | quote }}
  {{- end }}
  {{- if .Values.ownerTelegramUserId }}
  owner-telegram-user-id: {{ .Values.ownerTelegramUserId | quote }}
  {{- end }}
  {{- if .Values.sessionSecretKey }}
  session-secret-key: {{ .Values.sessionSecretKey | quote }}
  {{- end }}
  {{- if .Values.whatsappAccessToken }}
  whatsapp-access-token: {{ .Values.whatsappAccessToken | quote }}
  {{- end }}
  {{- if .Values.whatsappPhoneNumberId }}
  whatsapp-phone-number-id: {{ .Values.whatsappPhoneNumberId | quote }}
  {{- end }}
  {{- if .Values.whatsappWebhookVerifyToken }}
  whatsapp-webhook-verify-token: {{ .Values.whatsappWebhookVerifyToken | quote }}
  {{- end }}
  {{- if .Values.whatsappAppSecret }}
  whatsapp-app-secret: {{ .Values.whatsappAppSecret | quote }}
  {{- end }}
  {{- if .Values.googleClientId }}
  google-client-id: {{ .Values.googleClientId | quote }}
  {{- end }}
  {{- if .Values.googleClientSecret }}
  google-client-secret: {{ .Values.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.growPageCode }}
  grow-page-code: {{ .Values.growPageCode | quote }}
  {{- end }}
  {{- if .Values.growUserId }}
  grow-user-id: {{ .Values.growUserId | quote }}
  {{- end }}
  {{- if .Values.growApiKey }}
  grow-api-key: {{ .Values.growApiKey | quote }}
  {{- end }}
  {{- if .Values.brightDataApiKey }}
  bright-data-api-key: {{ .Values.brightDataApiKey | quote }}
  {{- end }}
  {{- if .Values.brightDataDatasetId }}
  bright-data-dataset-id: {{ .Values.brightDataDatasetId | quote }}
  {{- end }}
  {{- if .Values.brightDataDescriptionField }}
  bright-data-description-field: {{ .Values.brightDataDescriptionField | quote }}
  {{- end }}
  {{- if .Values.takbullWebhookSecret }}
  takbull-webhook-secret: {{ .Values.takbullWebhookSecret | quote }}
  {{- end }}
  # Daily off-node DB backup to S3 (backup-cronjob.yaml, 2026-09-08) — scoped to a single S3
  # bucket via a least-privilege IAM policy (PutObject/GetObject/DeleteObject/ListBucket on that
  # bucket only), not an account-wide credential. Optional/unset by default so a deploy before
  # the owner sets these up doesn't break; the CronJob itself would just fail (visible via
  # `kubectl get cronjobs`) rather than the whole deploy.
  {{- if .Values.awsAccessKeyId }}
  aws-access-key-id: {{ .Values.awsAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.awsSecretAccessKey }}
  aws-secret-access-key: {{ .Values.awsSecretAccessKey | quote }}
  {{- end }}
