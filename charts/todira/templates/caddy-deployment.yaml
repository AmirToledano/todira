# Recon (2026-08-30) found this cluster's k3s was installed WITHOUT its usual bundled Traefik
# (kube-system only has coredns + local-path-provisioner, no ingress controller, no
# LoadBalancer/MetalLB) - so real HTTPS needs its own lightweight piece rather than an Ingress
# resource riding on infrastructure that doesn't exist here. Caddy is a single small container
# that handles the whole TLS story (HTTP-01 challenge, cert issuance, renewal, HTTP->HTTPS
# redirect) from one Caddyfile line - see caddy-configmap.yaml.
#
# hostNetwork is required (not NodePort) to bind the real ports 80/443 - NodePort's allowed range
# starts at 30000 and this single-node cluster has no LoadBalancer to front it otherwise. This
# also means: MUST stay at 1 replica with a Recreate rollout strategy, the same "only one process
# can own this" constraint the bot's Telegram polling has, just for host port ownership instead
# of a Telegram token - two hostNetwork pods on the same node would fight over binding :80/:443.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-caddy
  labels:
    app: {{ .Release.Name }}-caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-caddy
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-caddy
      annotations:
        # Same class of bug as bot-deployment.yaml/website-deployment.yaml's own checksum
        # annotation (see those files' comments for the full incident writeup) — found live
        # 2026-09-07 while switching website.domain from todira.duckdns.org to todira.app: this
        # Deployment's own container image tag (caddy:2.8-alpine) never changes between deploys,
        # so Kubernetes had no reason to recreate the Pod even though the mounted Caddyfile
        # ConfigMap's CONTENT changed underneath it — kubelet does sync the new file onto disk
        # inside the still-running container, but `caddy run` never watches/reloads it on its
        # own, so the process kept serving the OLD Caddyfile (old domain only) indefinitely. This
        # annotation forces a real Pod recreation any time the Caddyfile's rendered content
        # changes, not just when the image tag does.
        checksum/caddy-config: {{ include (print $.Template.BasePath "/caddy-configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - containerPort: 80
              hostPort: 80
            - containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: caddy-data
              mountPath: /data
          # Added 2026-09-08 (pre-launch reliability pass) — a plain TCP check on :80, not an
          # httpGet: Caddy proxies every request straight to the website Pod (see
          # caddy-configmap.yaml), so an httpGet probe here would fail whenever the WEBSITE is
          # briefly unhealthy/restarting too — restarting Caddy on top of that makes an existing
          # outage worse, not better, and duplicates what website-deployment.yaml's own probe
          # already covers. A TCP check only asks "is Caddy itself listening," independent of
          # whatever it's proxying to.
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.caddy.requests.cpu }}
              memory: {{ .Values.resources.caddy.requests.memory }}
            limits:
              cpu: {{ .Values.resources.caddy.limits.cpu }}
              memory: {{ .Values.resources.caddy.limits.memory }}
      volumes:
        - name: caddyfile
          configMap:
            name: {{ .Release.Name }}-caddy-config
        - name: caddy-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-caddy-pvc
