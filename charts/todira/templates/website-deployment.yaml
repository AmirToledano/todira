apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-website
  labels:
    app: {{ .Release.Name }}-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-website
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-website
      annotations:
        # See bot-deployment.yaml's identical annotation for the full explanation — this is the
        # actual root cause of a real 2026-09-06 incident: this Deployment kept replying to
        # WhatsApp messages from a stale phone number for 30+ minutes AFTER the underlying
        # WHATSAPP_PHONE_NUMBER_ID secret was fixed and a CI run reported "success" twice, because
        # neither run changed websiteImage.tag, so Kubernetes had no reason to restart the already
        # -running Pod — it kept serving requests with whatever env vars it read at its ORIGINAL
        # boot time, oblivious to the Secret object changing underneath it.
        checksum/bot-secret: {{ include (print $.Template.BasePath "/bot-secret.yaml") . | sha256sum }}
        # DATABASE_URL below also comes from a secretKeyRef, but from postgres-secret.yaml, not
        # bot-secret.yaml — the annotation above never covers it, so a rotated postgres password
        # would hit the exact same "Pod never restarts" bug this comment describes. Found missing
        # 2026-09-07; fixed here and in postgres-deployment.yaml itself.
        checksum/postgres-secret: {{ include (print $.Template.BasePath "/postgres-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: website
          image: "{{ .Values.websiteImage.repository }}:{{ .Values.websiteImage.tag | default "latest" }}"
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-secret
                  key: database-url
            # /contact form's push to the owner's Telegram chat — see website/main.py's
            # _notify_owner_sync. Reuses the bot's own token (no extra secret needed); the owner's
            # numeric user id is optional and unset by default, see values.yaml's comment.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: telegram-bot-token
            - name: OWNER_TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: owner-telegram-user-id
                  optional: true
            # Signs the real-login session cookie set by /auth/telegram/callback (website/main.py).
            # Optional/falls back to an insecure dev value when unset (see main.py's own comment) so
            # a deploy before the owner sets this secret doesn't break — but a forgeable session
            # cookie is a real security gap, so this should be set for real as soon as possible.
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: session-secret-key
                  optional: true
            # WhatsApp Cloud API webhook (website/whatsapp_webhook.py) — all optional/unset by
            # default so a deploy before these secrets exist doesn't break; the webhook's own
            # signature check fails CLOSED (rejects every POST) when whatsapp-app-secret is
            # missing, so an unset value here is safe, not silently insecure.
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: whatsapp-access-token
                  optional: true
            - name: WHATSAPP_PHONE_NUMBER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: whatsapp-phone-number-id
                  optional: true
            - name: WHATSAPP_WEBHOOK_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: whatsapp-webhook-verify-token
                  optional: true
            - name: WHATSAPP_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: whatsapp-app-secret
                  optional: true
            # The actual displayable WhatsApp number (not WHATSAPP_PHONE_NUMBER_ID above, which is
            # the Cloud API's internal id) — builds the wa.me deep link on website/main.py's
            # /account channel-linking page. Not secret, so a plain value rather than a Secret
            # ref; empty by default, in which case /account just hides the WhatsApp option.
            - name: WHATSAPP_PUBLIC_NUMBER
              value: "{{ .Values.website.whatsappPublicNumber | default "" }}"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: gemini-api-key
                  optional: true
            # Google Sign-In (website/main.py's /auth/google/start + /auth/google/callback) —
            # optional/unset by default so a deploy before the owner creates a Google Cloud OAuth
            # Client doesn't break; the route itself 400s cleanly until both are set.
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: google-client-id
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: google-client-secret
                  optional: true
            # Must match EXACTLY what's registered as the OAuth Client's redirect URI in the
            # Google Cloud Console — see main.py's own comment on why this is a fixed value, never
            # derived from the incoming request (Caddy terminates TLS in front of this pod).
            - name: WEBSITE_URL
              value: "https://{{ .Values.website.domain }}"
            # On-demand listing-description enrichment via Bright Data (common/dorin_common/
            # bright_data_client.py — moved here from scraper/ 2026-09-07 so both pods can use it):
            # /apartments and /liked (website/main.py's _fill_missing_descriptions_in_background)
            # lazily fetch a still-missing description for a paying viewer, same optional secrets
            # the scraper's own discovery-time trigger already uses. All optional; unset means
            # fetch_listing_description always returns None, same as before this feature existed.
            - name: BRIGHT_DATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: bright-data-api-key
                  optional: true
            - name: BRIGHT_DATA_COLLECTOR_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: bright-data-collector-id
                  optional: true
            - name: BRIGHT_DATA_DESCRIPTION_FIELD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: bright-data-description-field
                  optional: true
            # Real payment-gateway checkout (website/grow_client.py, 2026-09-05) — all optional/
            # unset by default so a deploy before the owner has a Grow account doesn't break;
            # /upgrade falls back to the earlier informal click-trust flow until all three are set.
            - name: GROW_PAGE_CODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: grow-page-code
                  optional: true
            - name: GROW_USER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: grow-user-id
                  optional: true
            - name: GROW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: grow-api-key
                  optional: true
            # "true" (default) hits Grow's sandbox endpoint — deliberate safety default for an
            # unverified integration (see grow_client.py's module docstring); the owner must
            # explicitly opt into "false" once a real sandbox checkout has been tested end to end.
            - name: GROW_SANDBOX
              value: "{{ .Values.growSandbox | default "true" }}"
            # Informal Bit/PayBox payment instructions (website/main.py's /upgrade/pay, 2026-09-05
            # — used only while Grow isn't configured above). Not secret; both optional.
            - name: OWNER_BIT_PHONE
              value: "{{ .Values.website.ownerBitPhone | default "" }}"
            - name: OWNER_PAYBOX_URL
              value: "{{ .Values.website.ownerPayboxUrl | default "" }}"
            # Real payment-gateway checkout via Takbull (website/takbull_client.py, 2026-09-06) —
            # tried BEFORE Grow above in /upgrade's fallback chain since it's ₪0/month. Not secret
            # (a public checkout link); takbull-webhook-secret below is the sensitive half. Both
            # optional/unset by default so a deploy before the owner has this ready doesn't break.
            - name: TAKBULL_PAYMENT_PAGE_URL
              value: "{{ .Values.website.takbullPaymentPageUrl | default "" }}"
            - name: TAKBULL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: takbull-webhook-secret
                  optional: true
          # Added 2026-09-08 (pre-launch reliability pass) — this Deployment had NO probe at all
          # before this, so a hung-but-still-running process (an event loop deadlock, a DB
          # connection that dies and never recovers) would sit "Running" forever with zero
          # automatic recovery, and a still-starting pod could receive real user traffic before it
          # was actually able to serve it. /healthz (website/main.py) does a real DB round-trip,
          # not just "the process answers HTTP" — matches what the probe is actually meant to
          # protect against. initialDelaySeconds gives the app a moment to import/connect on a
          # cold start before the probe can fail it; periodSeconds/failureThreshold together mean
          # a real outage takes ~30s to trip, not a single slow request.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.website.requests.cpu }}
              memory: {{ .Values.resources.website.requests.memory }}
            limits:
              cpu: {{ .Values.resources.website.limits.cpu }}
              memory: {{ .Values.resources.website.limits.memory }}
