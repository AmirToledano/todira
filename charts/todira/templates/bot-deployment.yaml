apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bot
  labels:
    app: {{ .Release.Name }}-bot
spec:
  # MUST stay at 1 — Telegram's long-polling (getUpdates) rejects/conflicts when two pollers
  # share one bot token, so this deliberately doesn't read a "replicas" value meant for scaling.
  replicas: {{ .Values.replicas | default 1 }}
  # Recreate (not the default RollingUpdate): the bot-pvc below is ReadWriteOnce, so a new pod
  # can't mount it while the old one still holds it during a rolling update - same class of
  # constraint as Caddy's hostPort binding, different resource.
  # NOTE: this Deployment already existed with an implicit RollingUpdate strategy before this
  # change, and Kubernetes had already persisted spec.strategy.rollingUpdate server-side - the API
  # rejects an object with both that field present and type: Recreate. Writing `rollingUpdate:
  # null` here did NOT clear it (Helm appears to drop explicit YAML nulls before building its
  # patch) - the actual fix is a one-time `kubectl patch ... --type=json` remove in ci-cd.yaml's
  # deploy job, run once before `helm upgrade`. Caddy's own Recreate strategy never hit this at
  # all, having been created with Recreate from day one with no prior RollingUpdate state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-bot
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-bot
      annotations:
        # Forces a real rollout whenever bot-secret.yaml's RENDERED content changes — even when
        # botImage.tag doesn't (e.g. a secret-only fix with no new commit, or a re-run of an old
        # CI run that rebuilds the same image tag). Without this, `helm upgrade` happily updates
        # the k8s Secret object's data, but Kubernetes has no reason to restart an already-running
        # Pod just because a Secret it references changed underneath it — env vars from
        # secretKeyRef are read once at container start and never live-refreshed. This is the
        # actual root cause behind a real 2026-09-06 incident: after fixing a stale
        # WHATSAPP_PHONE_NUMBER_ID secret and re-running the same CI run (same image tag), the
        # website Deployment (which has the identical bug — see its own copy of this annotation)
        # kept replying from the OLD number for another 30+ minutes, because its running Pod was
        # never actually restarted despite Helm reporting success both times.
        checksum/bot-secret: {{ include (print $.Template.BasePath "/bot-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: bot
          image: "{{ .Values.botImage.repository }}:{{ .Values.botImage.tag | default "latest" }}"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-secret
                  key: database-url
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: telegram-bot-token
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: gemini-api-key
                  optional: true
            - name: WEBSITE_URL
              value: "https://{{ .Values.website.domain }}"
            # bot/handlers/contact_fallback.py's forward-to-owner path — was missing here entirely
            # until 2026-09-01 (the website Deployment had it, the bot Deployment never did), so
            # the fallback silently never sent anything even once the secret existed.
            - name: OWNER_TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: owner-telegram-user-id
                  optional: true
          volumeMounts:
            - name: bot-data
              mountPath: /data
          resources:
            requests:
              cpu: {{ .Values.resources.bot.requests.cpu }}
              memory: {{ .Values.resources.bot.requests.memory }}
            limits:
              cpu: {{ .Values.resources.bot.limits.cpu }}
              memory: {{ .Values.resources.bot.limits.memory }}
      volumes:
        - name: bot-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-bot-pvc
