apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bot
  labels:
    app: {{ .Release.Name }}-bot
spec:
  # MUST stay at 1 — Telegram's long-polling (getUpdates) rejects/conflicts when two pollers
  # share one bot token, so this deliberately doesn't read a "replicas" value meant for scaling.
  replicas: {{ .Values.replicas | default 1 }}
  # Recreate (not the default RollingUpdate): the bot-pvc below is ReadWriteOnce, so a new pod
  # can't mount it while the old one still holds it during a rolling update - same class of
  # constraint as Caddy's hostPort binding, different resource.
  # rollingUpdate: null is required here (not just omitting the key) because this Deployment
  # already existed with an implicit RollingUpdate strategy before this change - Kubernetes had
  # already persisted spec.strategy.rollingUpdate server-side, and the API rejects an object with
  # both that field present and type: Recreate. An explicit null in a strategic-merge-patch/SSA
  # apply is what actually clears a field the live object already has; omitting the key here would
  # just leave the old value in place and fail the same way (this is exactly what happened on the
  # first attempt - Caddy's own Recreate strategy never hit this because it had no prior
  # RollingUpdate state to conflict with, having been created with Recreate from the start).
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ .Release.Name }}-bot
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-bot
    spec:
      containers:
        - name: bot
          image: "{{ .Values.botImage.repository }}:{{ .Values.botImage.tag | default "latest" }}"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-secret
                  key: database-url
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: telegram-bot-token
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bot-secret
                  key: gemini-api-key
                  optional: true
          volumeMounts:
            - name: bot-data
              mountPath: /data
          resources:
            requests:
              cpu: {{ .Values.resources.bot.requests.cpu }}
              memory: {{ .Values.resources.bot.requests.memory }}
            limits:
              cpu: {{ .Values.resources.bot.limits.cpu }}
              memory: {{ .Values.resources.bot.limits.memory }}
      volumes:
        - name: bot-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-bot-pvc
