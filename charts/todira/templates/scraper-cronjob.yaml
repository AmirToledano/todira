apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-scraper
  labels:
    app: {{ .Release.Name }}-scraper
spec:
  schedule: {{ .Values.scraper.schedule | quote }}
  suspend: {{ .Values.scraper.suspended | default false }}
  # Local time, DST-safe — see values.yaml's scraper comment for why this window/timezone and the
  # budget math behind the schedule above. Requires CronJob's timeZone field (stable since k8s
  # 1.27); confirmed present on the real cluster 2026-09-03 (`kubectl get cronjobs -A` already
  # showed a TIMEZONE column before this was ever set).
  timeZone: "Asia/Jerusalem"
  concurrencyPolicy: Forbid # never overlap scrape runs
  jobTemplate:
    spec:
      # 0, deliberately — see values.yaml's scraper comment for the incident this guards against.
      # With backoffLimit>0, a pod crash (OOM, a transient DB hiccup, anything outside the
      # per-region try/except in main.py's run_once — a single failed region is already caught and
      # skipped there, this is about the whole pod dying) makes Kubernetes silently re-run the
      # ENTIRE region sweep from scratch, re-billing every ZenRows request already paid for in the
      # failed attempt. A real run either succeeds outright or fails visibly (kubectl get jobs
      # shows Failed) — no silent, unbounded repeated spend.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-scraper
        spec:
          # Never (was OnFailure): with backoffLimit 0 a crash makes the Job fail either way, but OnFailure restarts the container in
          # place and the Job controller then DELETES the pod, taking its logs and OOMKilled state with it (the 18:00 UTC run on
          # 2026-10-08 died ~25 min in and left nothing to read). With Never the failed pod stays for inspection.
          restartPolicy: Never
          containers:
            - name: scraper
              image: "{{ .Values.scraperImage.repository }}:{{ .Values.scraperImage.tag | default "latest" }}"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-postgres-secret
                      key: database-url
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: telegram-bot-token
                - name: ZENROWS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: zenrows-api-key
                      optional: true
                # scraper/notifier.py's access gating (2026-09-05, todira_common.access.
                # has_full_access) needs both to build the same owner-override + "🔒 upgrade" link
                # the bot's own on-demand handlers already have — see notifier.py's own comment.
                - name: OWNER_TELEGRAM_USER_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: owner-telegram-user-id
                      optional: true
                # Signs the "?t="/"?wid=" login links the scraper puts in notification links and WhatsApp magic links (todira_common/uid_token.py, wid_token.py).
                # MUST be the same secret the website verifies with (website-deployment.yaml) — until
                # 2026-10-05 only the website had it, so this job signed with the dev-only fallback key and
                # every link opened logged-out ("open a personal link from the Telegram bot").
                - name: SESSION_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: session-secret-key
                      optional: true
                - name: WEBSITE_URL
                  value: "https://{{ .Values.website.domain }}"
                # On-demand listing-description enrichment via Bright Data (scraper/
                # bright_data_client.py, 2026-09-05) — all optional; unset means
                # fetch_listing_description always returns None, same as before this feature
                # existed. See that module's own docstring for what the owner still needs to set
                # these up (a Bright Data account + a Scraper Studio scraper targeting Yad2 listing
                # DETAIL pages, not the existing broken search-results one).
                # 2026-10-04: Yad2 listing details via Gemini's free URL-context tool (Web Unlocker only as fallback)
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: gemini-api-key
                      optional: true
                - name: YAD2_DETAIL_VIA_GEMINI
                  value: {{ .Values.scraper.yad2DetailViaGemini | default false | quote }}
                - name: YAD2_ITEM_API
                  value: {{ .Values.scraper.yad2ItemApi | default false | quote }}
                # Comma-separated model chain; empty = the code's verified default (gemini_url_detail._DEFAULT_MODELS).
                - name: YAD2_GEMINI_MODEL
                  value: {{ .Values.yad2GeminiModels | default "" | quote }}
                - name: BRIGHT_DATA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: bright-data-api-key
                      optional: true
                - name: BRIGHT_DATA_COLLECTOR_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: bright-data-collector-id
                      optional: true
                - name: BRIGHT_DATA_DESCRIPTION_FIELD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: bright-data-description-field
                      optional: true
                # 2026-09-14: Bright Data's flat-rate ISP proxy (bright_data_client.py's
                # fetch_via_isp_proxy) — the real, partial Yad2-off-ZenRows migration (see
                # yad2_client.py's REGIONS_ON_MAP_API for exactly which region(s) use this and why).
                # Same "optional: true" pattern as every other Bright Data secret above: unset means
                # fetch_via_isp_proxy always returns None (see its own docstring), so that region
                # just falls back to the normal Yad2FetchError-style retry-then-skip handling rather
                # than crashing the pod — but it DOES mean tel-aviv-area gets zero real Yad2 coverage
                # until these three keys actually exist on the real k8s secret (not yet done as of
                # this change — owner still needs to add bright-data-isp-host/-user/-pass to it).
                - name: BRIGHT_DATA_ISP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: bright-data-isp-host
                      optional: true
                - name: BRIGHT_DATA_ISP_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: bright-data-isp-user
                      optional: true
                - name: BRIGHT_DATA_ISP_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: bright-data-isp-pass
                      optional: true
                # Free-form WhatsApp push + check-in (todira_common/whatsapp_client.py,
                # notifier.py's _whatsapp_eligible/_send_whatsapp_match_message, whatsapp_checkin.py) — same access-token/phone-number-id secret website-deployment.yaml
                # already uses for the webhook's own replies, both optional here the same way.
                - name: WHATSAPP_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: whatsapp-access-token
                      optional: true
                - name: WHATSAPP_PHONE_NUMBER_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-bot-secret
                      key: whatsapp-phone-number-id
                      optional: true
                # Not secret. Lets scraper/whatsapp_cost_guard.py read Meta's pricing analytics.
                - name: WHATSAPP_BUSINESS_ACCOUNT_ID
                  value: {{ .Values.scraper.whatsappBusinessAccountId | default "" | quote }}
                # 2026-09-13 credit-budget safety mechanisms — see values.yaml's own comment on
                # scraper.komoMaxNewDetailFetchesPerRun for the real math these exist to protect.
                # Only set when the value is actually present, so scraper/main.py's own Python-side
                # defaults (unset env var) apply otherwise rather than an empty string overriding
                # them — same pattern as the optional secretKeyRefs above.
                {{- if .Values.scraper.komoMaxNewDetailFetchesPerRun }}
                - name: KOMO_MAX_NEW_DETAIL_FETCHES_PER_RUN
                  value: {{ .Values.scraper.komoMaxNewDetailFetchesPerRun | quote }}
                {{- end }}
                - name: YAD2_FREE_MAP_FETCH
                  value: {{ .Values.scraper.yad2FreeMapFetch | default false | quote }}
                - name: YAD2_TILE_SWEEP
                  value: {{ .Values.scraper.yad2TileSweep | default false | quote }}
                - name: YAD2_SALE_TILE_SWEEP
                  value: {{ .Values.scraper.yad2SaleTileSweep | default false | quote }}
                {{- if .Values.scraper.yad2TileMaxRequests }}
                - name: YAD2_TILE_MAX_REQUESTS
                  value: {{ .Values.scraper.yad2TileMaxRequests | quote }}
                {{- end }}
                {{- if .Values.scraper.yad2MaxPagesPerRegion }}
                - name: YAD2_MAX_PAGES_PER_REGION
                  value: {{ .Values.scraper.yad2MaxPagesPerRegion | quote }}
                {{- end }}
                # 2026-10-08: read Homeless's /rent/<n> and /sale/<n> pages (first pages every run + a rolling cursor over the rest).
                - name: HOMELESS_PAGINATION
                  value: {{ .Values.scraper.homelessPagination | default false | quote }}
                {{- if .Values.scraper.homelessBackfillMaxPerRun }}
                - name: HOMELESS_BACKFILL_MAX_PER_RUN
                  value: {{ .Values.scraper.homelessBackfillMaxPerRun | quote }}
                {{- end }}
                {{- if .Values.scraper.homelessMaxNewDescriptionFetchesPerRun }}
                - name: HOMELESS_MAX_NEW_DESCRIPTION_FETCHES_PER_RUN
                  value: {{ .Values.scraper.homelessMaxNewDescriptionFetchesPerRun | quote }}
                {{- end }}
                {{- if .Values.scraper.brightDataBackfillMaxPerRun }}
                - name: BRIGHT_DATA_BACKFILL_MAX_PER_RUN
                  value: {{ .Values.scraper.brightDataBackfillMaxPerRun | quote }}
                {{- end }}
                {{- if .Values.scraper.brightDataEnrichMaxNewListingsPerRun }}
                - name: BRIGHT_DATA_ENRICH_MAX_NEW_LISTINGS_PER_RUN
                  value: {{ .Values.scraper.brightDataEnrichMaxNewListingsPerRun | quote }}
                {{- end }}
                - name: NOTIFICATIONS_SUSPENDED
                  value: {{ .Values.scraper.notificationsSuspended | default false | quote }}
                # 2026-09-15: real, confirmed kill-switch — see values.yaml's own comment on
                # scraper.brightDataEnrichmentSuspended for the full history (the Bright Data DCA
                # collector this originally guarded against is no longer even called; 2026-09-17
                # lifted now that enrichment routes through Web Unlocker instead).
                - name: BRIGHT_DATA_ENRICHMENT_SUSPENDED
                  value: {{ .Values.scraper.brightDataEnrichmentSuspended | default false | quote }}
              resources:
                requests:
                  cpu: {{ .Values.resources.scraper.requests.cpu }}
                  memory: {{ .Values.resources.scraper.requests.memory }}
                limits:
                  cpu: {{ .Values.resources.scraper.limits.cpu }}
                  memory: {{ .Values.resources.scraper.limits.memory }}
