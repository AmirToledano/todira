name: Diagnose — is whatsapp-app-secret actually set in the cluster (presence only, read-only)

# diagnose-whatsapp-webhook-arrival.yaml found total silence in the website pod's own logs
# across multiple real windows, including one covering the owner's live test message just now
# (2026-09-27 08:30-08:50 UTC) — zero mentions of the webhook path, zero mentions of his number,
# zero errors. Meanwhile the Meta App dashboard (business.facebook.com/developers.facebook.com)
# shows the webhook correctly configured: Callback URL = https://todira.app/webhook/whatsapp,
# "messages" field Subscribed, phone number Registered.
#
# website/whatsapp_webhook.py's _verify_signature fails CLOSED and returns a plain 403 with ZERO
# logging whenever the signature doesn't match — the ONLY case that logs anything is the secret
# being completely unset/empty ("WHATSAPP_APP_SECRET not set — rejecting webhook POST"). Since we
# saw no such log line either, this check rules out (or confirms) that specific empty-secret case
# without ever reading the secret's actual value — only whether it's empty or non-empty.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Check presence (not value) of whatsapp-app-secret and whatsapp-webhook-verify-token in the live website pod
        run: |
          echo "--- env vars actually present in the running website container (names + whether each is empty) ---"
          kubectl exec -n todira deploy/todira-website -- sh -c '
            for v in WHATSAPP_APP_SECRET WHATSAPP_WEBHOOK_VERIFY_TOKEN WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID; do
              val="$(printenv "$v" 2>/dev/null || true)"
              if [ -z "$val" ]; then
                echo "$v: EMPTY or UNSET"
              else
                echo "$v: set (length=${#val} chars)"
              fi
            done
          '
