name: Check — real identity of the Facebook account behind FACEBOOK_COOKIES (read-only)

# ONE-OFF, READ-ONLY, manual-only. Real trigger: before enabling the Facebook scraper CronJob for
# the first time, the owner asked to confirm the account is the dedicated one ("Dror Benjamin"),
# not a todira-branded account — verified live, not assumed, per this project's own discipline.
# Uses the exact same cookie/header fetch shape already confirmed working
# (diagnose-facebook-home-feed-and-notifications.yaml) — facebook.com/me/ redirects straight to
# the logged-in account's own profile URL, and the home feed's own <title> carries the account's
# real display name.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Fetch facebook.com/me/ and the home feed, using the stored cookie
        run: |
          COOKIE=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.facebook-cookies}' | base64 -d)
          echo "::add-mask::$COOKIE"
          if [ -z "$COOKIE" ]; then
            echo "facebook-cookies is empty in todira-bot-secret — nothing to test with."
            exit 1
          fi

          echo "=== Fetching https://www.facebook.com/me/ (redirects to the logged-in account's own profile) ==="
          curl -sS --compressed -L --max-redirs 5 \
            -D /tmp/fb_me_headers.txt \
            -o /tmp/fb_me_body.html \
            -w "http_status=%{http_code} size_bytes=%{size_download} final_url=%{url_effective}\n" \
            --max-time 30 \
            -H "Cookie: $COOKIE" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Upgrade-Insecure-Requests: 1" \
            "https://www.facebook.com/me/" || echo "curl_failed"

          echo "=== Also fetching https://www.facebook.com/ (home feed) for its <title> ==="
          curl -sS --compressed -L --max-redirs 5 \
            -o /tmp/fb_home_body.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 30 \
            -H "Cookie: $COOKIE" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            "https://www.facebook.com/" || echo "curl_failed"

      - name: Extract the account's own name/title from both fetches
        run: |
          python3 -c "
          import re
          print('=== /me/ redirect ===')
          try:
              with open('/tmp/fb_me_headers.txt', encoding='utf-8', errors='replace') as f:
                  headers = f.read()
              locations = re.findall(r'(?i)^location:\s*(.+)$', headers, re.M)
              print('Redirect chain (Location headers):', locations)
          except FileNotFoundError:
              print('(no headers file)')
          try:
              with open('/tmp/fb_me_body.html', encoding='utf-8', errors='replace') as f:
                  body = f.read()
              print(f'length={len(body)}')
              title_match = re.search(r'<title[^>]*>(.*?)</title>', body, re.S)
              print(f'Title: {title_match.group(1).strip() if title_match else \"(none)\"}')
              og_title = re.search(r'<meta property=\"og:title\" content=\"([^\"]*)\"', body)
              print(f'og:title: {og_title.group(1) if og_title else \"(none)\"}')
          except FileNotFoundError:
              print('(no body file)')

          print()
          print('=== home feed ===')
          try:
              with open('/tmp/fb_home_body.html', encoding='utf-8', errors='replace') as f:
                  body = f.read()
              print(f'length={len(body)}')
              title_match = re.search(r'<title[^>]*>(.*?)</title>', body, re.S)
              print(f'Title: {title_match.group(1).strip() if title_match else \"(none)\"}')
              # The logged-in account's own name/id often appears in embedded JSON as
              # ACCOUNT_ID / USER_ID / a CurrentUserInitialData-shaped node.
              name_hits = re.findall(r'\"(?:NAME|name)\":\"([^\"]{2,40})\"', body)[:10]
              print('First few \"name\" JSON values seen:', name_hits)
          except FileNotFoundError:
              print('(no home feed body file)')
          "
