name: Diagnose — Bright Data DCA trigger's real 400 Bad Request body (read-only, no scraper run needed)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-13.
#
# Real finding from tonight's safe-single-test-run.yaml: EVERY Bright Data DCA trigger call failed
# with 400 Bad Request (bright_data_enriched: 0 out of 85 new Yad2 listings) — bright_data_client.py's
# own _trigger_and_fetch_first_row only calls response.raise_for_status(), which raises before the
# response BODY is ever logged, so the real reason Bright Data rejected the request has never
# actually been seen. This replicates the EXACT same request shape (same collector id, same one of
# tonight's real failing URLs) directly against the real API and prints the full response body —
# settles the real cause without needing another full scraper run (no ZenRows cost at all; this is
# pure Bright Data API traffic).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Replay the exact failing trigger call and print the REAL response body
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_COLLECTOR_ID: ${{ secrets.BRIGHT_DATA_COLLECTOR_ID }}
        run: |
          echo "collector id (masked by GH, length only): ${#BRIGHT_DATA_COLLECTOR_ID} chars"
          curl -sS -X POST "https://api.brightdata.com/dca/trigger?collector=${BRIGHT_DATA_COLLECTOR_ID}&queue_next=1" \
            -H "Authorization: Bearer ${BRIGHT_DATA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '[{"url": "https://www.yad2.co.il/realestate/item/center-and-sharon/etfkmgb5"}]' \
            -o /tmp/trigger_response.json \
            -w "\nhttp_status=%{http_code}\n" \
            --max-time 30
          echo "--- full response body ---"
          cat /tmp/trigger_response.json
          echo ""

      - name: Also check the collector's own status via the Scraper Studio API (is it still active?)
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_COLLECTOR_ID: ${{ secrets.BRIGHT_DATA_COLLECTOR_ID }}
        run: |
          curl -sS "https://api.brightdata.com/dca/collections?collector=${BRIGHT_DATA_COLLECTOR_ID}" \
            -H "Authorization: Bearer ${BRIGHT_DATA_API_KEY}" \
            -o /tmp/collector_info.json \
            -w "\nhttp_status=%{http_code}\n" \
            --max-time 30 || true
          echo "--- collector info response (best-effort — endpoint shape not previously confirmed) ---"
          cat /tmp/collector_info.json 2>/dev/null || echo "(no response captured)"
          echo ""
