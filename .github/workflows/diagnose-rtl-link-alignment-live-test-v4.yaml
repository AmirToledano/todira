name: Diagnose - send 2 more targeted test messages, real production caption shape (v4)

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-29. Follow-up to v3, whose 6 tests gave
# a real, surprising result: tests 2 and 3 (the anchor tag as the ENTIRE, sole message content)
# both failed outright with a Telegram 400 "can't parse entities" error - but that shape never
# actually occurs in a real production caption (the anchor is always one line inside a much longer
# multi-line message, never the whole message by itself), so that specific failure mode may be a
# red herring from the isolated test shape, not what's really happening in production.
#
# This sends 2 more tests that instead exactly reproduce PRODUCTION's real caption shape (multiple
# lines joined by real newlines, other real field lines before/after):
#   - test 7: today's actual code shape - the anchor completely alone on its own physical line
#     (a real \n immediately before and after it), reproducing _build_body_lines' real output.
#   - test 8: a proposed fix - the location text and the anchor share ONE logical line, each
#     wrapped in its own independent RLE...PDF span, joined by a plain space (no \n between them)
#     - so wherever Telegram's own client happens to soft-wrap this line, each half still carries
#     its own local embedding rather than depending on one embedding surviving across a client-
#     chosen break point.
# Same ASCII-only-source technique as v3 (base64 bodies, computed and roundtrip-verified locally).
on:
  workflow_dispatch: {}

jobs:
  send-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send 2 more targeted test messages (bodies base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)

          send() {
            local n="$1"
            local body_b64="$2"
            local body
            body=$(echo "$body_b64" | base64 -d)
            echo "=== sending test $n ==="
            curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${OWNER_ID}" \
              --data-urlencode "text=${body}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
            cat /tmp/resp.json
            echo ""
          }

          send 7 ""
          send 8 ""

          echo "=== done - compare test 7 (today's real code shape) vs test 8 (proposed fix) ==="
