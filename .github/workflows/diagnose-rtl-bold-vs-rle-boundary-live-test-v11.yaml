name: Diagnose - v11, six real-shaped variants isolating bold-vs-RLE boundary placement

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-29. v9 proved a real production
# listing is genuinely broken; v10 tested removing <b> tags entirely. Per the owner's own request
# ("תשלח מלא ואני אגיד לך מה הכי תקין... תנסה לגעת בכל הדברים ולשנות דברים בכל מודעה"), this sends
# SIX real-shaped variants of the same real listing content (city+street link, price, rooms) in one
# batch, each isolating a different candidate cause, so the owner can compare them side by side in
# one go instead of one round-trip per hypothesis:
#   A: no bold, no RLE/PDF at all (pure baseline)
#   B: bold <b> tags, but NO RLE/PDF at all
#   C: RLE/PDF per line, but NO bold at all (same shape as v10's finding, shorter)
#   D: bold <b> tags AND RLE/PDF, but the RLE...PDF embedding is placed INSIDE each <b>/<a> tag
#      boundary instead of wrapping the whole line - never crossing an entity boundary
#   E: bold <b> tags AND RLE/PDF exactly as today's production code builds it (RLE wraps the WHOLE
#      line, crossing the <b>/<a> entity boundaries) - the real, confirmed-broken shape
#   F: bold <b> tags with a plain RLM mark (U+200F) instead of a full RLE...PDF embedding
on:
  workflow_dispatch: {}

jobs:
  send-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send all 6 variants as real sendPhoto captions (bodies base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)
          PHOTO_URL="https://raw.githubusercontent.com/AmirToledano/todira/main/common/todira_common/assets/dachshunds/todi_detective.jpg"

          send() {
            local n="$1"
            local body_b64="$2"
            local body
            body=$(echo "$body_b64" | base64 -d)
            echo "=== sending variant $n ==="
            curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
              --data-urlencode "chat_id=${OWNER_ID}" \
              --data-urlencode "photo=${PHOTO_URL}" \
              --data-urlencode "caption=${body}" \
              --data-urlencode "parse_mode=HTML" \
              -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
            cat /tmp/resp.json
            echo ""
            sleep 1
          }

          send A ""

          send B ""

          send C ""

          send D ""

          send E ""

          send F ""

          echo "=== done - all 6 variants sent ==="
