name: Diagnose — Bright Data real account balance + collector status (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-15.
#
# Direct continuation of diagnose-bright-data-stuck-same-result.yaml's finding: that live test
# proved the DCA collector accepts real, distinct trigger calls (real job ids back) but every poll
# returns the exact same stale cached record in well under half a second — physically too fast for
# a real scrape, and outside bright_data_client.py's own control (its trigger/poll/retry logic is
# all confirmed working correctly). Real, live web research (not guessed) into Bright Data's own
# API surface turned up two concrete, testable leads for WHY the platform side might be silently
# not executing real jobs:
#   1. The legacy DCA API this project uses is described as deprecated in favor of a newer
#      Datasets API v3 (/datasets/v3/trigger, dataset_id param) — possible the legacy endpoint
#      still accepts requests but no longer actually runs them for this account.
#   2. Every Bright Data account has a real monthly free-tier credit allowance — if exhausted,
#      real jobs may silently stop executing while the trigger call itself still succeeds.
# This workflow checks both directly against the real account: GET /customer/balance (real
# account credit/balance state) and GET /dca/collectors (this account's own collector list,
# looking for this collector's real status/active field — the earlier guess of
# /dca/collections?collector=X, plural mismatched, got a plain 404). Pure Bright Data API traffic,
# no Yad2/ZenRows cost, does not touch the live k8s scraper Job.
# 2026-09-15, later: this workflow originally read BRIGHT_DATA_API_KEY/BRIGHT_DATA_COLLECTOR_ID
# from GitHub Actions' own repo secrets — a completely separate store from the real k8s
# todira-bot-secret that production (and the owner's own key rotation via
# set-bright-data-api-key-secret.yaml) actually updates. That meant every run of this workflow was
# silently testing a stale, unrelated credential, never the real Admin key. Fixed to read from the
# real k8s secret, matching every other credential-using diagnostic in this repo (e.g.
# diagnose-bright-data-stuck-same-result.yaml, fixed the same way in PR #333).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read + mask the real Bright Data API key and collector id from the k8s secret
        run: |
          API_KEY=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.bright-data-api-key}' | base64 -d)
          COLLECTOR_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.bright-data-collector-id}' | base64 -d)
          echo "::add-mask::$API_KEY"
          echo "::add-mask::$COLLECTOR_ID"
          if [ -z "$API_KEY" ]; then
            echo "bright-data-api-key is empty in todira-bot-secret."
            exit 1
          fi
          echo "$API_KEY" > /tmp/bd_api_key.txt
          echo "$COLLECTOR_ID" > /tmp/bd_collector_id.txt

      - name: Check real account balance/credits
        run: |
          export BRIGHT_DATA_API_KEY=$(cat /tmp/bd_api_key.txt)
          echo "::add-mask::$BRIGHT_DATA_API_KEY"
          echo "=== GET https://api.brightdata.com/customer/balance ==="
          curl -sS "https://api.brightdata.com/customer/balance" \
            -H "Authorization: Bearer ${BRIGHT_DATA_API_KEY}" \
            -o /tmp/balance.json \
            -w "\nhttp_status=%{http_code}\n" \
            --max-time 30 || true
          echo "--- response body ---"
          cat /tmp/balance.json 2>/dev/null || echo "(no response captured)"
          echo ""

      - name: List this account's own collectors (real status/active field, if any)
        run: |
          export BRIGHT_DATA_API_KEY=$(cat /tmp/bd_api_key.txt)
          export BRIGHT_DATA_COLLECTOR_ID=$(cat /tmp/bd_collector_id.txt)
          echo "::add-mask::$BRIGHT_DATA_API_KEY"
          echo "::add-mask::$BRIGHT_DATA_COLLECTOR_ID"
          echo "collector id (masked by GH, length only): ${#BRIGHT_DATA_COLLECTOR_ID} chars"
          echo "=== GET https://api.brightdata.com/dca/collectors ==="
          curl -sS "https://api.brightdata.com/dca/collectors" \
            -H "Authorization: Bearer ${BRIGHT_DATA_API_KEY}" \
            -o /tmp/collectors.json \
            -w "\nhttp_status=%{http_code}\n" \
            --max-time 30 || true
          echo "--- response body ---"
          cat /tmp/collectors.json 2>/dev/null || echo "(no response captured)"
          echo ""

      - name: Check this specific collector's own status by id (path param, not query)
        run: |
          export BRIGHT_DATA_API_KEY=$(cat /tmp/bd_api_key.txt)
          export BRIGHT_DATA_COLLECTOR_ID=$(cat /tmp/bd_collector_id.txt)
          echo "::add-mask::$BRIGHT_DATA_API_KEY"
          echo "::add-mask::$BRIGHT_DATA_COLLECTOR_ID"
          echo "=== GET https://api.brightdata.com/dca/collectors/\$BRIGHT_DATA_COLLECTOR_ID ==="
          curl -sS "https://api.brightdata.com/dca/collectors/${BRIGHT_DATA_COLLECTOR_ID}" \
            -H "Authorization: Bearer ${BRIGHT_DATA_API_KEY}" \
            -o /tmp/collector_detail.json \
            -w "\nhttp_status=%{http_code}\n" \
            --max-time 30 || true
          echo "--- response body ---"
          cat /tmp/collector_detail.json 2>/dev/null || echo "(no response captured)"
          echo ""
