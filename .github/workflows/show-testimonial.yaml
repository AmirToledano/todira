name: Show a message on the reviews page (owner's request)

# 2026-11-03 (owner): puts one message on /reviews, the same as the "show on the home page" button on /admin/messages.
# 2026-11-04 (bug sweep): by message id (the number on /admin/messages), not by name, and only a message that may be
# shown (a bot testimonial or site feedback without "don't publish"); force=yes is the owner's own word that the writer
# agreed some other way (as with the 2026-11-03 message).
on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "The message number"
        required: true
      force:
        description: "yes = the writer agreed outside the form (the owner checked)"
        required: false
        default: "no"

permissions:
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
      - name: Show it
        env:
          MID: ${{ inputs.message_id }}
          FORCE: ${{ inputs.force }}
        run: |
          POD=$(kubectl get pods -n todira -l app=todira-bot --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          [ -n "$POD" ] || { echo "no running bot pod"; exit 1; }
          cat > /tmp/s.py <<'PY'
          import os, sys
                    from todira_common import testimonials
          from todira_common.db import get_session
          from todira_common.models import ContactMessage
          mid = os.environ["MID"].strip()
          if not mid.isdigit():
              sys.exit("message_id must be a number")
          with get_session() as s:
              row = s.get(ContactMessage, int(mid))
              if row is None:
                  sys.exit("no such message")
              if not testimonials.can_show(s, row):
                  if os.environ.get("FORCE", "no").strip() != "yes":
                      sys.exit("this message may not be shown (opted out or not feedback); force=yes only with the writer's consent")
                  testimonials.mark_public_ok(s, row.id)
              testimonials.set_shown(s, row.id, True)
              print("shown: message", row.id)
          PY
          kubectl exec -i -n todira "$POD" -- env MID="$MID" FORCE="$FORCE" python - < /tmp/s.py
