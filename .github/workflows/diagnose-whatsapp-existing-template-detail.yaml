name: Diagnose — full detail (category, components) of the existing new_listing_match template

# Before submitting a NEW, richer WhatsApp Message Template (image header + more fields + a
# dynamic per-listing URL button, to match the "Dorin" reference format the owner asked for), we
# want the real category (UTILITY vs MARKETING) Meta already approved for new_listing_match — the
# same content shape (a filter-triggered listing-match alert), so whatever category worked once is
# the safest default for the new template too, rather than guessing. Reuses the WABA id
# (1814744176326509, from diagnose-whatsapp-template-approval.yaml's own comment) and the same
# k8s-pod-with-real-secret pattern as every other diagnose-whatsapp-*.yaml in this repo.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Full detail of the new_listing_match template on the known WABA
        run: |
          kubectl delete pod diag-template-detail -n todira --ignore-not-found --wait=true
          cat <<PODYAML | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-template-detail
          spec:
            restartPolicy: Never
            containers:
              - name: diag-template-detail
                image: python:3.11-slim
                env:
                  - name: WHATSAPP_ACCESS_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: todira-bot-secret
                        key: whatsapp-access-token
                        optional: true
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    pip install --quiet httpx
                    python3 -c "
                    import os, httpx
                    token = os.environ.get('WHATSAPP_ACCESS_TOKEN')
                    waba_id = '1814744176326509'
                    r = httpx.get(
                        f'https://graph.facebook.com/v21.0/{waba_id}/message_templates',
                        params={'name': 'new_listing_match'},
                        headers={'Authorization': f'Bearer {token}'},
                        timeout=15,
                    )
                    print('status:', r.status_code)
                    print(r.text)
                    "
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod diag-template-detail -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          echo "--- pod logs ---"
          kubectl logs -n todira diag-template-detail || true
          kubectl delete pod diag-template-detail -n todira --ignore-not-found
