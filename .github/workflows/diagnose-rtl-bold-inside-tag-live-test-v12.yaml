name: Diagnose - v12, restore bold with RLE strictly INSIDE each tag boundary

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-30. PR #565 dropped <b> entirely for
# RTL captions after a live A/B proved a bold entity crossing this file's RLE...PDF embedding
# renders broken. Real owner follow-up: bold styling matters to them (font/emphasis), asked
# directly whether it can come back.
#
# This tests one specific, not-yet-cleanly-tried fix: instead of one RLE...PDF wrapping the WHOLE
# line (crossing the <b> boundary, the confirmed-broken shape), give EVERY run its own embedding
# that never crosses a tag boundary - the plain text before a <b>/<a> tag gets its own RLE...PDF,
# the tag's own inner text gets its own RLE...PDF placed INSIDE the tag, and the plain text after
# gets its own RLE...PDF. An earlier attempt at this idea (v11's "variant D") was confounded by a
# separate bug (a short last line always breaks, see v6/v7) and never got a clean read. This uses
# the EXACT real listing 21873 content (same real fields, same real multi-line description, same
# real footer link) so the last line is naturally long/real, same successful shape as v9/v10.
on:
  workflow_dispatch: {}

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send test 15 as a real sendPhoto caption - bold restored, RLE never crosses a tag (body base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)
          PHOTO_URL="https://raw.githubusercontent.com/AmirToledano/todira/main/common/todira_common/assets/dachshunds/todi_detective.jpg"

          BODY_B64=""
          BODY=$(echo "$BODY_B64" | base64 -d)

          echo "=== sending test 15 as sendPhoto caption ==="
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "photo=${PHOTO_URL}" \
            --data-urlencode "caption=${BODY}" \
            --data-urlencode "parse_mode=HTML" \
            -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
          cat /tmp/resp.json
          echo ""
          echo "=== done - does bold now render correctly since RLE never crosses a tag boundary? ==="
