name: Set Facebook cookies secret (manual, value typed only into this form)

# Patches the todira-bot-secret K8s secret's `facebook-cookies` key — a real, logged-in session
# cookie string for the DEDICATED (never the owner's personal) Facebook account used to scrape
# Marketplace/Groups listings, once facebook_client.py is built to actually use it.
#
# Same reasoning and mechanics as set-whatsapp-secret.yaml / set-bright-data-isp-secret.yaml
# (masks the value from this run's own logs before anything else touches it) — run this DIRECTLY
# from the GitHub Actions UI (Actions tab -> this workflow -> "Run workflow"), pasting the cookie
# string straight into the form field there. NEVER paste it into a chat/AI session — a session
# cookie is equivalent to a password for that account; anywhere it's typed outside this form is a
# real, permanent exposure that can't be undone, only rotated (re-export fresh cookies and re-run
# this workflow) — see PROJECT_STATE.md's 2026-09-15 Facebook entry for the real incident this
# workflow exists to prevent from recurring.
#
# Where the value comes from: log into the dedicated account in a real browser, open DevTools
# (F12) -> Application/Storage tab -> Cookies -> https://www.facebook.com, select all rows,
# copy, and build ONE string in this exact shape (semicolon-separated name=value pairs, no
# spaces around the =): c_user=...; xs=...; datr=...; sb=...; fr=...; (include every row the
# cookie table shows — extras are harmless, but c_user and xs are the two that actually matter).
#
# No deployment restart needed afterward — whichever pod first calls facebook_client.py's own
# fetch function after this reads the freshly patched secret automatically.
on:
  workflow_dispatch:
    inputs:
      cookie_header:
        description: "Full Cookie header string (name=value; name=value; ...) - leave blank to skip"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask the provided value from this run's own logs
        # Same ordering reasoning as set-whatsapp-secret.yaml's own step: reads the raw value from
        # $GITHUB_EVENT_PATH via jq (not an `env:` block or ${{ inputs.x }} interpolated into the
        # script text) so nothing is echoed unmasked before the mask is registered.
        run: |
          COOKIE=$(jq -r '.inputs.cookie_header // ""' "$GITHUB_EVENT_PATH")
          [ -n "$COOKIE" ] && echo "::add-mask::$COOKIE"
          true

      - name: Patch the secret, only if a value was actually provided
        env:
          COOKIE: ${{ inputs.cookie_header }}
        run: |
          if [ -z "$COOKIE" ]; then
            echo "No value provided - nothing to patch."
            exit 0
          fi
          B64=$(printf '%s' "$COOKIE" | base64 | tr -d '\n')
          kubectl patch secret todira-bot-secret -n todira --type merge \
            -p "{\"data\":{\"facebook-cookies\":\"$B64\"}}"
          echo "Patched todira-bot-secret's facebook-cookies key. Next pod that reads it picks up the fresh value automatically."
