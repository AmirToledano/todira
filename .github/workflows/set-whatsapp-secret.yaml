name: Set WhatsApp secret values (manual, values typed only into this form)

# Patches the todira-bot-secret K8s secret's WhatsApp keys (whatsapp-access-token,
# whatsapp-phone-number-id, whatsapp-webhook-verify-token, whatsapp-app-secret) — the values
# website-deployment.yaml wires into WHATSAPP_ACCESS_TOKEN / WHATSAPP_PHONE_NUMBER_ID /
# WHATSAPP_WEBHOOK_VERIFY_TOKEN / WHATSAPP_APP_SECRET (see website/whatsapp_client.py and
# whatsapp_webhook.py). Exists so these credentials never have to be pasted into a chat/AI
# session to get configured — run this directly from the GitHub Actions UI (Actions tab → this
# workflow → "Run workflow"), typing each value straight into the form fields there. Each
# provided input is masked from this run's own logs immediately (`::add-mask::`) before anything
# else happens. Leave a field blank to leave that key in the secret untouched (this patches only
# the keys you actually fill in, via a JSON merge — it does not require or overwrite the others).
#
# Where each value comes from (see the app's "Connect on WhatsApp" > Customize > "Step 1. Try it
# out" page in developers.facebook.com):
#   access_token         - "Access token" field on that page (regenerate anytime with
#                           "Generate new token" if it expires — the test token is short-lived)
#   phone_number_id      - "Phone Number ID" field on that page
#   webhook_verify_token - NOT given by Meta - you invent this string yourself, then enter the
#                           SAME value in Meta's own webhook configuration screen (Verify Token
#                           field) when subscribing the webhook URL
#   app_secret           - App settings > Basic > "App secret" (click "Show") - NOT the access
#                           token; used only to verify inbound webhook signatures
on:
  workflow_dispatch:
    inputs:
      access_token:
        description: "WhatsApp access token (from the Try it out page) - leave blank to skip"
        required: false
        type: string
      phone_number_id:
        description: "Phone Number ID (from the Try it out page) - leave blank to skip"
        required: false
        type: string
      webhook_verify_token:
        description: "Webhook verify token (a string YOU choose) - leave blank to skip"
        required: false
        type: string
      app_secret:
        description: "App secret (App settings > Basic > App secret) - leave blank to skip"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask every provided value from this run's own logs
        # MUST bind via env: here, exactly like the next step - interpolating
        # ${{ inputs.x }} directly into `run:` text makes GitHub Actions echo the raw,
        # unmasked value as part of the step's own "Run <command>" log line BEFORE this
        # mask takes effect (masking only affects output printed AFTER it's registered,
        # never the command line that produced it). A real run (2026-09-02) leaked the
        # access token, phone number ID, and webhook verify token in plaintext this exact
        # way - rotate any credential that ever went through the old version of this step.
        env:
          ACCESS_TOKEN: ${{ inputs.access_token }}
          PHONE_NUMBER_ID: ${{ inputs.phone_number_id }}
          WEBHOOK_VERIFY_TOKEN: ${{ inputs.webhook_verify_token }}
          APP_SECRET: ${{ inputs.app_secret }}
        run: |
          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$PHONE_NUMBER_ID"
          echo "::add-mask::$WEBHOOK_VERIFY_TOKEN"
          echo "::add-mask::$APP_SECRET"

      - name: Patch only the keys that were actually provided
        env:
          ACCESS_TOKEN: ${{ inputs.access_token }}
          PHONE_NUMBER_ID: ${{ inputs.phone_number_id }}
          WEBHOOK_VERIFY_TOKEN: ${{ inputs.webhook_verify_token }}
          APP_SECRET: ${{ inputs.app_secret }}
        run: |
          PATCH='{"data":{}}'
          add_key() {
            key="$1"; value="$2"
            if [ -n "$value" ]; then
              b64=$(printf '%s' "$value" | base64 | tr -d '\n')
              PATCH=$(printf '%s' "$PATCH" | jq --arg k "$key" --arg v "$b64" '.data[$k] = $v')
            fi
          }
          add_key "whatsapp-access-token" "$ACCESS_TOKEN"
          add_key "whatsapp-phone-number-id" "$PHONE_NUMBER_ID"
          add_key "whatsapp-webhook-verify-token" "$WEBHOOK_VERIFY_TOKEN"
          add_key "whatsapp-app-secret" "$APP_SECRET"

          if [ "$(printf '%s' "$PATCH" | jq -c '.data')" = "{}" ]; then
            echo "No values provided - nothing to patch."
            exit 0
          fi

          kubectl patch secret todira-bot-secret -n todira --type merge -p "$PATCH"
          echo "Patched. Restarting the website deployment to pick up the new values..."
          kubectl rollout restart deployment/todira-website -n todira
