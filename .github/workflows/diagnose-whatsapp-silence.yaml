name: Diagnose - WhatsApp send outcomes per scraper run (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch) - 2026-10-01. The owner's phone shows a burst of
# plain-template WhatsApp match messages at 13:09-13:10 Israel time and then nothing, although the
# scraper kept running hourly and recorded 'new' sent_notifications for the owner until 22:20. So the
# WhatsApp leg is what went silent. For every retained scraper pod this counts Meta's HTTP answers
# (graph.facebook.com) by status and lists the distinct WhatsApp send/upload failures, ignoring the
# photo-download noise that drowned the first version of this diagnostic. Prints no phone numbers.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Per scraper pod - Meta HTTP answers and WhatsApp failures
        run: |
          date -u
          for POD in $(kubectl get pods -n todira -l app=todira-scraper --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[*].metadata.name}'); do
            echo "################ $POD"
            kubectl get pod "$POD" -n todira -o jsonpath='{.status.phase}{" started="}{.status.startTime}{"\n"}'
            kubectl logs -n todira "$POD" > /tmp/pod.log 2>&1 || true
            echo "log lines: $(wc -l < /tmp/pod.log)"
            echo "--- Meta (graph.facebook.com) answers by endpoint + status ---"
            grep "graph.facebook.com" /tmp/pod.log | sed -E 's#.*(POST|GET) https://graph.facebook.com/[^/]+/[0-9]+/([a-z_]+).*"HTTP/1.1 ([0-9]+).*#\1 \2 -> \3#' | sort | uniq -c || true
            echo "--- distinct WhatsApp failures ---"
            grep -E "Failed to (send|upload)|WhatsApp|whatsapp" /tmp/pod.log | grep -v "Photo failed" | sed -E 's/^[0-9-]+ [0-9:,]+ //; s/[0-9]{11,}/<num>/g' | sort | uniq -c | sort -rn | head -12 || true
            echo "--- run summary ---"
            grep "Scraper run summary" /tmp/pod.log | sed -E 's/.*summary: //' || true
          done
