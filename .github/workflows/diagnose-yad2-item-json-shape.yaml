name: Diagnose Yad2 - shape and sustained rate of the free item JSON endpoint (read-only, no values)

# Read-only, manual-only. Gemini (the only listing-detail fetcher) answers HTTP 402 on every model, so Yad2 cards go out without a
# description, total floors, entry date or features. The map API works for free with a browser TLS fingerprint; this checks whether the
# per-listing JSON endpoint that Yad2's own pages use works the same way. It takes a handful of tokens from one small map piece, asks a few
# candidate endpoints for each and prints ONLY status codes, content kinds and which field names exist (booleans) - no description text,
# no values, nothing about any person.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Probe in a throwaway pod
        run: |
          POD_NAME="item-json-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import collections, json, subprocess, sys, time
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "curl_cffi"])
          from curl_cffi import requests as cr
          H = {"Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7"}
          tokens = []
          for box in ("32.060000,34.760000,32.090000,34.800000", "31.240000,34.770000,31.270000,34.820000", "32.780000,34.960000,32.810000,35.020000"):
              r = cr.get(f"https://gw.yad2.co.il/realestate-feed/rent/map?region=3&bBox={box}&zoom=14", headers=H, impersonate="chrome", timeout=30)
              if r.status_code == 200:
                  tokens += [m.get("token") for m in ((r.json().get("data") or {}).get("markers") or []) if m.get("token")]
          tokens = list(dict.fromkeys(tokens))
          print(f"== tokens collected: {len(tokens)}", flush=True)

          def paths(o, prefix, depth, out):
              if isinstance(o, dict):
                  for k, v in o.items():
                      paths(v, f"{prefix}.{k}" if prefix else k, depth + 1, out)
              elif isinstance(o, list):
                  out[prefix + "[]"] += 1
                  for v in o[:1]:
                      if depth < 5:
                          paths(v, prefix + "[]", depth + 1, out)
              else:
                  out[f"{prefix} ({type(o).__name__})"] += 1

          statuses = collections.Counter()
          presence = collections.Counter()
          ok = 0
          started = time.time()
          for i, t in enumerate(tokens[:60]):
              time.sleep(0.5)
              try:
                  resp = cr.get(f"https://gw.yad2.co.il/realestate-item/{t}", headers=H, impersonate="chrome", timeout=30, allow_redirects=False)
              except Exception as e:
                  statuses["error:" + type(e).__name__] += 1
                  continue
              statuses[resp.status_code] += 1
              if resp.status_code != 200:
                  continue
              try:
                  data = resp.json()
              except ValueError:
                  statuses["non-json"] += 1
                  continue
              ok += 1
              seen = collections.Counter()
              paths(data, "", 0, seen)
              for p in seen:
                  presence[p] += 1
          print(f"== requests={min(60, len(tokens))} seconds={time.time() - started:.0f} statuses={dict(statuses)}", flush=True)
          for p, n in sorted(presence.items()):
              print(f"==   {p}  in {n}/{ok}", flush=True)
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 300
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "-u", "/script/pod.py"]
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait, print results, clean up (always)
        if: always()
        run: |
          for i in $(seq 1 100); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- results ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep "^==" || kubectl logs -n todira "$POD_NAME" 2>&1 | tail -10
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
