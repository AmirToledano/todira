name: Diagnose Yad2 - are the ads we hid as "taken down" really gone? (read-only, no ad text)

# 2026-10-22 (owner: make sure we never hide a flat that is still published). About 40,000 Yad2 ads were hidden as taken
# down in a week. This asks Yad2's own per-ad endpoint about 60 random ads hidden in the last two days and 20 live ones
# (the control group) and prints only counts per answer kind, plus the values of any status-like fields - no ad text, no ids.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Probe in a throwaway pod
        run: |
          POD_NAME="delist-check-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import collections, os, re, subprocess, sys, time
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "curl_cffi", "psycopg2-binary"])
          import psycopg2
          from curl_cffi import requests as cr
          cur = psycopg2.connect("postgresql://" + os.environ["DATABASE_URL"].split("://", 1)[1]).cursor()
          H = {"Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7"}
          def tokens(where, order, n):
              cur.execute(f"select url from listings where source='yad2' and {where} order by {order} limit {n}")
              return [m.group(1) for (u,) in cur.fetchall() for m in [re.search(r"/item/([A-Za-z0-9]+)", u)] if m]
          groups = {
              "hidden as taken down in the last 2 days (random 60)": tokens("is_delisted and delisted_at > now() - interval '2 days'", "random()", 60),
              # 2026-10-22: hidden only after verify-before-hide went live (#891, deployed ~10:40 UTC).
              "hidden in the last 4 hours (random 60)": tokens("is_delisted and delisted_at > now() - interval '4 hours'", "random()", 60),
              "live (random 20, control)": tokens("not is_delisted and duplicate_of_id is null", "random()", 20),
          }
          for label, toks in groups.items():
              shapes = collections.Counter()
              for t in toks:
                  time.sleep(0.5)
                  try:
                      r = cr.get(f"https://gw.yad2.co.il/realestate-item/{t}", headers=H, impersonate="chrome", timeout=30, allow_redirects=False)
                  except Exception as e:
                      shapes[f"error:{type(e).__name__}"] += 1
                      continue
                  try:
                      j = r.json()
                  except ValueError:
                      shapes[f"status={r.status_code} non-json bytes={len(r.text or '')}"] += 1
                      continue
                  if isinstance(j, dict):
                      data = j.get("data")
                      if isinstance(data, dict) and data:
                          flags = sorted(f"{k}={str(v)[:20]}" for k, v in data.items()
                                         if any(w in k.lower() for w in ("status", "active", "deleted", "removed", "expire")) and not isinstance(v, (dict, list)))
                          shapes[f"status={r.status_code} has the ad record; status-like fields: {flags}"] += 1
                      else:
                          shapes[f"status={r.status_code} no ad record (keys={sorted(j.keys())[:6]})"] += 1
                  else:
                      shapes[f"status={r.status_code} json={type(j).__name__}"] += 1
              print(f"== {label}: asked={len(toks)}", flush=True)
              for shape, n in shapes.most_common():
                  print(f"==   {n}x {shape}", flush=True)
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 400
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "-u", "/script/pod.py"]
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait, print results, clean up (always)
        if: always()
        run: |
          for i in $(seq 1 140); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- results ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep "^==" || kubectl logs -n todira "$POD_NAME" 2>&1 | tail -10
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
