name: Diagnose — does OWNER_TELEGRAM_USER_ID match a given telegram_user_id (match only, read-only)

# Real owner question: is his own account (a given telegram_user_id) actually the one gated as
# "owner" for /admin/users (grant/revoke free_access_granted) and /contact-form Telegram
# notifications -- both keyed off website/main.py's _is_owner_id, itself a straight string compare
# against the OWNER_TELEGRAM_USER_ID secret. Prints only whether they match, never the secret's
# actual value.
on:
  workflow_dispatch:
    inputs:
      telegram_user_id:
        description: "The telegram_user_id to check against the deployed OWNER_TELEGRAM_USER_ID secret"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Compare (match only, never print the secret)
        run: |
          kubectl exec -n todira deploy/todira-website -- sh -c "
            if [ -z \"\$OWNER_TELEGRAM_USER_ID\" ]; then
              echo 'RESULT: OWNER_TELEGRAM_USER_ID is not set at all in the live pod.'
            elif [ \"\$OWNER_TELEGRAM_USER_ID\" = \"${{ inputs.telegram_user_id }}\" ]; then
              echo 'RESULT: MATCH — this telegram_user_id is currently the owner.'
            else
              echo 'RESULT: NO MATCH — this telegram_user_id is NOT the currently configured owner.'
            fi
          "
