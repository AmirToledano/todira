name: Diagnose — is the Yad2 catch-up fix Job still running, and what's its real status now? (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-14, made
# GENERIC 2026-09-14 (same day): originally hardcoded to one specific Job name from the run that
# created this workflow, which broke the very next time yad2-catchup-fix-run.yaml was dispatched
# again (each dispatch creates a Job named todira-scraper-yad2-fix-<unix timestamp>, a NEW name
# every time) — this workflow just silently reported "(job not found)" instead of the real,
# still-running Job. Now finds the MOST RECENT Job whose name starts with
# "todira-scraper-yad2-fix-" dynamically (sorted by creationTimestamp), so it always checks
# whichever catch-up run is actually the latest one, without needing to be edited each time.
#
# Reads ONLY — no patch, no new job creation, nothing that could trigger a new scraper run or
# touch spec.suspend.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Find the most recent todira-scraper-yad2-fix-* Job, then its real current status
        run: |
          JOB_NAME=$(kubectl get jobs -n todira -o json \
            | python3 -c "
          import json, sys
          jobs = json.load(sys.stdin)['items']
          candidates = [j for j in jobs if j['metadata']['name'].startswith('todira-scraper-yad2-fix-')]
          candidates.sort(key=lambda j: j['metadata']['creationTimestamp'])
          print(candidates[-1]['metadata']['name'] if candidates else '')
          ")
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"
          if [ -z "$JOB_NAME" ]; then
            echo "(no todira-scraper-yad2-fix-* job found at all — none running or already TTL'd/cleaned up)"
            exit 0
          fi
          echo "Most recent catch-up Job: $JOB_NAME"
          echo "--- job status ---"
          kubectl get job "$JOB_NAME" -n todira -o wide
          echo
          echo "--- job conditions (Complete/Failed only appear here) ---"
          kubectl get job "$JOB_NAME" -n todira -o jsonpath='{.status}' 2>/dev/null || true
          echo
          echo "--- pod(s) for this job ---"
          kubectl get pods -n todira -l job-name="$JOB_NAME" -o wide || true

      - name: Whatever logs exist right now for this job's pod (full — the job may have kept going past the 20-min window)
        run: |
          if [ -z "$JOB_NAME" ]; then
            echo "(no job — nothing to fetch logs for)"
            exit 0
          fi
          POD=$(kubectl get pods -n todira -l job-name="$JOB_NAME" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -z "$POD" ]; then
            echo "(no pod found for this job right now)"
            exit 0
          fi
          echo "POD=$POD"
          kubectl logs -n todira "$POD" --timestamps > /tmp/pod.log 2>&1 || echo "(logs command failed — pod may have been evicted/cleaned up)"
          echo "--- full captured logs ---"
          cat /tmp/pod.log 2>/dev/null || echo "(no logs captured)"
          echo
          echo "--- run-summary / delisted / notification / ZenRows-quota lines specifically ---"
          grep -iE "summary|notification|restricting|owner|bright_data_enriched|delisted|Scraping source=|Fetching Yad2 listings for region=|AUTH004|Usage exceeded|usage limit" /tmp/pod.log 2>/dev/null || echo "(none found)"

      - name: Confirm the CronJob's OWN schedule is still suspended (informational only — this workflow never touches it)
        run: |
          SUSPEND=$(kubectl get cronjob todira-scraper -n todira -o jsonpath='{.spec.suspend}')
          echo "todira-scraper CronJob spec.suspend = $SUSPEND (this workflow does not touch this field)"
