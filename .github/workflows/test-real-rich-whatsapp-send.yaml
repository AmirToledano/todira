name: Test - send ONE real rich WhatsApp listing card to the owner's own account

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-30, right after Meta approved
# new_listing_match_rich and PR #584 switched scraper.whatsappRichMatchTemplateName on. The approval
# and the env var flip are confirmed, but no real send through the rich path has happened yet, and
# scraper/notifier.py's own fail-soft logging never prints Meta's response body.
#
# Runs the REAL scraper image with the REAL cronjob env (copied from the live todira-scraper
# CronJob, so it includes WHATSAPP_RICH_MATCH_TEMPLATE_NAME exactly as deployed) and calls the real
# notifier._send_whatsapp_rich_match_template on a real recent listing, sending ONLY to the owner's
# own opted-in account (OWNER_TELEGRAM_USER_ID) - never an arbitrary user. The owner's phone number
# is never printed: a successful Meta response echoes the recipient (and a message id encodes it), so
# only the HTTP status is logged on success, plus Meta's error body on failure.
on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which template path to send: rich, plain or both (default both)"
        required: false
        default: "both"
        type: choice
        options: [both, rich, plain]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Run the real rich-send path in a pod cloned from the live scraper CronJob
        run: |
          cat <<'PYEOF' > /tmp/rich_send_test.py
          import logging
          import os

          from sqlalchemy import select

          logging.basicConfig(level=logging.INFO)

          import notifier
          from todira_common import whatsapp_client
          from todira_common.db import get_session
          from todira_common.models import Listing, User

          print("WHATSAPP_RICH_MATCH_TEMPLATE_NAME =", repr(notifier.WHATSAPP_RICH_MATCH_TEMPLATE_NAME))

          _orig_post = whatsapp_client._http_client.post


          def _spy_post(url, **kwargs):
              response = _orig_post(url, **kwargs)
              endpoint = url.rsplit("/", 1)[-1]
              if response.status_code >= 400:
                  print("META", endpoint, response.status_code, response.text)
              else:
                  # A success body echoes the recipient, and a message id (wamid) base64-encodes
                  # the recipient's number - neither may reach the log, so only the status prints.
                  print("META", endpoint, response.status_code, "ok")
              return response


          whatsapp_client._http_client.post = _spy_post

          with get_session() as session:
              owner_tg_id = int(os.environ["OWNER_TELEGRAM_USER_ID"])
              user = session.scalars(select(User).where(User.telegram_user_id == owner_tg_id)).first()
              if user is None:
                  raise SystemExit("RESULT: owner user row not found")
              print("owner has linked number:", bool(user.whatsapp_phone_number))
              print("owner opted in:", bool(user.whatsapp_notifications_opted_in))
              print("_whatsapp_eligible:", notifier._whatsapp_eligible(user))
              if not (user.whatsapp_phone_number and user.whatsapp_notifications_opted_in):
                  raise SystemExit("RESULT: owner not WhatsApp-eligible - not sending")

              listing = session.scalars(
                  select(Listing)
                  .where(Listing.is_delisted.is_(False))
                  .where(Listing.duplicate_of_id.is_(None))
                  .where(Listing.description.isnot(None))
                  .where(Listing.deal_type == "rent")
                  .where(Listing.image_urls != [])
                  .order_by(Listing.scraped_at.desc())
                  .limit(1)
              ).first()
              if listing is None:
                  raise SystemExit("RESULT: no suitable real listing found")
              print(f"using REAL listing id={listing.id} city={listing.city!r} street={listing.street!r}")

              which = os.environ.get("WHICH", "both")
              if which in ("rich", "both"):
                  ok = notifier._send_whatsapp_rich_match_template(user, listing)
                  print("rich template send returned:", ok)
              if which in ("plain", "both"):
                  notifier.WHATSAPP_RICH_MATCH_TEMPLATE_NAME = None
                  ok = notifier._send_whatsapp_match_template(user, listing)
                  print("plain template send returned:", ok)
          PYEOF

          kubectl get cronjob todira-scraper -n todira -o json > /tmp/cronjob.json
          python3 - <<'PYEOF'
          import json

          cron = json.load(open("/tmp/cronjob.json"))
          pod_spec = cron["spec"]["jobTemplate"]["spec"]["template"]["spec"]
          container = pod_spec["containers"][0]
          container["name"] = "rich-send-test"
          container["command"] = ["python", "-u", "-c", open("/tmp/rich_send_test.py").read()]
          container.setdefault("env", []).append({"name": "WHICH", "value": "${{ inputs.which }}"})
          container.pop("args", None)
          pod_spec["restartPolicy"] = "Never"
          pod = {
              "apiVersion": "v1",
              "kind": "Pod",
              "metadata": {"name": "test-rich-wa-send", "namespace": "todira"},
              "spec": pod_spec,
          }
          json.dump(pod, open("/tmp/pod.json", "w"))
          PYEOF

          kubectl delete pod test-rich-wa-send -n todira --ignore-not-found --wait=true
          kubectl apply -f /tmp/pod.json
          for i in $(seq 1 60); do
            PHASE=$(kubectl get pod test-rich-wa-send -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- pod logs ---"
          kubectl logs -n todira test-rich-wa-send || true
          kubectl delete pod test-rich-wa-send -n todira --ignore-not-found

      - name: Meta's delivery statuses for those sends, as logged by the website webhook
        run: |
          # Statuses (sent / delivered / read / failed, with Meta's error code on a failure) arrive
          # asynchronously on the website's own webhook - give them a moment, then read the log.
          sleep 40
          POD=$(kubectl get pods -n todira -l app=todira-website -o jsonpath='{.items[0].metadata.name}')
          kubectl logs -n todira "$POD" --since=5m 2>&1 | grep "WhatsApp delivery" || echo "no delivery status lines yet"
