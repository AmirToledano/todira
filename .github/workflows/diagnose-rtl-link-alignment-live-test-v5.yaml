name: Diagnose - v5, isolate whether a link ENTITY corrupts LATER lines in the same message

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-29. v4's real result (owner confirmed
# via a live screenshot): in TEST 7 and TEST 8, the location line(s) rendered correctly right-
# aligned, but the THIRD line (the price line, plain text with no link of its own) rendered flush
# LEFT in both - even though it's wrapped in its own independent RLE...PDF span exactly like the
# line before it. The one thing both broken cases share: a line containing a real <a> link entity
# appears somewhere EARLIER in the same message. This sends 2 more tests to nail the exact
# mechanism:
#   - TEST 9: the identical 3-line shape as TEST 7, but with NO link anywhere (plain text
#     street) - if line 3 now renders correctly, that proves the link entity itself is the cause,
#     not just "a message with 3+ lines" in general.
#   - TEST 10: the identical 3 lines, but with the link moved to the LAST line instead of the
#     middle one - if the link's own line renders fine now (nothing comes after it to corrupt),
#     that confirms corruption hits the line(s) AFTER a link, not the link's own line.
on:
  workflow_dispatch: {}

jobs:
  send-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send 2 more targeted test messages (bodies base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)

          send() {
            local n="$1"
            local body_b64="$2"
            local body
            body=$(echo "$body_b64" | base64 -d)
            echo "=== sending test $n ==="
            curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${OWNER_ID}" \
              --data-urlencode "text=${body}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
            cat /tmp/resp.json
            echo ""
          }

          send 9 "8J+nqiBURVNUIDkgLSBzYW1lIDMgbGluZXMgYXMgVEVTVCA3LCBidXQgTk8gbGluayBhdCBhbGwgKGlzb2xhdGVzIHRoZSByZWFsIGNhdXNlKQrigKvwn5ON16LXk9eZIC0g16LXk9eZ4oCsCuKAq9eQ15zXldefIDEy4oCsCuKAq/CfkrAg157Xl9eZ16g6IDQsMTUw4oKq4oCs"
          send 10 ""

          echo "=== done - compare test 9 (no link) vs test 10 (link on last line) ==="
