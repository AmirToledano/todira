name: Diagnose - why 3 for-sale chunk writes failed and who got the 740 Facebook-job notifications (read-only, counts only)

# Read-only, manual-only. After the 06:00 UTC run: (1) three chunks of the for-sale sweep failed to write - print the error lines of that
# scraper pod (exception class and first 300 characters of each error line only); (2) the Facebook job's run reported 740 notifications -
# print aggregate counts of the notifications sent in the last 100 minutes by listing source / deal type / age bucket at send time, and
# the largest number any single user received (a number, no ids). Nothing about any listing or user is printed.
on:
  workflow_dispatch:
    inputs:
      job_name:
        description: "Scraper Job whose pod log to scan (e.g. todira-scraper-29858760)"
        required: true
        default: "todira-scraper-29858760"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Error lines of the scraper pod
        run: |
          POD=$(kubectl get pods -n todira -l job-name="${{ inputs.job_name }}" -o jsonpath='{.items[0].metadata.name}')
          echo "pod: $POD"
          kubectl logs -n todira "$POD" 2>/dev/null | grep -n -E "writing a chunk|Error|error:|exc\.|psycopg|Traceback|Timeout|timeout|deadlock|too many|statement" | cut -c1-300 | head -40

      - name: Notification breakdown in a throwaway pod
        run: |
          POD_NAME="notifs-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "psycopg2-binary"])
          import os, psycopg2
          cur = psycopg2.connect("postgresql://" + os.environ["DATABASE_URL"].split("://", 1)[1]).cursor()
          def q(title, sql):
              cur.execute(sql)
              print(f"== {title}")
              for row in cur.fetchall():
                  print("==   " + " | ".join(str(c) for c in row))
          q("Yad2 rows by deal type: total, active, delisted, and how many have a first_seen_at backdated (seed) vs live",
            """select deal_type, count(*), count(*) filter (where not is_delisted), count(*) filter (where is_delisted),
                      count(*) filter (where first_seen_at < now() - interval '7 days'), count(*) filter (where first_seen_at >= now() - interval '7 days')
               from listings where source = 'yad2' group by 1 order by 1""")
          q("Yad2 rows inserted per hour of scraped_at-at-insert is unknown; use first_seen_at for live rows, by hour, last 6 hours, by deal type",
            """select date_trunc('hour', first_seen_at) h, deal_type, count(*) from listings where source='yad2' and first_seen_at > now() - interval '6 hours' group by 1, 2 order by 1, 2""")
          q("Yad2 sale rows with the highest id range: how many were created in the last 3 hours (by id order, using max id) - proxy for rows inserted recently",
            """select count(*) filter (where id > (select max(id) - 20000 from listings)), count(*) filter (where id > (select max(id) - 60000 from listings)) from listings where source='yad2' and deal_type='sale'""")
          q("duplicate external ids within Yad2 (should be 0)",
            "select count(*) from (select external_id from listings where source='yad2' group by external_id having count(*) > 1) t")
          q("sent notifications in the last 60 minutes by deal type and reason", """select l.deal_type, s.reason, count(*) from sent_notifications s join listings l on l.id=s.listing_id where s.sent_at > now() - interval '60 minutes' group by 1,2 order by 1,2""")
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 300
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "-u", "/script/pod.py"]
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait, print results, clean up (always)
        if: always()
        run: |
          for i in $(seq 1 100); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- results ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep "^==" || kubectl logs -n todira "$POD_NAME" 2>&1 | tail -10
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
