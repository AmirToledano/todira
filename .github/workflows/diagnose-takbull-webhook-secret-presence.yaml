name: "Diagnose - is the Takbull webhook secret set (GitHub secret + live k8s secret)? (read-only, booleans only)"

# Read-only, manual. The free Takbull flow (2026-10-05) needs TAKBULL_WEBHOOK_SECRET: it is the secret path segment of
# /webhooks/takbull/<secret>, the only thing protecting that endpoint. Prints ONLY whether it is set, never its value
# or length.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Actions secret (what ci-cd.yaml deploys with)
        env:
          GH_SECRET: ${{ secrets.TAKBULL_WEBHOOK_SECRET }}
        run: |
          if [ -z "$GH_SECRET" ]; then echo "GitHub secret TAKBULL_WEBHOOK_SECRET: NOT SET"; else echo "GitHub secret TAKBULL_WEBHOOK_SECRET: set"; fi

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Live k8s secret and website env
        run: |
          N=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.takbull-webhook-secret}' 2>/dev/null | base64 -d | wc -c)
          if [ "$N" -gt 0 ]; then echo "live todira-bot-secret takbull-webhook-secret: set"; else echo "live todira-bot-secret takbull-webhook-secret: NOT SET"; fi
          P=$(kubectl get deploy todira-website -n todira -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="TAKBULL_PAYMENT_PAGE_URL")].value}' 2>/dev/null | wc -c)
          if [ "$P" -gt 0 ]; then echo "website TAKBULL_PAYMENT_PAGE_URL: set (free flow ON)"; else echo "website TAKBULL_PAYMENT_PAGE_URL: empty (free flow OFF)"; fi
