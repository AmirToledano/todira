name: Diagnose — Bright Data DCA returning the SAME result regardless of input URL (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-15.
#
# Real trigger: check-scraper-job-status.yaml's real pod logs showed the production scraper's
# Bright Data enrichment stuck for 75+ minutes, returning the EXACT SAME row (orderId=57346371,
# token='rccfe1nk', adNumber=83125484 — a Dizengoff St. sublet listing) for at least 6 different
# real Yad2 listing URLs in a row, even with _BRIGHT_DATA_ENRICH_CONCURRENCY=1 (fully serialized,
# one job at a time — ruling out the 2026-09-14 "concurrent jobs share a result buffer" theory as
# the FULL explanation, since that fix is already live and the bug still happens). The existing
# adNumber cross-check in bright_data_client.py is correctly discarding every one of these wrong
# results — no data corruption — but nothing ever gets the RIGHT data either.
#
# Distinct job ids ARE being returned per trigger call (confirmed in the real logs), so this isn't
# simply "the same job id polled twice". The working hypothesis this tests: the collector's own
# Scraper Studio recipe does not actually consume the `url` field from the trigger POST body as a
# per-run input — it may have been built by "recording" a session against one specific listing
# (the Dizengoff sublet, adNumber=83125484) and never wired that recorded URL as a dynamic input
# parameter, so every trigger — regardless of what `url` is POSTed — replays the SAME recorded
# navigation and returns the SAME page's data. This directly tests that: trigger the real collector
# with two deliberately different, real, currently-live Yad2 item URLs (neither is the Dizengoff
# listing) and checks whether the returned adNumber ever varies, or is always 83125484 regardless
# of input. Also inspects the collector's own /dca/collections metadata for any visible input-schema
# clue. Pure Bright Data API traffic — no Yad2/ZenRows cost, does not touch the live k8s scraper Job.
#
# 2026-09-15, second run: originally read BRIGHT_DATA_API_KEY/BRIGHT_DATA_COLLECTOR_ID from this
# repo's OWN GitHub Actions secrets — a SEPARATE store from the k8s todira-bot-secret the real
# scraper pods actually read from. After the owner rotated to a new Admin-permission key via
# set-bright-data-api-key-secret.yaml (which patches the k8s secret, not this repo's), this
# workflow's OLD GitHub Actions secret value 401'd (the old key was invalidated when the new one
# was created). Fixed by reading directly from the k8s secret instead, same kubectl+jsonpath+mask
# pattern every other credential-using diagnostic in this repo already uses (see
# diagnose-facebook-marketplace-page-structure.yaml) — this also means the test now genuinely
# reflects whatever key is actually deployed to production, not a separately-tracked copy.
#
# 2026-09-15, third run: the collector's own Scraper Studio "Save to development" flow got stuck
# in a real, repeated "Output schema errors" loop tonight — the collector accumulated many
# mismatched Output Schema field definitions from unrelated past experiments (listings,
# property_urls, canary, raw_length, etc.), none of which match the current single-item parser's
# real (dynamic passthrough) output. Bright Data's own docs (error-codes page, found via web
# search — docs.brightdata.com is unreachable directly from this sandbox) document exactly this
# situation: an "Incompatible input/output schema" error can be bypassed at TRIGGER time with
# `override_incompatible_schema=1` (the UI's own "Trigger anyway" button does the same thing).
# Added here so this diagnostic can test the real, currently-saved-as-Draft collector code
# directly via the API, without needing the Studio UI's own save flow to succeed first.
# override_incompatible_schema=1 is appended to both trigger URLs below.
on:
  workflow_dispatch:
    inputs:
      url_a:
        description: "First real Yad2 item URL to test (must NOT be the Dizengoff/83125484 listing)"
        required: true
      url_b:
        description: "Second real Yad2 item URL to test (different listing than url_a)"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read + mask the real Bright Data credentials from the k8s secret
        # Same credentials the production scraper pods actually use (charts/todira/templates/
        # scraper-cronjob.yaml's BRIGHT_DATA_API_KEY/BRIGHT_DATA_COLLECTOR_ID secretKeyRefs) —
        # masked immediately, before anything else in this job touches them.
        run: |
          API_KEY=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.bright-data-api-key}' | base64 -d)
          COLLECTOR_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.bright-data-collector-id}' | base64 -d)
          echo "::add-mask::$API_KEY"
          echo "::add-mask::$COLLECTOR_ID"
          if [ -z "$API_KEY" ] || [ -z "$COLLECTOR_ID" ]; then
            echo "bright-data-api-key or bright-data-collector-id is empty in todira-bot-secret — nothing to test with."
            exit 1
          fi
          echo "$API_KEY" > /tmp/bd_api_key.txt
          echo "$COLLECTOR_ID" > /tmp/bd_collector_id.txt

      - name: Trigger + poll for url_a, print the returned adNumber
        env:
          TEST_URL: ${{ inputs.url_a }}
        run: |
          export BRIGHT_DATA_API_KEY=$(cat /tmp/bd_api_key.txt)
          export BRIGHT_DATA_COLLECTOR_ID=$(cat /tmp/bd_collector_id.txt)
          python3 - <<'PYEOF'
          import json, os, time, urllib.request

          api_key = os.environ["BRIGHT_DATA_API_KEY"]
          collector_id = os.environ["BRIGHT_DATA_COLLECTOR_ID"]
          url = os.environ["TEST_URL"]
          headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}

          req = urllib.request.Request(
              f"https://api.brightdata.com/dca/trigger?collector={collector_id}&override_incompatible_schema=1",
              data=json.dumps([{"url": url}]).encode(),
              headers=headers, method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              body = json.loads(resp.read())
          print("trigger response:", body)
          job_id = None
          candidate = body[0] if isinstance(body, list) and body else body
          if isinstance(candidate, dict):
              for key in ("collection_id", "response_id", "job_id", "id"):
                  if candidate.get(key):
                      job_id = str(candidate[key])
                      break
          print(f"requested url = {url!r}")
          print(f"job_id = {job_id!r}")
          if job_id is None:
              print("NO JOB ID EXTRACTED — cannot poll.")
              raise SystemExit(0)

          deadline = time.monotonic() + 60
          rows = None
          while time.monotonic() < deadline:
              req = urllib.request.Request(
                  f"https://api.brightdata.com/dca/dataset?id={job_id}", headers=headers,
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  rows = json.loads(resp.read())
              is_pending = isinstance(rows, dict) and bool(rows) and set(rows.keys()) <= {"status", "message"}
              if rows and not is_pending:
                  break
              time.sleep(3)
          print("raw poll result:", rows)
          row = rows[0] if isinstance(rows, list) and rows else rows
          if isinstance(row, dict):
              print(f"RETURNED adNumber = {row.get('adNumber')!r}  orderId = {row.get('orderId')!r}  token = {row.get('token')!r}")
              expected_id = url.rstrip("/").rsplit("/", 1)[-1]
              print(f"expected id (from URL) = {expected_id!r}")
              print("MATCH" if str(row.get("adNumber")) == expected_id else "MISMATCH")
          PYEOF

      - name: Trigger + poll for url_b, print the returned adNumber
        env:
          TEST_URL: ${{ inputs.url_b }}
        run: |
          export BRIGHT_DATA_API_KEY=$(cat /tmp/bd_api_key.txt)
          export BRIGHT_DATA_COLLECTOR_ID=$(cat /tmp/bd_collector_id.txt)
          python3 - <<'PYEOF'
          import json, os, time, urllib.request

          api_key = os.environ["BRIGHT_DATA_API_KEY"]
          collector_id = os.environ["BRIGHT_DATA_COLLECTOR_ID"]
          url = os.environ["TEST_URL"]
          headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}

          req = urllib.request.Request(
              f"https://api.brightdata.com/dca/trigger?collector={collector_id}&override_incompatible_schema=1",
              data=json.dumps([{"url": url}]).encode(),
              headers=headers, method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              body = json.loads(resp.read())
          print("trigger response:", body)
          job_id = None
          candidate = body[0] if isinstance(body, list) and body else body
          if isinstance(candidate, dict):
              for key in ("collection_id", "response_id", "job_id", "id"):
                  if candidate.get(key):
                      job_id = str(candidate[key])
                      break
          print(f"requested url = {url!r}")
          print(f"job_id = {job_id!r}")
          if job_id is None:
              print("NO JOB ID EXTRACTED — cannot poll.")
              raise SystemExit(0)

          deadline = time.monotonic() + 60
          rows = None
          while time.monotonic() < deadline:
              req = urllib.request.Request(
                  f"https://api.brightdata.com/dca/dataset?id={job_id}", headers=headers,
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  rows = json.loads(resp.read())
              is_pending = isinstance(rows, dict) and bool(rows) and set(rows.keys()) <= {"status", "message"}
              if rows and not is_pending:
                  break
              time.sleep(3)
          print("raw poll result:", rows)
          row = rows[0] if isinstance(rows, list) and rows else rows
          if isinstance(row, dict):
              print(f"RETURNED adNumber = {row.get('adNumber')!r}  orderId = {row.get('orderId')!r}  token = {row.get('token')!r}")
              expected_id = url.rstrip("/").rsplit("/", 1)[-1]
              print(f"expected id (from URL) = {expected_id!r}")
              print("MATCH" if str(row.get("adNumber")) == expected_id else "MISMATCH")
          PYEOF

      - name: Inspect the collector's own metadata (best-effort, endpoint shape not previously confirmed)
        run: |
          API_KEY=$(cat /tmp/bd_api_key.txt)
          COLLECTOR_ID=$(cat /tmp/bd_collector_id.txt)
          echo "::add-mask::$API_KEY"
          echo "::add-mask::$COLLECTOR_ID"
          curl -sS "https://api.brightdata.com/dca/collections?collector=${COLLECTOR_ID}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -o /tmp/collector_info.json \
            -w "\nhttp_status=%{http_code}\n" \
            --max-time 30 || true
          echo "--- collector info response ---"
          cat /tmp/collector_info.json 2>/dev/null || echo "(no response captured)"
          echo ""
