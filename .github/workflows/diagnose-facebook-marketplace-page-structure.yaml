name: Diagnose — real Facebook Marketplace page structure via the stored session cookie (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push). 2026-09-15.
#
# Real next step in the Facebook Marketplace/Groups scraping feature (see PROJECT_STATE.md's
# 2026-09-15 entry): the dedicated account's session cookie is already safely stored in
# todira-bot-secret's facebook-cookies key (see set-facebook-cookies-secret.yaml), but nobody has
# ever actually looked at what a real, logged-in Marketplace page looks like yet. This project's
# own history (yad2_client.py — 8 failed attempts before its real page structure was understood;
# komo_client.py/homeless_client.py — each only written after a live diagnostic like this one)
# is explicit that writing a parser against a GUESSED structure is a real, repeated mistake here —
# so this fetches ONE real page with the real cookie and reports back safe findings only. The
# cookie itself is masked before this job's very first shell touches it (same mechanism as
# set-facebook-cookies-secret.yaml's own masking step), so it can never appear in this run's logs.
#
# A genuine 200 Marketplace page would carry other real users' listing content, so on success this
# only reports structure (status, title, a generic GraphQL "__typename" scan, item-link counts) —
# never the raw page dump. A NON-200 response is different: that's Facebook's own generic system
# error/wall page, not another user's data, so the raw body IS printed in that case — it's the only
# way to actually see what's wrong and fix the request.
#
# 2026-09-15, first run: plain Cookie+User-Agent+Accept-Language headers got a real
# http_status=400, title "Error", 856 bytes — not a login/checkpoint wall (no such signal matched),
# Facebook's own generic bad-request page. Second run, same day: added the Sec-Fetch-*/Sec-CH-UA
# client-hint headers a real Chrome navigation always sends (several sites' edge/WAF layers reject
# a request without them as non-browser, a common cause of exactly this kind of contentless 400).
#
# Deliberately ONE request per run (Marketplace's public category page only, not a specific Group —
# no group URL is on hand yet), matching a real, explicit owner go-ahead for careful, low-volume
# diagnostics only, before anything else touches the live account.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Fetch Marketplace's real property-rentals category page, using the stored cookie
        # Cookie is read from the k8s secret and masked in this step's own first two lines, before
        # anything else runs — same ordering reasoning as every other set-*-secret.yaml/diagnose
        # workflow in this repo that touches a real credential.
        run: |
          COOKIE=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.facebook-cookies}' | base64 -d)
          echo "::add-mask::$COOKIE"
          if [ -z "$COOKIE" ]; then
            echo "facebook-cookies is empty in todira-bot-secret — nothing to test with. Re-run set-facebook-cookies-secret.yaml first."
            exit 1
          fi

          echo "=== Fetching Marketplace property-rentals category page ==="
          STATUS=$(curl -sS --compressed -L --max-redirs 5 \
            -D /tmp/fb_headers.txt \
            -o /tmp/fb_body.html \
            -w "%{http_code}" \
            --max-time 30 \
            -H "Cookie: $COOKIE" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-User: ?1" \
            -H "Sec-Fetch-Dest: document" \
            -H "sec-ch-ua: \"Chromium\";v=\"128\", \"Not;A=Brand\";v=\"24\", \"Google Chrome\";v=\"128\"" \
            -H "sec-ch-ua-mobile: ?0" \
            -H "sec-ch-ua-platform: \"Windows\"" \
            "https://www.facebook.com/marketplace/category/propertyrentals/") || STATUS="curl_failed"
          echo "http_status=$STATUS size_bytes=$(wc -c < /tmp/fb_body.html 2>/dev/null || echo 0)"
          echo "$STATUS" > /tmp/fb_status.txt

      - name: Analyze the saved page
        run: |
          echo "=== Response headers (no cookie ever appears here — only what Facebook itself sent back) ==="
          grep -iE "^(location|set-cookie|content-type|content-length):" /tmp/fb_headers.txt | sed -E 's/^(set-cookie:).*/\1 [redacted, not needed]/i' || true
          echo
          python3 -c "
          import re
          from collections import Counter

          with open('/tmp/fb_body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          print(f'=== Body length: {len(html)} chars ===')

          title_match = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
          print(f'Title: {title_match.group(1).strip() if title_match else \"(no <title> found)\"}')

          lower = html.lower()
          login_signals = [s for s in ('log in to facebook', 'loginform', 'checkpoint', 'login.php', 'two-factor', 'name=\"email\"') if s in lower]
          print(f'Login/checkpoint-wall signals present: {login_signals or \"none\"}')

          # Generic GraphQL structural scan — works regardless of Facebook's exact current DOM,
          # since Marketplace/Groups pages embed their real data as GraphQL-shaped JSON with
          # __typename markers. A frequency table of these is the single most useful signal for
          # figuring out what data node types are actually on this page.
          typenames = re.findall(r'\"__typename\":\"([A-Za-z0-9_]+)\"', html)
          counts = Counter(typenames)
          print(f'=== __typename occurrences found: {len(typenames)} total, {len(counts)} distinct ===')
          for name, count in counts.most_common(30):
              print(f'  {name}: {count}')

          # Marketplace item permalinks are a stable, documented URL shape
          # (facebook.com/marketplace/item/<id>/) regardless of internal markup changes.
          item_ids = sorted(set(re.findall(r'/marketplace/item/(\d+)/', html)))
          print(f'=== Distinct /marketplace/item/<id>/ links found: {len(item_ids)} ===')
          if item_ids:
              print(f'First few ids: {item_ids[:5]}')

          script_json_count = len(re.findall(r'<script type=\"application/json\"', html))
          print(f'=== <script type=\"application/json\"> blocks found: {script_json_count} ===')
          "

          STATUS=$(cat /tmp/fb_status.txt 2>/dev/null || echo "")
          if [ "$STATUS" != "200" ]; then
            echo
            echo "=== Raw response body (status=$STATUS, non-200 — Facebook's own generic error/wall page, not real listing content, so safe to print in full) ==="
            cat /tmp/fb_body.html
          fi

      - name: Extract the real field structure of one MarketplaceFeedListingStory/RentalMapClusterStory node
        # 2026-09-15, third pass, only useful once the fetch above got a genuine 200 (confirmed:
        # 192 __typename occurrences, MarketplaceFeedListingStory x27, MarketplaceFeedRentalMap-
        # ClusterStory x11, 24 real /marketplace/item/<id>/ links, 107 embedded JSON script
        # blocks). Knowing THOSE type names exist isn't enough to write a parser against — need to
        # see one real node's actual field names (title/price/location/photo keys) the same way
        # every other client in this project was only written after seeing real structure, never a
        # guess. This is the real Marketplace content itself (same category of data this project's
        # other diagnose-*.yaml workflows already print — real Yad2/Komo prices/addresses), so
        # printing one representative node's structure here is consistent with that established
        # practice, not a new kind of exposure.
        run: |
          STATUS=$(cat /tmp/fb_status.txt 2>/dev/null || echo "")
          if [ "$STATUS" != "200" ]; then
            echo "Skipping — last fetch wasn't a 200 (status=$STATUS), nothing real to extract."
            exit 0
          fi
          python3 -c "
          import re, json

          with open('/tmp/fb_body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          script_blocks = re.findall(r'<script type=\"application/json\"[^>]*>(.*?)</script>', html, re.S)
          print(f'Scanning {len(script_blocks)} JSON script blocks for a real listing node...')

          TARGET_TYPES = ('MarketplaceFeedListingStory', 'MarketplaceFeedRentalMapClusterStory')
          found = {}

          def walk(obj):
              if isinstance(obj, dict):
                  tn = obj.get('__typename')
                  if tn in TARGET_TYPES and tn not in found:
                      found[tn] = obj
                  for v in obj.values():
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v)

          for block in script_blocks:
              block = block.strip()
              if block.startswith('for (;;);'):
                  block = block[len('for (;;);'):]
              if block.startswith('<!--') and block.endswith('-->'):
                  block = block[4:-3].strip()
              if not block:
                  continue
              try:
                  data = json.loads(block)
              except json.JSONDecodeError:
                  continue
              walk(data)
              if len(found) >= len(TARGET_TYPES):
                  break

          def pretty(obj, indent=1, max_depth=4):
              pad = '  ' * indent
              if indent >= max_depth:
                  print(pad + '...(max depth reached)')
                  return
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if isinstance(v, dict):
                          print(f'{pad}{k}: {{...}} ({len(v)} keys)')
                          pretty(v, indent + 1, max_depth)
                      elif isinstance(v, list):
                          print(f'{pad}{k}: [...] ({len(v)} items)')
                          for item in v[:2]:
                              pretty(item, indent + 1, max_depth)
                      else:
                          sval = repr(v)
                          if len(sval) > 140:
                              sval = sval[:140] + '...(truncated)'
                          print(f'{pad}{k}: {sval}')
              elif isinstance(obj, list):
                  for item in obj[:2]:
                      pretty(item, indent, max_depth)

          if not found:
              print('No target node found in any parseable JSON script block — may need deeper unwrapping (bigpipe/relay framing) or a different category/URL.')
          for typename, node in found.items():
              print(f'')
              print(f'=== Sample {typename} — top-level keys: {sorted(node.keys())} ===')
              pretty(node)
          "
