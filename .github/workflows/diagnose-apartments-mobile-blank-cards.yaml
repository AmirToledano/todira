name: Diagnose — real owner report, blank/invisible listing cards + map tiles on mobile (read-only)

# Real owner report (with screenshots): (1) the map now shows CARTO's own "API KEY REQUIRED"
# watermark instead of real tiles, (2) on mobile the /apartments page can be scrolled but no
# listing cards are visible at all, and (3) clicking a card to open the detail modal on mobile
# shows nothing. This is read-only against production — no writes, no state changes — gathering
# concrete evidence (console errors, computed styles, bounding boxes, actual tile response) before
# changing any code, per this project's own "never guess, verify live" discipline.
#
# IMPORTANT (found the hard way on the first run of this workflow): a plain anonymous
# goto("https://todira.app/apartments") with no ?uid= and no session cookie never reaches the real
# listings workspace at all — website/main.py's own /apartments route resolves no user and renders
# need_uid.html instead (a totally different, much smaller page), which is why the first run of
# this diagnostic found 0 .listing-card and every toolbar selector "NOT FOUND" on BOTH mobile and
# desktop — that was this diagnostic testing the wrong page, not a real bug. This version first
# looks up a real user (one with a filter already set, so /apartments renders the actual workspace
# rather than no_filter.html either) straight from the DB and passes their real telegram_user_id as
# ?uid=... , exactly like a real bot-issued deep link would.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Get a real user's telegram_user_id (one with a filter already set) from the DB
        id: uid
        run: |
          kubectl delete pod diag-apt-uid -n todira --ignore-not-found --wait=true
          cat <<'PODYAML' | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-apt-uid
          spec:
            restartPolicy: Never
            containers:
              - name: diag-apt-uid
                image: postgres:16-alpine
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    CONN="postgresql://${DATABASE_URL#*://}"
                    # A user with a filter row alone can easily have zero real matches (confirmed
                    # live, first run of this workflow: real session, real toolbar/map, but 0 cards
                    # — an unmatched filter, not a bug). A user behind a REAL like/hide action is a
                    # much stronger "actually has matching listings to browse" signal.
                    psql "$CONN" -t -A -c "SELECT u.telegram_user_id FROM users u JOIN user_listing_actions a ON a.user_id = u.id WHERE u.telegram_user_id IS NOT NULL ORDER BY a.id DESC LIMIT 1;"
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod diag-apt-uid -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          REAL_UID=$(kubectl logs -n todira diag-apt-uid | tail -1)
          echo "real telegram_user_id: $REAL_UID"
          echo "real_uid=$REAL_UID" >> "$GITHUB_OUTPUT"
          kubectl delete pod diag-apt-uid -n todira --ignore-not-found

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Mobile (iPhone 13) — console errors, card visibility, modal-open, toolbar layout
        env:
          REAL_UID: ${{ steps.uid.outputs.real_uid }}
        run: |
          python3 - <<'PYEOF'
          import os
          from playwright.sync_api import sync_playwright

          uid = os.environ["REAL_UID"]
          url = f"https://todira.app/apartments?uid={uid}"

          with sync_playwright() as p:
              iphone = p.devices['iPhone 13']
              browser = p.chromium.launch()
              context = browser.new_context(**iphone)
              page = context.new_page()

              console_msgs = []
              page.on("console", lambda m: console_msgs.append((m.type, m.text)))
              page_errors = []
              page.on("pageerror", lambda e: page_errors.append(str(e)))
              tile_responses = []
              def on_response(r):
                  if "cartocdn" in r.url or "basemaps" in r.url or "arcgisonline" in r.url:
                      tile_responses.append((r.status, r.headers.get("content-type"), r.headers.get("content-length"), r.url))
              page.on("response", on_response)

              print(f"=== goto {url} (iPhone 13 emulation) ===")
              page.goto(url, wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(2500)  # let IntersectionObserver / Leaflet settle
              print("landed on:", page.url, "title:", page.title())

              page.screenshot(path="mobile_apartments_full.png", full_page=True)

              print("=== console messages (errors/warnings only) ===")
              for t, text in console_msgs:
                  if t in ("error", "warning"):
                      print(t, text[:300])
              print("=== uncaught page errors ===")
              for e in page_errors:
                  print(e[:500])

              print("=== tile responses ===")
              for status, ctype, clen, turl in tile_responses[:5]:
                  print(status, ctype, clen, turl)
              print("total tile responses seen:", len(tile_responses))

              print("=== listing card visibility (first 5 .listing-card) ===")
              cards = page.locator(".listing-card").all()
              print("card count found:", len(cards))
              for i, c in enumerate(cards[:5]):
                  cls = c.get_attribute("class")
                  box = c.bounding_box()
                  opacity = c.evaluate("el => getComputedStyle(el).opacity")
                  print(f"card[{i}] class={cls!r} opacity={opacity} box={box}")

              print("=== toolbar chip bounding boxes (left-to-right X positions) ===")
              for sel in ["#apt-toolbar-map-toggle", ".apt-toolbar-count", ".apt-toolbar-no-brokers", ".apt-toolbar-title"]:
                  loc = page.locator(sel).first
                  if loc.count() > 0:
                      box = loc.bounding_box()
                      print(sel, box)
                  else:
                      print(sel, "NOT FOUND")

              print("=== clicking first listing card, checking if modal opens ===")
              modal = page.locator("#apt-listing-modal")
              if cards:
                  try:
                      cards[0].click(timeout=5000, force=True)
                      page.wait_for_timeout(800)
                      hidden_attr = modal.get_attribute("hidden")
                      modal_box = modal.bounding_box()
                      body_html_len = len(page.locator("#apt-listing-modal-body").inner_html())
                      print("modal hidden attr:", hidden_attr, "modal box:", modal_box, "modal body html length:", body_html_len)
                      page.screenshot(path="mobile_apartments_modal.png", full_page=False)
                  except Exception as e:
                      print("click/modal check raised:", e)
              else:
                  print("no cards to click — see card count above")

              context.close()
              browser.close()
          PYEOF

      - name: Desktop (1440x900) — toolbar layout + map tiles, for comparison
        if: always()
        env:
          REAL_UID: ${{ steps.uid.outputs.real_uid }}
        run: |
          python3 - <<'PYEOF'
          import os
          from playwright.sync_api import sync_playwright

          uid = os.environ["REAL_UID"]
          url = f"https://todira.app/apartments?uid={uid}"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={"width": 1440, "height": 900})
              page = context.new_page()

              tile_responses = []
              def on_response(r):
                  if "cartocdn" in r.url or "basemaps" in r.url or "arcgisonline" in r.url:
                      tile_responses.append((r.status, r.headers.get("content-type"), r.headers.get("content-length"), r.url))
              page.on("response", on_response)

              print(f"=== goto {url} (desktop 1440x900) ===")
              page.goto(url, wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(2000)
              print("landed on:", page.url, "title:", page.title())
              page.screenshot(path="desktop_apartments_full.png", full_page=False)

              print("=== tile responses ===")
              for status, ctype, clen, turl in tile_responses[:5]:
                  print(status, ctype, clen, turl)

              print("=== toolbar chip bounding boxes (left-to-right X positions) ===")
              for sel in ["#apt-toolbar-map-toggle", ".apt-toolbar-count", ".apt-toolbar-no-brokers", ".apt-toolbar-title"]:
                  loc = page.locator(sel).first
                  if loc.count() > 0:
                      box = loc.bounding_box()
                      print(sel, box)
                  else:
                      print(sel, "NOT FOUND")

              context.close()
              browser.close()
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screenshots
          path: |
            mobile_apartments_full.png
            mobile_apartments_modal.png
            desktop_apartments_full.png
          if-no-files-found: warn
