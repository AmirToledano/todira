name: Diagnose why the manual 1-city test Job failed (read-only)

# ONE-OFF, manual-only (workflow_dispatch, never on push) — 2026-09-01/09-02. The manual test Job
# `todira-scraper-manual-test-1788282259` (created by resume-scraper-1city-test.yaml right after
# un-suspending the CronJob) ran for the full 8 minutes and ended Failed, 0/1 completions — an
# order of magnitude longer than a single city fetch should ever take (PAGE_LOAD_TIMEOUT_MS=75s +
# POST_LOAD_WAIT_MS=9s + up to 20s networkidle wait ≈ 104s worst case). By the time the triggering
# workflow tried to read its pod logs, the pod was already gone (0 items). Reads the Job's events,
# any surviving/terminated pod (broader search, not tied to a stale env var), and recent namespace
# events to find the real cause before assuming anything. Read-only. Delete once the cause is
# found.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Job status + full describe (events, conditions, pod template)
        run: |
          echo "--- kubectl get job -o yaml ---"
          kubectl get job todira-scraper-manual-test-1788282259 -n todira -o yaml || echo "(job object gone)"
          echo "--- kubectl describe job ---"
          kubectl describe job todira-scraper-manual-test-1788282259 -n todira || echo "(job object gone)"

      - name: Any pods for this job, any phase, including terminated (broader search)
        run: |
          echo "--- pods matching job-name label ---"
          kubectl get pods -n todira -l job-name=todira-scraper-manual-test-1788282259 -o wide --show-labels || true
          echo "--- ALL scraper pods, most recent first, any phase ---"
          kubectl get pods -n todira -l app=todira-scraper --sort-by=.metadata.creationTimestamp -o wide | tail -10 || true

      - name: Logs from the manual test pod, if it still exists (current + previous container)
        run: |
          POD=$(kubectl get pods -n todira -l job-name=todira-scraper-manual-test-1788282259 -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -z "$POD" ]; then
            echo "(no pod found for this job — trying the most recently created scraper pod instead)"
            POD=$(kubectl get pods -n todira -l app=todira-scraper --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
          fi
          echo "pod=$POD"
          echo "--- current logs ---"
          kubectl logs -n todira "$POD" --timestamps --tail=500 || echo "(no current logs)"
          echo "--- previous instance logs (if it restarted) ---"
          kubectl logs -n todira "$POD" --previous --timestamps --tail=500 || echo "(no previous instance)"
          echo "--- pod describe (events, OOMKilled, restarts, exit codes) ---"
          kubectl describe pod -n todira "$POD" || true

      - name: Recent namespace events (scheduling failures, OOM, image pull issues)
        run: |
          kubectl get events -n todira --sort-by=.lastTimestamp | tail -40
