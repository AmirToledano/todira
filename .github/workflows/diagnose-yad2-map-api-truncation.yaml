name: Diagnose — does Yad2's map API genuinely truncate below the real listing count? (read-only)

# A fresh code-review pass flagged a real concern: fetch_map_markers does ONE request per region
# and stops (no paging), and the module's own comment says "confirmed live: up to 200 in a single
# response" — but never actually confirmed whether 200 is a hard per-request cap (truncation, which
# would mean _mark_delisted wrongly delists genuinely-still-active listings beyond that cap) or
# just the real count for regions checked so far. Hits the real map API directly for tel-aviv-area
# (the busiest region — REGIONS_ON_MAP_API's own bbox) and dumps the FULL top-level JSON shape
# (not just markers count) to check for any total/count field the code currently ignores, plus the
# exact marker count returned right now.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tel-aviv-area's real map API response FROM INSIDE THE CLUSTER and inspect its shape
        run: |
          # 2026-09-25: a plain GitHub Actions runner IP gets a 302 Radware/Reblaze challenge
          # (confirmed live, matches this exact historical pattern already documented in
          # yad2_client.py's own module docstring). Route the request through a pod running on the
          # SAME production node the real scraper CronJob uses, whose egress IP is the one
          # confirmed NOT blocked, instead of trying from the runner directly.
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          curl -sSL -o kubectl https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          chmod +x kubectl

          ./kubectl delete pod diag-yad2-map-shape -n todira --ignore-not-found --wait=true
          cat <<'PODYAML' | ./kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-yad2-map-shape
          spec:
            restartPolicy: Never
            containers:
              - name: diag
                image: curlimages/curl:8.10.1
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    URL="https://gw.yad2.co.il/realestate-feed/rent/map?area=1&region=3&bBox=31.987679,34.732856,32.146966,34.857736&zoom=11"
                    curl -sS -o /tmp/resp.json -w "HTTP %{http_code}\n" "$URL" \
                      -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
                      -H "Accept: application/json"
                    echo "=== response size ==="
                    wc -c /tmp/resp.json
                    echo "=== raw response (first 2500 chars) ==="
                    head -c 2500 /tmp/resp.json
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(./kubectl get pod diag-yad2-map-shape -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          echo "--- pod output ---"
          ./kubectl logs -n todira diag-yad2-map-shape || true
          ./kubectl delete pod diag-yad2-map-shape -n todira --ignore-not-found

      - name: Cross-check — real active Yad2 rent listing count in tel-aviv-area cities, per the DB right now
        run: |
          echo "(kept minimal/read-only; see follow-up if bbox-vs-DB comparison is needed)"
