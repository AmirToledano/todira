name: "Diagnose - does the Takbull Hook Address secret equal the live secret? (read-only, match/no-match only)"

# Read-only, manual. Compares the SHA-256 of the secret path segment the owner pasted into Takbull's Hook Address
# (hash only - a random 32-char secret cannot be recovered from it) with the SHA-256 of the live k8s secret and of the
# GitHub Actions secret. Prints only yes/no, never any secret value.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Compare hashes
        env:
          GH_SECRET: ${{ secrets.TAKBULL_WEBHOOK_SECRET }}
        run: |
          EXPECTED=46cec56b716436f4e48c901856833f4e3c4712d72d5206aaf6cb8370a401851a
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          LIVE=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.takbull-webhook-secret}' 2>/dev/null | base64 -d | tr -d '\n' | sha256sum | cut -d' ' -f1)
          GH=$(printf '%s' "$GH_SECRET" | tr -d '\n' | sha256sum | cut -d' ' -f1)
          [ "$LIVE" = "$EXPECTED" ] && echo "Takbull Hook Address secret == live k8s secret: YES" || echo "Takbull Hook Address secret == live k8s secret: NO"
          [ "$GH" = "$EXPECTED" ] && echo "Takbull Hook Address secret == GitHub Actions secret: YES" || echo "Takbull Hook Address secret == GitHub Actions secret: NO"
