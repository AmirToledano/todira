name: Set Bright Data API key secret (manual, value typed only into this form)

# Patches todira-bot-secret's bright-data-api-key key — the value scraper-cronjob.yaml wires into
# BRIGHT_DATA_API_KEY (common/dorin_common/bright_data_client.py's trigger/poll DCA calls).
#
# Real trigger, 2026-09-15: diagnose-bright-data-account-status.yaml found the account's API key
# was on the "User" permission level, which a real GET /customer/balance call rejected with
# "Your API key lacks the required permissions for this action" — plausibly the same reason the
# DCA collector accepted trigger calls but never actually executed them (see PROJECT_STATE.md's
# 2026-09-15 entries). The owner generated a fresh key with Admin permissions on Bright Data's own
# dashboard (Account Settings -> Users and API keys) to replace it.
#
# Same reasoning and mechanics as set-bright-data-isp-secret.yaml/set-whatsapp-secret.yaml (masks
# the value from this run's own logs before anything else touches it) — run this directly from the
# GitHub Actions UI (Actions tab -> this workflow -> "Run workflow"), typing the key straight into
# the form field there, never pasted into a chat/AI session.
#
# No deployment restart needed afterward — the scraper runs as a CronJob, not a long-lived
# Deployment: its next scheduled (or manually dispatched) run spawns a fresh pod that reads the
# patched secret automatically. The stuck diagnose-bright-data-stuck-same-result.yaml test can be
# re-run right after this to confirm the new key actually fixes real per-URL execution before
# flipping scraper.brightDataEnrichmentSuspended back to false in values.yaml.
on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "New Bright Data API key (Admin permissions) - required"
        required: true
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask the provided value from this run's own logs
        # Same ordering reasoning as set-bright-data-isp-secret.yaml's own step: reads the raw
        # value from $GITHUB_EVENT_PATH via jq (not an `env:` block or ${{ inputs.x }} interpolated
        # into the script text) so nothing is echoed unmasked before the mask is registered.
        run: |
          API_KEY=$(jq -r '.inputs.api_key // ""' "$GITHUB_EVENT_PATH")
          [ -n "$API_KEY" ] && echo "::add-mask::$API_KEY"
          true

      - name: Patch bright-data-api-key
        env:
          API_KEY: ${{ inputs.api_key }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "No value provided - nothing to patch."
            exit 1
          fi
          b64=$(printf '%s' "$API_KEY" | base64 | tr -d '\n')
          kubectl patch secret todira-bot-secret -n todira --type merge \
            -p "$(jq -n --arg v "$b64" '{data:{"bright-data-api-key": $v}}')"
          echo "Patched. The scraper CronJob's NEXT run (scheduled or manually dispatched) will pick up the new key automatically — no restart needed for a CronJob."
