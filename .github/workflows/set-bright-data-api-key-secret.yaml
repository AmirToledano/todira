name: Set Bright Data API key / collector id secrets (manual, values typed only into this form)

# Patches todira-bot-secret's bright-data-api-key and/or bright-data-collector-id keys — the values
# scraper-cronjob.yaml wires into BRIGHT_DATA_API_KEY/BRIGHT_DATA_COLLECTOR_ID
# (common/dorin_common/bright_data_client.py's trigger/poll DCA calls).
#
# Real trigger, 2026-09-15: diagnose-bright-data-account-status.yaml found the account's API key
# was on the "User" permission level, which a real GET /customer/balance call rejected with
# "Your API key lacks the required permissions for this action" — the owner generated a fresh key
# with Admin permissions on Bright Data's own dashboard (Account Settings -> Users and API keys) to
# replace it. That alone did NOT fix the stuck-enrichment bug — a re-run of
# diagnose-bright-data-stuck-same-result.yaml still got the same wrong cached listing back. Further
# investigation on the real dashboard (My scrapers) found TWO Scraper Studio collectors: the real,
# correctly-built "yad2.co.il" one (7 runs, all via web UI, never via API — production has never
# actually triggered it) and a second "New collector" (4.07K records, last delivered the exact day
# the bug was happening). diagnose-bright-data-collector-id-match.yaml confirmed a real MISMATCH —
# production's BRIGHT_DATA_COLLECTOR_ID does NOT point at the real yad2.co.il collector. This field
# fixes that.
#
# Same reasoning and mechanics as set-bright-data-isp-secret.yaml/set-whatsapp-secret.yaml (masks
# each provided value from this run's own logs before anything else touches it, patches only the
# keys actually filled in) — run this directly from the GitHub Actions UI (Actions tab -> this
# workflow -> "Run workflow"), typing values straight into the form fields there, never pasted into
# a chat/AI session.
#
# No deployment restart needed afterward — the scraper runs as a CronJob, not a long-lived
# Deployment: its next scheduled (or manually dispatched) run spawns a fresh pod that reads the
# patched secret automatically. The stuck diagnose-bright-data-stuck-same-result.yaml test can be
# re-run right after this to confirm the fix actually gets real per-URL execution before flipping
# scraper.brightDataEnrichmentSuspended back to false in values.yaml.
on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "New Bright Data API key (Admin permissions) - leave blank to skip"
        required: false
        type: string
      collector_id:
        description: "Paste EITHER the bare collector id (c_...) OR the whole curl command from Initiate by API - leave blank to skip"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask every provided value from this run's own logs
        # Same ordering reasoning as set-bright-data-isp-secret.yaml's own step: reads raw values
        # from $GITHUB_EVENT_PATH via jq (not an `env:` block or ${{ inputs.x }} interpolated into
        # the script text) so nothing is echoed unmasked before the mask is registered.
        run: |
          API_KEY=$(jq -r '.inputs.api_key // ""' "$GITHUB_EVENT_PATH")
          COLLECTOR_ID_RAW=$(jq -r '.inputs.collector_id // ""' "$GITHUB_EVENT_PATH")
          [ -n "$API_KEY" ] && echo "::add-mask::$API_KEY"
          [ -n "$COLLECTOR_ID_RAW" ] && echo "::add-mask::$COLLECTOR_ID_RAW"
          EXTRACTED=$(printf '%s' "$COLLECTOR_ID_RAW" | grep -oE 'c_[A-Za-z0-9]+' | head -1)
          [ -n "$EXTRACTED" ] && echo "::add-mask::$EXTRACTED"
          true

      - name: Patch only the keys that were actually provided
        # 2026-09-15: collector_id now accepts EITHER a bare id OR the whole curl command pasted
        # straight from the "Initiate by API" tab — a real, live-observed mistake happened when the
        # owner manually retyped a 20-character id by hand on mobile (same LENGTH but a wrong
        # character, confirmed via diagnose-bright-data-collector-id-match.yaml still reporting
        # MISMATCH after the "fix"). Extracting the id via regex from a pasted (never manually
        # retyped) curl command removes that whole class of transcription error.
        env:
          API_KEY: ${{ inputs.api_key }}
          COLLECTOR_ID_RAW: ${{ inputs.collector_id }}
        run: |
          COLLECTOR_ID=$(printf '%s' "$COLLECTOR_ID_RAW" | grep -oE 'c_[A-Za-z0-9]+' | head -1)
          if [ -n "$COLLECTOR_ID_RAW" ] && [ -z "$COLLECTOR_ID" ]; then
            echo "collector_id was provided but no 'c_...' id could be found inside it — check the pasted value."
            exit 1
          fi

          PATCH='{"data":{}}'
          add_key() {
            key="$1"; value="$2"
            if [ -n "$value" ]; then
              b64=$(printf '%s' "$value" | base64 | tr -d '\n')
              PATCH=$(printf '%s' "$PATCH" | jq --arg k "$key" --arg v "$b64" '.data[$k] = $v')
            fi
          }
          add_key "bright-data-api-key" "$API_KEY"
          add_key "bright-data-collector-id" "$COLLECTOR_ID"

          if [ "$(printf '%s' "$PATCH" | jq -c '.data')" = "{}" ]; then
            echo "No values provided - nothing to patch."
            exit 1
          fi

          kubectl patch secret todira-bot-secret -n todira --type merge -p "$PATCH"
          echo "Patched. The scraper CronJob's NEXT run (scheduled or manually dispatched) will pick up the new values automatically — no restart needed for a CronJob."
