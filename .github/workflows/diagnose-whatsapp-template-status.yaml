name: Diagnose — WhatsApp Message Template approval status (via token's own granular scopes)

# Follow-up to diagnose-whatsapp-listing-sends.yaml: that run got a 400 "does not exist, cannot be
# loaded due to missing permissions" when requesting the phone number object WITH the
# whatsapp_business_account field — but the SAME token/phone_number_id pair is confirmed working
# for the bot's own inbound webhook replies (real owner test, same night). That strongly suggests
# the 400 was from requesting an unsupported/wrong field combination, not a genuinely inaccessible
# phone number. This gets the WABA id a cleaner way — straight from debug_token's own
# granular_scopes (which lists exactly which asset ids a System User token was granted, no
# reverse-lookup field needed) — then checks the configured Message Template's real approval status
# on that WABA, and separately re-checks the phone number with only basic fields to isolate whether
# THAT alone was the problem.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Deployed template name (not secret)
        run: |
          kubectl get cronjob todira-scraper -n todira -o json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          envs = d['spec']['jobTemplate']['spec']['template']['spec']['containers'][0].get('env', [])
          for e in envs:
              if e.get('name', '').startswith('WHATSAPP_'):
                  print(e['name'], '=', e.get('value', '(from secret)'))
          " | tee template_env.txt

      - name: Token's own granular scopes + template approval status + basic phone number check
        run: |
          TEMPLATE_NAME=$(grep WHATSAPP_MATCH_TEMPLATE_NAME template_env.txt | sed 's/.*= *//')
          cat <<PODYAML | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-whatsapp-template
          spec:
            restartPolicy: Never
            containers:
              - name: diag-whatsapp-template
                image: python:3.11-slim
                env:
                  - name: WHATSAPP_ACCESS_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: todira-bot-secret
                        key: whatsapp-access-token
                        optional: true
                  - name: WHATSAPP_PHONE_NUMBER_ID
                    valueFrom:
                      secretKeyRef:
                        name: todira-bot-secret
                        key: whatsapp-phone-number-id
                        optional: true
                  - name: TEMPLATE_NAME
                    value: "$TEMPLATE_NAME"
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    pip install --quiet httpx
                    python3 -c "
                    import os
                    import httpx

                    token = os.environ.get('WHATSAPP_ACCESS_TOKEN')
                    phone_id = os.environ.get('WHATSAPP_PHONE_NUMBER_ID')
                    template_name = os.environ.get('TEMPLATE_NAME', '').strip()

                    print('--- basic phone number check (no whatsapp_business_account field) ---')
                    r = httpx.get(
                        f'https://graph.facebook.com/v21.0/{phone_id}',
                        params={'fields': 'verified_name,display_phone_number,quality_rating'},
                        headers={'Authorization': f'Bearer {token}'},
                        timeout=15,
                    )
                    print(r.status_code, r.text)

                    print()
                    print('--- debug_token: granular_scopes (lists the exact asset ids this token can reach) ---')
                    r2 = httpx.get(
                        'https://graph.facebook.com/debug_token',
                        params={'input_token': token, 'access_token': token},
                        timeout=15,
                    )
                    print(r2.status_code, r2.text)

                    waba_ids = []
                    try:
                        data = r2.json().get('data', {})
                        for scope in data.get('granular_scopes', []):
                            if scope.get('scope', '').startswith('whatsapp_business'):
                                waba_ids.extend(scope.get('target_ids', []))
                    except Exception as e:
                        print('could not parse granular_scopes:', e)
                    waba_ids = list(dict.fromkeys(waba_ids))
                    print()
                    print('WABA/business ids found in granular_scopes:', waba_ids)

                    for waba_id in waba_ids:
                        print()
                        print(f'--- message_templates on {waba_id}, filtered to {template_name!r} ---')
                        r3 = httpx.get(
                            f'https://graph.facebook.com/v21.0/{waba_id}/message_templates',
                            params={'name': template_name} if template_name else {},
                            headers={'Authorization': f'Bearer {token}'},
                            timeout=15,
                        )
                        print(r3.status_code, r3.text[:3000])
                    "
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod diag-whatsapp-template -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          echo "--- pod logs ---"
          kubectl logs -n todira diag-whatsapp-template || true
          kubectl delete pod diag-whatsapp-template -n todira --ignore-not-found
