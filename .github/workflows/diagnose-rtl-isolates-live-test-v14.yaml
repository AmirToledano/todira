name: Diagnose - v14, Gemini's proposed fix - Isolates (RLI/PDI) + RLM + last-line absorber

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-30. Sent the full RTL investigation
# history + relevant code to Gemini for a second opinion (owner's own request). Gemini's technical
# answer: switch from bidi EMBEDDINGS (RLE U+202B / PDF U+202C) to bidi ISOLATES (RLI U+2067 /
# PDI U+2069, Unicode 6.3+) - isolates don't leak directional state across a styling entity
# boundary the way embeddings do, which lines up with our own confirmed finding that <b> crossing
# an embedding breaks alignment. Also recommends: an explicit RLM (U+200F) immediately before each
# line's leading emoji (forcing paragraph direction before the neutral emoji is even read), and a
# trailing invisible RLM+LRM absorber line at the very end of the whole message - which matches
# our OWN independently-confirmed "last line" finding (v6/v7: a short last line breaks unless
# something follows it).
#
# Tests all three together on the EXACT real listing 21873 content (same fields, same real
# multi-line description, same real footer link, WITH bold restored) - same successful methodology
# as v9/v10 (real sendPhoto caption, full real content, not a short synthetic fragment).
on:
  workflow_dispatch: {}

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send test 16 as a real sendPhoto caption - Isolates + RLM + absorber (body base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)
          PHOTO_URL="https://raw.githubusercontent.com/AmirToledano/todira/main/common/todira_common/assets/dachshunds/todi_detective.jpg"

          BODY_B64=""
          BODY=$(echo "$BODY_B64" | base64 -d)

          echo "=== sending test 16 as sendPhoto caption ==="
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "photo=${PHOTO_URL}" \
            --data-urlencode "caption=${BODY}" \
            --data-urlencode "parse_mode=HTML" \
            -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
          cat /tmp/resp.json
          echo ""
          echo "=== done - does Gemini's Isolates+RLM+absorber approach fix bold alignment? ==="
