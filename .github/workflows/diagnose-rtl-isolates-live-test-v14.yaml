name: Diagnose - v14 (fixed), Gemini's proposed fix - Isolates (RLI/PDI) + RLM + last-line absorber

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-30. First dispatch of this workflow
# actually FAILED at send time (400 Bad Request: "Unexpected end tag at byte offset 384") - a real
# transcription error while embedding the base64 payload into this file corrupted "<a href=" into
# "8a href=" (a dropped "<"). The job step itself showed green in GitHub Actions because the curl
# call succeeded even though Telegram's API rejected the message - job status alone is NOT proof
# of a successful send; the response body must always be checked. This is the corrected version,
# rebuilt with an explicit assertion pass (tag-balance + roundtrip decode checks) BEFORE ever
# writing the base64 into this file, so the same class of bug can't recur silently.
#
# Sent the full RTL investigation history + relevant code to Gemini for a second opinion (owner's
# own request). Gemini's technical answer: switch from bidi EMBEDDINGS (RLE U+202B / PDF U+202C)
# to bidi ISOLATES (RLI U+2067 / PDI U+2069, Unicode 6.3+) - isolates don't leak directional state
# across a styling entity boundary the way embeddings do, which lines up with our own confirmed
# finding that <b> crossing an embedding breaks alignment. Also recommends an explicit RLM
# (U+200F) immediately before each line's leading emoji, and a trailing invisible RLM+LRM absorber
# line at the very end of the whole message - matching our own independently-confirmed "last line"
# finding (v6/v7: a short last line breaks unless something follows it).
#
# Tests all three together on the EXACT real listing 21873 content (same fields, same real
# multi-line description, same real footer link, WITH bold restored) - same successful methodology
# as v9/v10 (real sendPhoto caption, full real content, not a short synthetic fragment).
on:
  workflow_dispatch: {}

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Sanity-check the decoded body has balanced tags before ever sending it
        run: |
          BODY_B64=""
          echo "$BODY_B64" | base64 -d > /tmp/body.txt
          python3 - <<'PYEOF'
          text = open("/tmp/body.txt", encoding="utf-8").read()
          assert "8a href" not in text, "corrupted <a href found!"
          assert text.count("<a href=") == 2, text.count("<a href=")
          assert text.count("</a>") == 2, text.count("</a>")
          assert text.count("<b>") == 5, text.count("<b>")
          assert text.count("</b>") == 5, text.count("</b>")
          print("Sanity checks passed - body has balanced, uncorrupted tags.")
          PYEOF

      - name: Send test 17 as a real sendPhoto caption - Isolates + RLM + absorber, corrected (body base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)
          PHOTO_URL="https://raw.githubusercontent.com/AmirToledano/todira/main/common/todira_common/assets/dachshunds/todi_detective.jpg"
          BODY=$(cat /tmp/body.txt)

          echo "=== sending test 17 as sendPhoto caption ==="
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "photo=${PHOTO_URL}" \
            --data-urlencode "caption=${BODY}" \
            --data-urlencode "parse_mode=HTML" \
            -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
          cat /tmp/resp.json
          echo ""
          RESP_OK=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('ok'))")
          echo "=== Telegram API ok field: $RESP_OK ==="
          if [ "$RESP_OK" != "True" ]; then
            echo "SEND FAILED - see response above."
            exit 1
          fi
          echo "=== done - does Gemini's Isolates+RLM+absorber approach fix bold alignment? ==="
