name: "Diagnose - how much of each source we actually hold: Yad2 sale, Komo, Homeless, Facebook (read-only, counts only)"

# Read-only, manual-only. After the Yad2 rent coverage gap (one 200-ad response per district) the owner asked to measure every other
# source and category the same way. Prints ONLY counts: (1) what our DB holds per source and deal type; (2) how many Komo ids exist
# live nationwide (the adscoordinates list the scraper reads) against the Komo rows we hold, and the Komo detail-failure memory
# size; (3) whether Yad2's FOR-SALE map answers on the free route and how many ads a grid sees against a single request; (4) whether
# Homeless's search paginates and how many cards one page carries (a few ZenRows credits, free tier).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: "(1) What our DB holds, per source and deal type"
        run: |
          kubectl delete pod diag-cov-db -n todira --ignore-not-found --wait=true
          cat <<'PODYAML' | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-cov-db
          spec:
            restartPolicy: Never
            containers:
              - name: diag
                image: postgres:16-alpine
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    CONN="postgresql://${DATABASE_URL#*://}"
                    psql "$CONN" -c "
                      SELECT source, deal_type,
                             count(*) AS total,
                             count(*) FILTER (WHERE NOT is_delisted) AS active,
                             count(*) FILTER (WHERE is_delisted) AS delisted,
                             count(*) FILTER (WHERE first_seen_at > now() - interval '24 hours') AS first_seen_24h,
                             count(*) FILTER (WHERE NOT is_delisted AND scraped_at > now() - interval '12 hours') AS active_scraped_12h
                      FROM listings GROUP BY 1, 2 ORDER BY 1, 2;"
                    echo "--- Komo detail-failure memory (ids remembered as failing) ---"
                    psql "$CONN" -t -c "SELECT count(*) FROM json_object_keys((SELECT value FROM app_flags WHERE key = 'komo_failed_detail_ids' AND value <> '')::json);" || echo "(none)"
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod diag-cov-db -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          kubectl logs -n todira diag-cov-db || true
          kubectl delete pod diag-cov-db -n todira --ignore-not-found

      - name: "(2) Komo - how many ids exist live nationwide"
        env:
          BRIGHT_DATA_ISP_HOST: ${{ secrets.BRIGHT_DATA_ISP_HOST }}
          BRIGHT_DATA_ISP_USER: ${{ secrets.BRIGHT_DATA_ISP_USER }}
          BRIGHT_DATA_ISP_PASS: ${{ secrets.BRIGHT_DATA_ISP_PASS }}
        run: |
          curl -sS -x "http://${BRIGHT_DATA_ISP_USER}:${BRIGHT_DATA_ISP_PASS}@${BRIGHT_DATA_ISP_HOST}" \
            "https://www.komo.co.il/code/nadlan/apartments-for-rent.asp?nehes=1&cityName=%D7%AA%D7%9C%20%D7%90%D7%91%D7%99%D7%91" \
            -o /tmp/komo_search.html -w "komo search http_status=%{http_code}\n" --max-time 60
          SESSION_TOKEN=$(grep -oE 'sessionToken\s*=\s*"[A-Za-z0-9]{16,64}"' /tmp/komo_search.html | head -1 | grep -oE '"[A-Za-z0-9]{16,64}"' | tr -d '"')
          [ -n "$SESSION_TOKEN" ] || { echo "no session token"; exit 0; }
          for IS in 1 2; do
            curl -sS -x "http://${BRIGHT_DATA_ISP_USER}:${BRIGHT_DATA_ISP_PASS}@${BRIGHT_DATA_ISP_HOST}" \
              -X POST "https://www.komo.co.il/api/modaotservice/adscoordinates/list/" \
              --data-urlencode "iska=${IS}" --data-urlencode "sessionToken=${SESSION_TOKEN}" \
              -o /tmp/komo_coords_${IS}.json --max-time 60
            python3 - "$IS" <<'PYEOF'
          import json, sys
          try:
              d = json.load(open(f"/tmp/komo_coords_{sys.argv[1]}.json"))
              print(f"== komo iska={sys.argv[1]} ({'rent' if sys.argv[1]=='1' else 'sale'}): status={d.get('status')} ids={len(d.get('list') or [])}")
          except Exception as e:
              print(f"== komo iska={sys.argv[1]}: unreadable ({type(e).__name__})")
          PYEOF
          done

      - name: "(3) Yad2 FOR-SALE map on the free route, single request vs a 3x3 grid"
        run: |
          POD_NAME="cov-sale-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import subprocess, sys, time
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "curl_cffi"])
          from curl_cffi import requests as cr
          H = {"Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7"}
          S, W, N, E = 31.549448, 34.818058, 31.938335, 35.272844
          def get(bbox, zoom, kind="forsale"):
              url = f"https://gw.yad2.co.il/realestate-feed/{kind}/map?region=6&bBox={bbox}&zoom={zoom}"
              try:
                  r = cr.get(url, headers=H, impersonate="chrome", timeout=30, allow_redirects=False)
              except Exception as e:
                  return f"error:{type(e).__name__}", None
              if r.status_code != 200:
                  return f"http{r.status_code}", None
              try:
                  m = (r.json().get("data") or {}).get("markers")
              except Exception:
                  return "notjson", None
              return "ok", ({str(x.get("token")) for x in m if isinstance(x, dict) and x.get("token")} if isinstance(m, list) else None)
          st, ids = get(f"{S},{W},{N},{E}", 10)
          print(f"== forsale single district request: status={st} ads={None if ids is None else len(ids)}", flush=True)
          if ids is not None:
              union = set(); bad = 0
              for i in range(3):
                  for j in range(3):
                      s = S + (N - S) * i / 3; n = S + (N - S) * (i + 1) / 3
                      w = W + (E - W) * j / 3; e = W + (E - W) * (j + 1) / 3
                      st2, got = get(f"{s:.6f},{w:.6f},{n:.6f},{e:.6f}", 12)
                      if got is None: bad += 1
                      else: union |= got
                      time.sleep(2)
              print(f"== forsale 3x3 grid: unique_ads={len(union)} failed_tiles={bad}")
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 600
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "-u", "/script/pod.py"]
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml
          for i in $(seq 1 120); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep "^==" || kubectl logs -n todira "$POD_NAME" 2>&1 | tail -8
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true

      - name: "(4) Homeless - cards per page and pagination (4 ZenRows credits)"
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          fetch() {
            curl -sS -G "https://api.zenrows.com/v1/" \
              --data-urlencode "apikey=$ZENROWS_API_KEY" --data-urlencode "url=$1" --data-urlencode "custom_headers=true" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
              -o "$2" -w "== homeless $1 http_status=%{http_code}\n" --max-time 100
          }
          fetch "https://www.homeless.co.il/rent/" /tmp/h1.html
          fetch "https://www.homeless.co.il/rent/?page=2" /tmp/h2.html
          fetch "https://www.homeless.co.il/rent/?pg=2" /tmp/h3.html
          fetch "https://www.homeless.co.il/rent/?p=2" /tmp/h4.html
          python3 - <<'PYEOF'
          import re
          def ids(path):
              try:
                  return re.findall(r'id="ad_(\d+)"', open(path, encoding="utf-8", errors="replace").read())
              except Exception:
                  return []
          base = ids("/tmp/h1.html")
          print(f"== homeless page 1: cards={len(base)}")
          for name, path in (("?page=2", "/tmp/h2.html"), ("?pg=2", "/tmp/h3.html"), ("?p=2", "/tmp/h4.html")):
              got = ids(path)
              new = len(set(got) - set(base))
              print(f"== homeless {name}: cards={len(got)} not_on_page_1={new}")
          html = open("/tmp/h1.html", encoding="utf-8", errors="replace").read()
          links = sorted(set(re.findall(r'href="([^"]*(?:page|pg|pagenum|[?&]p)=\d+[^"]*)"', html, re.I)))[:8]
          print("== homeless pagination-looking links on page 1:", links or "none")
          counts = re.findall(r'(\d[\d,]*)\s*(?:מודעות|תוצאות|דירות)', html)[:6]
          print("== homeless count-looking text:", counts or "none")
          PYEOF
