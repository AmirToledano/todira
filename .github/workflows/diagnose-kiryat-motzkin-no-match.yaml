name: Diagnose why Kiryat Motzkin listings don't match an existing filter

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-02. A real
# user added "קריית מוצקין" (our bundled cities.py spelling, 2 yuds) to their filter right after a
# manual 1-city test run scraped 11 new Kiryat Motzkin listings, but got "no current matches" both
# from the bot's own immediate post-save check and from the website's /apartments page. Suspected
# cause: yad2_client.py's _parse_location() reads `listing.city` verbatim from Yad2's own page
# text per listing (NOT from CITY_SLUG_TO_HEBREW_NAME, which is only used to pick which numeric
# city ID to query) — if Yad2's real breadcrumb text uses the "קרית מוצקין" (1 yud) spelling
# instead of our bundled "קריית מוצקין" (2 yuds), matching.py's exact-string city check
# (`listing_row.city not in filter_row.cities`) would silently fail forever, since nothing except
# this project's own bundled CITIES list uses the 2-yud spelling as a comparison key. Only reads
# data (no writes) — runs one read-only pod (postgres:16-alpine) wired to the same
# `todira-postgres-secret` the scraper itself uses, to run two SELECT-only queries directly
# against production, in one pod (not two, to keep this to a single dispatch). Delete this
# workflow once resolved.
#
# History: attempt 1 (run 33558802090, `kubectl run --overrides=<JSON>` + `envFrom: secretRef`)
# failed immediately — `envFrom` imports the secret's key verbatim as the env var name
# ("database-url", lowercase-with-hyphens, not a name a query could reference), so psql fell back
# to a nonexistent local Unix socket. Attempt 2 (run 33559461055, a plain Pod manifest +
# `secretKeyRef` mapping to an env var literally named `DATABASE_URL`) hit the EXACT SAME "socket
# ... failed" error again despite that fix — meaning `$DATABASE_URL` was still empty at psql-call
# time for a reason attempt 2's own diagnosis didn't explain. This version prints
# `${#DATABASE_URL}` (the string's LENGTH ONLY, never the value — avoids leaking any credential
# fragment into CI logs) immediately before the real queries, so whichever of "secret key is
# actually named something else" / "RBAC silently returns an empty value" / something else is
# happening, the next run's own output settles it definitively instead of guessing a third time.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: DATABASE_URL length check + city-spelling queries (one pod, one dispatch)
        run: |
          kubectl delete pod diag-city-db -n todira --ignore-not-found --wait=true
          cat <<'PODYAML' | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-city-db
          spec:
            restartPolicy: Never
            containers:
              - name: diag-city-db
                image: postgres:16-alpine
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                command: ["sh", "-c", "echo DATABASE_URL_LENGTH=${#DATABASE_URL}; psql \"$DATABASE_URL\" -c \"SELECT city, deal_type, price, rooms, is_delisted, scraped_at FROM listings WHERE city LIKE '%מוצקין%' ORDER BY scraped_at DESC LIMIT 20;\" -c \"SELECT city, count(*) FROM listings GROUP BY city ORDER BY count(*) DESC LIMIT 40;\""]
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod diag-city-db -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          echo "--- query output ---"
          kubectl logs -n todira diag-city-db || true
          echo "--- pod describe (in case it never even started) ---"
          kubectl describe pod diag-city-db -n todira || true
          kubectl delete pod diag-city-db -n todira --ignore-not-found
