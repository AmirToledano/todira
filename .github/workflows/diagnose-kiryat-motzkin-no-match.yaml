name: Diagnose why Kiryat Motzkin listings don't match an existing filter

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-02. A real
# user added "קריית מוצקין" (our bundled cities.py spelling, 2 yuds) to their filter right after a
# manual 1-city test run scraped 11 new Kiryat Motzkin listings, but got "no current matches" both
# from the bot's own immediate post-save check and from the website's /apartments page. Suspected
# cause: yad2_client.py's _parse_location() reads `listing.city` verbatim from Yad2's own page
# text per listing (NOT from CITY_SLUG_TO_HEBREW_NAME, which is only used to pick which numeric
# city ID to query) — if Yad2's real breadcrumb text uses the "קרית מוצקין" (1 yud) spelling
# instead of our bundled "קריית מוצקין" (2 yuds), matching.py's exact-string city check
# (`listing_row.city not in filter_row.cities`) would silently fail forever, since nothing except
# this project's own bundled CITIES list uses the 2-yud spelling as a comparison key. Only reads
# data (no writes) — runs one read-only pod (postgres:16-alpine) wired to the same
# `todira-postgres-secret` the scraper itself uses. Delete this workflow once resolved.
#
# History (why this is version 5): attempt 1 (`kubectl run --overrides=<JSON>` + `envFrom:
# secretRef`) failed immediately — `envFrom` imports the secret's key verbatim as the env var
# name ("database-url", not a name a query could reference). Attempt 2 (secretKeyRef mapping to
# an env var actually named DATABASE_URL) hit the EXACT SAME "local socket" error again. Attempt
# 3 added `echo ${#DATABASE_URL}` right before the query and proved the var WAS populated
# (length=64) — so the env wiring was fine all along. Attempt 4 added a scheme-prefix check (never
# printing the value itself) and got DATABASE_URL_SCHEME=does_NOT_start_with_postgres(ql)://ׁ — the
# scraper's own earlier crash logs mentioned `psycopg.errors.UndefinedFunction`, so this is almost
# certainly a SQLAlchemy-style `postgresql+psycopg://...` URL: a real, valid connection string,
# just with a `+driver` suffix psql's naive `postgres(ql)://` prefix match doesn't recognize (so
# psql fell back to treating the whole string as a literal dbname). This version reconstructs a
# psql-recognizable URI via `postgresql://${DATABASE_URL#*://}` — strips everything up to and
# including the first "://" (whatever the original scheme was) and prepends a bare "postgresql://"
# — verified locally with a synthetic `postgresql+psycopg://user:pass@host:5432/db` value before
# pushing. Keeps the length/scheme-of-original checks too, both still printed for the record.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: DATABASE_URL shape check + city-spelling queries (one pod, one dispatch)
        run: |
          kubectl delete pod diag-city-db -n todira --ignore-not-found --wait=true
          cat <<'PODYAML' | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-city-db
          spec:
            restartPolicy: Never
            containers:
              - name: diag-city-db
                image: postgres:16-alpine
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    DBLEN=${#DATABASE_URL}
                    echo "DATABASE_URL_LENGTH=$DBLEN"
                    case "$DATABASE_URL" in
                      postgres://*|postgresql://*) echo "DATABASE_URL_SCHEME=looks_like_a_uri" ;;
                      *) echo "DATABASE_URL_SCHEME=does_NOT_start_with_postgres(ql)://" ;;
                    esac
                    CONN="postgresql://${DATABASE_URL#*://}"
                    psql "$CONN" \
                      -c "SELECT city, count(*) FROM listings WHERE is_delisted = false GROUP BY city ORDER BY count(*) DESC;" \
                      -c "SELECT deal_type, cities, price_min, price_max, rooms_min, rooms_max, require_price, flexible_match, require_parking, require_elevator, require_balcony, require_pets_allowed, require_renovated, require_has_photos, require_roommate_friendly, safe_room_pref, furniture_pref, no_brokers FROM filters WHERE 'קריית מוצקין' = ANY(cities);" \
                      -c "WITH top200 AS (SELECT * FROM listings WHERE is_delisted = false ORDER BY scraped_at DESC LIMIT 200) SELECT city, count(*) FROM top200 GROUP BY city ORDER BY count(*) DESC;" \
                      -c "WITH top200 AS (SELECT * FROM listings WHERE is_delisted = false ORDER BY scraped_at DESC LIMIT 200) SELECT city, deal_type, price, rooms, has_parking, has_elevator, has_balcony, pets_allowed, is_renovated, image_urls, is_roommate_friendly FROM top200 WHERE deal_type = 'rent' AND city = ANY(ARRAY['רמת גן','ראשון לציון','קריית מוצקין','תל אביב יפו','ירושלים','הוד השרון']) AND (price IS NULL OR price BETWEEN 1000 AND 8700) AND (rooms IS NULL OR rooms BETWEEN 0.5 AND 5.0) ORDER BY scraped_at DESC LIMIT 20;"
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod diag-city-db -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          echo "--- query output ---"
          kubectl logs -n todira diag-city-db || true
          kubectl delete pod diag-city-db -n todira --ignore-not-found
