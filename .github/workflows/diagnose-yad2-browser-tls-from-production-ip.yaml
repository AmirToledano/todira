name: Diagnose — can Yad2 be fetched for free from our own IP with a browser-like TLS fingerprint? (read-only)

# Owner (2026-10-02): "find a cheaper way to get Yad2 data, no paid unblocker." Yad2's Radware blocks
# plain HTTP clients from our datacenter IP (see scraper/yad2_client.py's docstring). Untested idea:
# a plain client has a non-browser TLS/HTTP2 fingerprint, which is a separate Radware signal from the
# IP's ASN. This sends 8 requests total (the map API + one recent public listing page, each with a
# plain client and 3 browser-impersonation profiles via curl_cffi) from a throwaway pod on the real
# cluster egress IP, 3s apart, and prints ONLY status codes/signals — no listing content, no PII.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Run the probe in a throwaway pod
        run: |
          POD_NAME="yad2-tls-diag-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.request
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "curl_cffi", "psycopg2-binary"])
          import psycopg2
          from curl_cffi import requests as cr

          dsn = "postgresql://" + os.environ["DATABASE_URL"].split("://", 1)[1]
          cur = psycopg2.connect(dsn).cursor()
          cur.execute("select url from listings where source='yad2' and is_delisted=false order by first_seen_at desc limit 1")
          detail = cur.fetchone()[0]
          MAP = "https://gw.yad2.co.il/realestate-feed/rent/map?area=1&region=3&bBox=31.987679,34.732856,32.146966,34.857736&zoom=11"
          HEADERS = {"Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7"}

          def summarize(label, kind, status, body):
              low = body.lower()
              sig = [s for s in ("radware", "validate.perfdrive", "__uzdbm") if s in low]
              if kind == "MAP":
                  try:
                      d = json.loads(body)
                      n = len((d.get("data") or {}).get("markers") or [])
                      print(f"{label:28s} {kind:6s} status={status} json_ok markers={n}")
                      return
                  except Exception:
                      pass
              has_next = '"__NEXT_DATA__"' in body or "__NEXT_DATA__" in body
              print(f"{label:28s} {kind:6s} status={status} size={len(body)} next_data={has_next} challenge_signals={sig or 'none'}")

          for kind, url in (("MAP", MAP), ("DETAIL", detail)):
              try:
                  req = urllib.request.Request(url, headers={**HEADERS, "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      summarize("plain urllib (control)", kind, r.status, r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  summarize("plain urllib (control)", kind, e.code, e.read().decode("utf-8", "replace"))
              except Exception as e:
                  print(f"plain urllib (control) {kind} error {type(e).__name__}")
              time.sleep(3)
              for imp in ("chrome", "safari17_0", "firefox"):
                  try:
                      r = cr.get(url, headers=HEADERS, impersonate=imp, timeout=30, allow_redirects=False)
                      summarize(f"curl_cffi {imp}", kind, r.status_code, r.text)
                  except Exception as e:
                      print(f"curl_cffi {imp} {kind} error {type(e).__name__}")
                  time.sleep(3)
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "/script/pod.py"]
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait, print results, clean up (always)
        if: always()
        run: |
          for i in $(seq 1 80); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- results ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep -v -i "pip\|notice\|WARNING" || echo "(no logs captured)"
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
