name: Diagnose — does GET /account actually reuse the code across reloads, live (read-only)

# Follow-up to PR #503's fix. The owner's own account still shows a DIFFERENT channel_link_code
# after his second real attempt than the one confirmed live moments earlier, even though the
# earlier code hadn't expired yet — worth confirming directly against the real deployed site
# rather than guessing about page-reload timing from his side. Two real GETs to the real
# production /account a few seconds apart; if the fix works, both responses carry the SAME code.
on:
  workflow_dispatch:
    inputs:
      uid:
        description: "telegram_user_id to test against (must have Telegram but not WhatsApp linked)"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: First GET /account
        env:
          UID: ${{ inputs.uid }}
        run: |
          curl -sS "https://todira.app/account?uid=${UID}" -o /tmp/first.html \
            -w "http_status=%{http_code}\n"

      - name: Wait 5 seconds (simulating a real page reload)
        run: sleep 5

      - name: Second GET /account
        env:
          UID: ${{ inputs.uid }}
        run: |
          curl -sS "https://todira.app/account?uid=${UID}" -o /tmp/second.html \
            -w "http_status=%{http_code}\n"

      - name: Extract the real code field from window.__TODIRA_PAGE__ (same JSON parse the test suite uses, not a fragile grep) and compare
        run: |
          python3 -c "
          import json, re, sys
          pattern = re.compile(r'Object\.assign\(\{ lang: \"[^\"]*\", dir: \"[^\"]*\" \}, (.*)\);', re.MULTILINE)
          def extract_code(path):
              html = open(path, encoding='utf-8').read()
              m = pattern.search(html)
              if not m:
                  print(f'{path}: window.__TODIRA_PAGE__ not found in response at all')
                  return None
              config = json.loads(m.group(1))
              return config.get('code')
          first = extract_code('/tmp/first.html')
          second = extract_code('/tmp/second.html')
          print(f'first code:  {first!r}')
          print(f'second code: {second!r}')
          if first is None or second is None:
              print('RESULT: could not extract a code from one or both responses — see above')
              sys.exit(1)
          if first == second:
              print('RESULT: SAME CODE — fix is working correctly on the live site.')
          else:
              print('RESULT: DIFFERENT CODE — the code is still being regenerated on every reload.')
              sys.exit(1)
          "
