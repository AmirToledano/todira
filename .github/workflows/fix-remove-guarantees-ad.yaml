name: Fix — take down the "ערבויות ישיר" ad that came in as a flat (one-off)

# 2026-10-19 owner request ("delete it for everyone"): a guarantees-company advertisement posted in a Facebook group was
# stored as a listing. Marks every live Facebook-group row whose text is that ad as delisted, so it leaves the site and
# is never sent again. From the next Facebook run on, scraper/main.py's _delist_group_posts_that_are_not_listings does
# the same for anything else its rule rejects. Prints counts only.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
      - name: Delist it
        run: |
          cat > /tmp/q.sql <<'SQL'
          \echo '== live Facebook-group rows that are this ad, before'
          SELECT count(*) FROM listings WHERE source = 'facebook_groups' AND NOT is_delisted
            AND (description ILIKE '%arvuyotyashir%' OR description LIKE '%ערבויות ישיר%');
          UPDATE listings SET is_delisted = true, delisted_at = now()
          WHERE source = 'facebook_groups' AND NOT is_delisted
            AND (description ILIKE '%arvuyotyashir%' OR description LIKE '%ערבויות ישיר%');
          \echo '== after'
          SELECT count(*) FROM listings WHERE source = 'facebook_groups' AND NOT is_delisted
            AND (description ILIKE '%arvuyotyashir%' OR description LIKE '%ערבויות ישיר%');
          SQL
          PG=$(kubectl get pods -n todira -l app=todira-postgres --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -i -n todira "$PG" -- sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -f -' < /tmp/q.sql
