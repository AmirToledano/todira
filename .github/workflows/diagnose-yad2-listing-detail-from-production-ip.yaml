name: Diagnose — does a Yad2 listing page work directly from OUR OWN production IP? (read-only, one-off pod)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-15.
#
# Direct continuation of diagnose-yad2-listing-detail-direct-fetch.yaml, which got a real Radware
# challenge page for a plain direct fetch of a Yad2 listing detail page — but from a GitHub Actions
# runner IP, which this project has already observed (tonight, and historically) to carry worse
# anti-bot reputation than production's own EC2 IP (shared/reused across countless unrelated
# projects; production's own IP already works fine, unproxied, for Yad2's search/map pages). This
# runs the SAME exact test from a standalone, one-off Pod inside the real k8s cluster (same egress
# IP as the production scraper) — never touches the actual scraper CronJob/Deployment, creates and
# deletes its own throwaway Pod. Owner-approved before running (explicit go-ahead this session).
on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "A real, currently-live Yad2 item URL to test"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Create a standalone, throwaway diagnostic Pod inside the real cluster
        env:
          TEST_URL: ${{ inputs.test_url }}
        run: |
          POD_NAME="yad2-listing-diag-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"

          cat > /tmp/pod.py << 'PYEOF'
          import json, os, re, urllib.request

          url = os.environ["TEST_URL"]
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
                  "Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  status = resp.status
                  html = resp.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              status = exc.code
              html = exc.read().decode("utf-8", errors="replace")

          print(f"=== GET {url} (direct, no proxy, from THIS pod's own real egress IP) ===")
          print(f"http_status={status} size_bytes={len(html)}")

          title_match = re.search(r"<title[^>]*>(.*?)</title>", html, re.S)
          print(f"Title: {title_match.group(1).strip() if title_match else '(no title found)'}")

          radware_signals = [s for s in ("Radware", "challenge", "validate.perfdrive") if s.lower() in html.lower()]
          print(f"Radware/challenge signals: {radware_signals or 'none'}")

          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
          if not m:
              print("NO __NEXT_DATA__ script tag found at all.")
          else:
              print(f"__NEXT_DATA__ found, {len(m.group(1))} chars")
              try:
                  data = json.loads(m.group(1))
              except json.JSONDecodeError as exc:
                  print(f"JSON parse failed: {exc}")
                  data = None
              if data is not None:
                  def find_key(obj, target, path=""):
                      results = []
                      if isinstance(obj, dict):
                          for k, v in obj.items():
                              new_path = f"{path}.{k}" if path else k
                              if k == target:
                                  results.append((new_path, v))
                              results.extend(find_key(v, target, new_path))
                      elif isinstance(obj, list):
                          for i, v in enumerate(obj[:20]):
                              results.extend(find_key(v, target, f"{path}[{i}]"))
                      return results
                  desc_hits = find_key(data, "description")
                  print(f'=== {len(desc_hits)} "description" key(s) found ===')
                  for path, val in desc_hits[:10]:
                      sval = repr(val)
                      if len(sval) > 300:
                          sval = sval[:300] + "...(truncated)"
                      print(f"  {path}: {sval}")
          PYEOF

          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "/script/pod.py"]
                env:
                  - name: TEST_URL
                    value: "$TEST_URL"
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait for completion, print logs, then clean up (always)
        if: always()
        run: |
          for i in $(seq 1 60); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then
              break
            fi
            sleep 3
          done
          echo "--- pod logs ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 || echo "(no logs captured)"
          echo "--- cleaning up throwaway pod + configmap ---"
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
