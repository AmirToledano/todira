name: CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Docker/GHCR repository names MUST be all-lowercase, but a GitHub username/org
  # (github.repository_owner) can contain uppercase letters — computed once here and reused via
  # job outputs, since GitHub Actions expressions have no built-in toLower().
  vars:
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: vars
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [bot, scraper]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/diramir-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/diramir-${{ matrix.service }}:latest

  deploy:
    needs: [vars, build-and-push]
    runs-on: ubuntu-latest
    # This job will fail until the cluster/VPS exists and the three repo secrets below are set
    # (Settings > Secrets and variables > Actions) — expected at this stage of the project, not
    # a bug. See plan Section 8.
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Helm upgrade
        run: |
          helm upgrade --install diramir charts/diramir \
            -f charts/diramir/values.yaml \
            --set botImage.repository=${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/diramir-bot \
            --set botImage.tag=${{ github.sha }} \
            --set scraperImage.repository=${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/diramir-scraper \
            --set scraperImage.tag=${{ github.sha }} \
            --set postgres.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set telegramBotToken=${{ secrets.TELEGRAM_BOT_TOKEN }} \
            --namespace diramir --create-namespace
