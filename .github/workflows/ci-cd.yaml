name: CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Docker/GHCR repository names MUST be all-lowercase, but a GitHub username/org
  # (github.repository_owner) can contain uppercase letters — computed once here and reused via
  # job outputs, since GitHub Actions expressions have no built-in toLower().
  vars:
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-test.txt

      - run: python -m pytest tests/ -v

  build-and-push:
    needs: [vars, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [bot, scraper, website]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-${{ matrix.service }}:latest

  deploy:
    needs: [vars, build-and-push]
    runs-on: ubuntu-latest
    # This job will fail until the cluster/VPS exists and the three repo secrets below are set
    # (Settings > Secrets and variables > Actions) — expected at this stage of the project, not
    # a bug. See plan Section 8.
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Helm upgrade
        run: |
          helm upgrade --install todira charts/todira \
            -f charts/todira/values.yaml \
            --set botImage.repository=${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-bot \
            --set botImage.tag=${{ github.sha }} \
            --set scraperImage.repository=${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-scraper \
            --set scraperImage.tag=${{ github.sha }} \
            --set websiteImage.repository=${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-website \
            --set websiteImage.tag=${{ github.sha }} \
            --set postgres.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set telegramBotToken=${{ secrets.TELEGRAM_BOT_TOKEN }} \
            --set geminiApiKey=${{ secrets.GEMINI_API_KEY }} \
            --set zenrowsApiKey=${{ secrets.ZENROWS_API_KEY }} \
            --namespace todira --create-namespace

      - name: Diagnose bot pod (owner reported it's not responding)
        if: always()
        run: |
          echo "--- pods ---"
          kubectl get pods -n todira -o wide
          echo "--- recent events ---"
          kubectl get events -n todira --sort-by=.lastTimestamp | tail -40
          echo "--- bot describe ---"
          kubectl describe pod -n todira -l app=todira-bot
          echo "--- bot logs (current container) ---"
          kubectl logs -n todira -l app=todira-bot --tail=150 || true
          echo "--- bot logs (previous container, if it restarted) ---"
          kubectl logs -n todira -l app=todira-bot --tail=150 --previous || true

      - name: Diagnose Caddy (HTTPS rollout)
        if: always()
        run: |
          echo "--- caddy pod ---"
          kubectl get pods -n todira -l app=todira-caddy -o wide
          echo "--- caddy describe ---"
          kubectl describe pod -n todira -l app=todira-caddy
          echo "--- caddy logs ---"
          kubectl logs -n todira -l app=todira-caddy --tail=150 || true
