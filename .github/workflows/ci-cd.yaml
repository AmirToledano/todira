name: CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Docker/GHCR repository names MUST be all-lowercase, but a GitHub username/org
  # (github.repository_owner) can contain uppercase letters — computed once here and reused via
  # job outputs, since GitHub Actions expressions have no built-in toLower().
  vars:
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-test.txt

      - run: python -m pytest tests/ -v

  build-and-push:
    needs: [vars, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [bot, scraper, website]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-${{ matrix.service }}:latest

  deploy:
    needs: [vars, build-and-push]
    runs-on: ubuntu-latest
    # This job will fail until the cluster/VPS exists and the three repo secrets below are set
    # (Settings > Secrets and variables > Actions) — expected at this stage of the project, not
    # a bug. See plan Section 8.
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          # Pinned, NOT "latest" — was a hypothesis while root-causing the PR #40 deploy outage
          # (see PROJECT_STATE.md, "deploy pipeline broken" 2026-08-31). Turned out not to be the
          # actual cause (a missing `namespace:` in the kubeconfig context was), but left pinned
          # since pinning a CI tool version is good practice regardless — bump deliberately.
          version: "v3.16.4"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: One-time fix - clear stale rollingUpdate on bot Deployment
        # The bot Deployment's live spec.strategy.type was still RollingUpdate (never actually
        # flipped to Recreate - every prior helm upgrade attempt failed validation before any
        # change could land) - and as long as type stays RollingUpdate, the Kubernetes API server
        # auto-DEFAULTS rollingUpdate:{maxSurge:25%,maxUnavailable:25%} back in on every
        # read/mutation. A separate "just remove rollingUpdate" patch (tried in PR #17) lost that
        # race every time: by the time Helm's own apply ran moments later, defaulting had already
        # re-populated the field, so `type:Recreate` + a re-defaulted `rollingUpdate` was rejected
        # again (confirmed via diagnostics in PR #18 - kubectl get right after that patch still
        # showed rollingUpdate present and type still RollingUpdate).
        # Real fix: change type to Recreate AND remove rollingUpdate in ONE atomic JSON Patch, so
        # there's no intermediate RollingUpdate-typed state for the defaulter to act on. Safe to
        # run every deploy indefinitely - once type is Recreate this is a permanent no-op.
        run: |
          kubectl patch deployment todira-bot -n todira --type=json \
            -p='[{"op":"replace","path":"/spec/strategy/type","value":"Recreate"},{"op":"remove","path":"/spec/strategy/rollingUpdate"}]' || true
          echo "--- live strategy after patch ---"
          kubectl get deployment todira-bot -n todira -o jsonpath='{.spec.strategy}' || true
          echo ""
      - name: Helm upgrade
        # Every --set value is double-quoted, deliberately. Deploys #88 kept reporting failure
        # (exit 127, "--namespace: command not found") even though Helm itself had *already*
        # succeeded ("Release todira has been upgraded", correct revision, STATUS: deployed) -
        # a secret value with a trailing newline (however it got there - a copy/paste artifact
        # from setting the secret) turns into a literal embedded newline once GitHub Actions
        # substitutes ${{ }} into this script, which splits the line the same way pressing Enter
        # mid-command would, stranding "--namespace ..." as its own bogus command on the next
        # line. A double-quoted value keeps an embedded newline as literal string content instead
        # of a script line break, so this can't happen again regardless of how a secret's value
        # was set - this isn't about getting any one paste "clean" anymore.
        run: |
          helm upgrade --install todira charts/todira \
            -f charts/todira/values.yaml \
            --set botImage.repository="${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-bot" \
            --set botImage.tag="${{ github.sha }}" \
            --set scraperImage.repository="${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-scraper" \
            --set scraperImage.tag="${{ github.sha }}" \
            --set websiteImage.repository="${{ env.REGISTRY }}/${{ needs.vars.outputs.image_owner }}/todira-website" \
            --set websiteImage.tag="${{ github.sha }}" \
            --set postgres.password="${{ secrets.POSTGRES_PASSWORD }}" \
            --set telegramBotToken="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --set geminiApiKey="${{ secrets.GEMINI_API_KEY }}" \
            --set zenrowsApiKey="${{ secrets.ZENROWS_API_KEY }}" \
            --set ownerTelegramUserId="${{ secrets.OWNER_TELEGRAM_USER_ID }}" \
            --set sessionSecretKey="${{ secrets.SESSION_SECRET_KEY }}" \
            --set whatsappAccessToken="${{ secrets.WHATSAPP_ACCESS_TOKEN }}" \
            --set whatsappPhoneNumberId="${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" \
            --set whatsappWebhookVerifyToken="${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}" \
            --set whatsappAppSecret="${{ secrets.WHATSAPP_APP_SECRET }}" \
            --set googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set growPageCode="${{ secrets.GROW_PAGE_CODE }}" \
            --set growUserId="${{ secrets.GROW_USER_ID }}" \
            --set growApiKey="${{ secrets.GROW_API_KEY }}" \
            --set brightDataApiKey="${{ secrets.BRIGHT_DATA_API_KEY }}" \
            --set brightDataDatasetId="${{ secrets.BRIGHT_DATA_DATASET_ID }}" \
            --set brightDataDescriptionField="${{ secrets.BRIGHT_DATA_DESCRIPTION_FIELD }}" \
            --set takbullWebhookSecret="${{ secrets.TAKBULL_WEBHOOK_SECRET }}" \
            --namespace todira --create-namespace

      - name: Diagnose bot pod (owner reported it's not responding)
        if: always()
        run: |
          echo "--- pods ---"
          kubectl get pods -n todira -o wide || true
          echo "--- recent events ---"
          kubectl get events -n todira --sort-by=.lastTimestamp | tail -40 || true
          echo "--- bot describe ---"
          kubectl describe pod -n todira -l app=todira-bot || true
          echo "--- bot logs (current container) ---"
          kubectl logs -n todira -l app=todira-bot --tail=150 || true
          echo "--- bot logs (previous container, if it restarted) ---"
          kubectl logs -n todira -l app=todira-bot --tail=150 --previous || true

      - name: Diagnose website pod (WhatsApp webhook + Gemini chat live there)
        # Added 2026-09-06 after the owner reported the new chat-with-existing-user feature
        # ("technical hiccup") failing live with no way to see the actual Gemini exception behind
        # it — this pod had no diagnostics step at all before, only the bot pod did.
        if: always()
        run: |
          echo "--- pods ---"
          kubectl get pods -n todira -o wide || true
          echo "--- website describe ---"
          kubectl describe pod -n todira -l app=todira-website || true
          echo "--- website logs (current container) ---"
          kubectl logs -n todira -l app=todira-website --tail=200 || true
          echo "--- website logs (previous container, if it restarted) ---"
          kubectl logs -n todira -l app=todira-website --tail=200 --previous || true

      - name: Diagnose Caddy (HTTPS rollout)
        if: always()
        run: |
          echo "--- caddy pod ---"
          kubectl get pods -n todira -l app=todira-caddy -o wide
          echo "--- caddy describe ---"
          kubectl describe pod -n todira -l app=todira-caddy
          echo "--- caddy logs ---"
          kubectl logs -n todira -l app=todira-caddy --tail=150 || true

