name: Diagnose — where a main scraper run spends its time (read-only)

# 2026-10-19 (owner: scan every 30 minutes): a run takes 41-43 minutes, so a 30-minute schedule would only skip every
# second run. This prints the timeline of the newest COMPLETED main scraper run: each log line's time and the first
# words of its message (logger name and level kept), so the slow steps show. Notifier lines are left out entirely,
# and every line is cut short, so no user detail reaches these public logs. Read-only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Timeline of the newest completed run
        run: |
          POD=$(kubectl get pods -n todira -l app=todira-scraper --field-selector=status.phase=Succeeded \
            --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || true)
          if [ -z "$POD" ]; then echo "No completed scraper pod found"; exit 0; fi
          echo "pod: $POD"
          kubectl logs -n todira "$POD" --tail=5000 \
            | grep -v -i "notifier" \
            | cut -c1-140
