name: Diagnose - what the last scraper runs counted as new, by source (read-only, counts only)

# Read-only, manual-only. After the Yad2 tile sweep's first live run the summary said new=778 and 365 notifications (usually ~300 and
# ~30). This counts, per source and deal type, the listings first seen in the last 3 hours, how many of them were stored quietly
# (first_seen_at pushed back by the seed policy), and how many Yad2 rows changed price. Counts only, nothing about any listing.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Count in a throwaway pod
        run: |
          POD_NAME="newads-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "psycopg2-binary"])
          import os, psycopg2
          cur = psycopg2.connect("postgresql://" + os.environ["DATABASE_URL"].split("://", 1)[1]).cursor()
          def q(title, sql):
              cur.execute(sql)
              print(f"== {title}")
              for row in cur.fetchall():
                  print("==   " + " | ".join(str(c) for c in row))
          q("Komo: how far below the highest known id are ads first seen in the last 24h (rent, steady trickle)? gap = max_id - id",
            """with m as (select max(external_id::bigint) mx from listings where source='komo' and external_id ~ '^[0-9]+$')
               select deal_type, count(*), min(mx - external_id::bigint), percentile_cont(0.5) within group (order by mx - external_id::bigint),
                      percentile_cont(0.9) within group (order by mx - external_id::bigint), max(mx - external_id::bigint)
               from listings, m where source='komo' and external_id ~ '^[0-9]+$' and first_seen_at > now() - interval '24 hours' group by 1""")
          q("Komo: id range of all held rows and of rows first seen before today (to see the id growth over time)",
            """select deal_type, min(external_id::bigint), max(external_id::bigint), count(*) from listings
               where source='komo' and external_id ~ '^[0-9]+$' group by 1""")
          q("Komo rent: for ads first seen on each of the last 4 days, the max id seen that day",
            """select date_trunc('day', first_seen_at) d, count(*), max(external_id::bigint) from listings
               where source='komo' and deal_type='rent' and external_id ~ '^[0-9]+$' and first_seen_at > now() - interval '4 days' group by 1 order by 1""")
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 300
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "-u", "/script/pod.py"]
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait, print results, clean up (always)
        if: always()
        run: |
          for i in $(seq 1 100); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- results ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep "^==" || kubectl logs -n todira "$POD_NAME" 2>&1 | tail -10
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
