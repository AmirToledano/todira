name: Diagnose - what the last scraper runs counted as new, by source (read-only, counts only)

# Read-only, manual-only. After the Yad2 tile sweep's first live run the summary said new=778 and 365 notifications (usually ~300 and
# ~30). This counts, per source and deal type, the listings first seen in the last 3 hours, how many of them were stored quietly
# (first_seen_at pushed back by the seed policy), and how many Yad2 rows changed price. Counts only, nothing about any listing.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Count in a throwaway pod
        run: |
          POD_NAME="newads-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "psycopg2-binary"])
          import os, psycopg2
          cur = psycopg2.connect("postgresql://" + os.environ["DATABASE_URL"].split("://", 1)[1]).cursor()
          def q(title, sql):
              cur.execute(sql)
              print(f"== {title}")
              for row in cur.fetchall():
                  print("==   " + " | ".join(str(c) for c in row))
          q("Yad2 rent: rows by hour of first_seen_at over the last 6 hours (all, then only those NOT pushed back by the seed policy)",
            """select date_trunc('hour', first_seen_at) h, count(*) all_rows,
                      count(*) filter (where first_seen_at > now() - interval '7 days') as announced_rows
               from listings where source = 'yad2' and deal_type = 'rent' and first_seen_at > now() - interval '6 hours'
               group by 1 order by 1""")
          q("Yad2 rent rows announced as new in the last 40 minutes (this run only), by whether the ad is still active",
            "select is_delisted, count(*) from listings where source='yad2' and deal_type='rent' and first_seen_at > now() - interval '40 minutes' group by 1")
          q("Komo rows announced in the last 6h, by hour",
            "select date_trunc('hour', first_seen_at) h, deal_type, count(*) from listings where source='komo' and first_seen_at > now() - interval '6 hours' group by 1, 2 order by 1, 2")
          q("Yad2 rent: how many rows were backdated by the seed policy this run (first_seen_at older than 7 days but inserted recently = highest ids)",
            "select count(*) from listings where source='yad2' and deal_type='rent' and first_seen_at < now() - interval '7 days' and id > (select max(id) - 30000 from listings)")
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 300
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "-u", "/script/pod.py"]
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait, print results, clean up (always)
        if: always()
        run: |
          for i in $(seq 1 100); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- results ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep "^==" || kubectl logs -n todira "$POD_NAME" 2>&1 | tail -10
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
