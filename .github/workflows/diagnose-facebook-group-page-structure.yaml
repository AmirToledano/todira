name: Diagnose — real Facebook Group page structure via the stored session cookie (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push). 2026-09-15.
#
# Real next step for the Facebook Groups scraping feature (owner request: "קבוצות פייסבוק תתחיל
# לעבוד") — the owner sent a real group URL (share/g/1Hvrt4zzNA, "פשפשוק - דירות להשכרה") to test
# against. Same discipline as diagnose-facebook-marketplace-page-structure.yaml (and this whole
# project's history — yad2_client.py needed 8 attempts, komo/homeless_client.py each needed a live
# diagnostic before being written): never guess a Group post's real field structure, look at one
# real fetch first. Same cookie-masking mechanism, same "print structure only on a real 200, print
# the raw body only on non-200 (Facebook's own generic error/wall page, never another user's real
# data)" contract.
#
# Deliberately ONE request per run — same careful, low-volume diagnostic posture already used for
# Marketplace, before anything else touches the live (dedicated, not personal) Facebook account.
on:
  workflow_dispatch:
    inputs:
      group_url:
        description: 'Full Facebook group URL to test (default: the owner-provided share link for פשפשוק - דירות להשכרה)'
        required: false
        type: string
        default: 'https://www.facebook.com/share/g/1Hvrt4zzNA/?mibextid=wwXIfr'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Fetch the group page (following the share-link redirect), using the stored cookie
        # A share/g/... URL is a short redirect link, not the canonical group URL — curl's own
        # -L/--max-redirs follows it to the real facebook.com/groups/<id>/ page, same as a real
        # browser would. GROUP_URL itself is a public link the owner already shared in this
        # conversation, never secret — safe to read via normal ${{ }} interpolation and to print.
        env:
          GROUP_URL: ${{ inputs.group_url }}
        run: |
          COOKIE=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.facebook-cookies}' | base64 -d)
          echo "::add-mask::$COOKIE"
          if [ -z "$COOKIE" ]; then
            echo "facebook-cookies is empty in todira-bot-secret — nothing to test with. Re-run set-facebook-cookies-secret.yaml first."
            exit 1
          fi

          echo "=== Fetching $GROUP_URL ==="
          STATUS=$(curl -sS --compressed -L --max-redirs 5 \
            -D /tmp/fb_group_headers.txt \
            -o /tmp/fb_group_body.html \
            -w "%{http_code}" \
            --max-time 30 \
            -H "Cookie: $COOKIE" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-User: ?1" \
            -H "Sec-Fetch-Dest: document" \
            -H "sec-ch-ua: \"Chromium\";v=\"128\", \"Not;A=Brand\";v=\"24\", \"Google Chrome\";v=\"128\"" \
            -H "sec-ch-ua-mobile: ?0" \
            -H "sec-ch-ua-platform: \"Windows\"" \
            "$GROUP_URL") || STATUS="curl_failed"
          echo "http_status=$STATUS redirect_lines=$(grep -ic '^location:' /tmp/fb_group_headers.txt || echo 0) size_bytes=$(wc -c < /tmp/fb_group_body.html 2>/dev/null || echo 0)"
          echo "$STATUS" > /tmp/fb_group_status.txt
          echo "--- every Location: header seen along the redirect chain (the real resolved group URL) ---"
          grep -i '^location:' /tmp/fb_group_headers.txt || echo "(no redirects captured)"

      - name: Analyze the saved page
        run: |
          echo "=== Response headers ==="
          grep -iE "^(location|content-type|content-length):" /tmp/fb_group_headers.txt || true
          echo
          python3 -c "
          import re
          from collections import Counter

          with open('/tmp/fb_group_body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          print(f'=== Body length: {len(html)} chars ===')

          title_match = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
          print(f'Title: {title_match.group(1).strip() if title_match else \"(no <title> found)\"}')

          lower = html.lower()
          login_signals = [s for s in ('log in to facebook', 'loginform', 'checkpoint', 'login.php', 'two-factor', 'name=\"email\"') if s in lower]
          print(f'Login/checkpoint-wall signals present: {login_signals or \"none\"}')

          # Same generic GraphQL structural scan as the Marketplace diagnostic — a Group's feed
          # embeds its real data as GraphQL-shaped JSON with __typename markers too, but the real
          # type names for a Group post are NOT known yet (different from Marketplace's
          # MarketplaceFeedListingStory) — this frequency table is how we find out.
          typenames = re.findall(r'\"__typename\":\"([A-Za-z0-9_]+)\"', html)
          counts = Counter(typenames)
          print(f'=== __typename occurrences found: {len(typenames)} total, {len(counts)} distinct ===')
          for name, count in counts.most_common(40):
              print(f'  {name}: {count}')

          # Group post permalinks follow a stable, documented URL shape regardless of internal
          # markup changes — both the /groups/<gid>/posts/<pid>/ and older /permalink/<pid>/ forms.
          post_ids = sorted(set(re.findall(r'/groups/\d+/(?:posts|permalink)/(\d+)', html)))
          print(f'=== Distinct group post permalink ids found: {len(post_ids)} ===')
          if post_ids:
              print(f'First few ids: {post_ids[:5]}')

          group_ids = sorted(set(re.findall(r'/groups/(\d+)', html)))
          print(f'=== Distinct /groups/<id> references found: {len(group_ids)} ===')
          if group_ids:
              print(f'First few ids: {group_ids[:5]}')

          script_json_count = len(re.findall(r'<script type=\"application/json\"', html))
          print(f'=== <script type=\"application/json\"> blocks found: {script_json_count} ===')
          "

          STATUS=$(cat /tmp/fb_group_status.txt 2>/dev/null || echo "")
          if [ "$STATUS" != "200" ]; then
            echo
            echo "=== Raw response body (status=$STATUS, non-200 — Facebook's own generic error/wall page, not real group content, so safe to print in full) ==="
            cat /tmp/fb_group_body.html
          fi

      - name: Generic key-name scan for likely post fields (text/message/story/attachment/author/time)
        # Same technique as the Marketplace diagnostic's detail-page scan — the real post node
        # type isn't known yet, so this walks every parsed JSON object and flags any dict that
        # itself owns a key whose NAME contains one of these target substrings, printing just that
        # dict's __typename and the matching field(s). This is the real content the Groups feature
        # needs (post text/author/time — the actual listing text a member posted), same category of
        # data this project's other diagnose-*.yaml workflows already print for other sources.
        run: |
          STATUS=$(cat /tmp/fb_group_status.txt 2>/dev/null || echo "")
          if [ "$STATUS" != "200" ]; then
            echo "Skipping — fetch wasn't a 200 (status=$STATUS), nothing real to extract."
            exit 0
          fi
          python3 -c "
          import re, json

          with open('/tmp/fb_group_body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          script_blocks = re.findall(r'<script type=\"application/json\"[^>]*>(.*?)</script>', html, re.S)
          print(f'Scanning {len(script_blocks)} JSON script blocks for likely post fields...')

          TARGET_KEY_SUBSTRINGS = ('message', 'story', 'attachment', 'creation_time', 'author', 'permalink', 'group_id')
          seen_ids = set()
          matches = []

          def walk(obj):
              if len(matches) >= 15:
                  return
              if isinstance(obj, dict):
                  if id(obj) not in seen_ids:
                      matching_keys = [k for k in obj.keys() if any(sub in k.lower() for sub in TARGET_KEY_SUBSTRINGS)]
                      if matching_keys:
                          seen_ids.add(id(obj))
                          matches.append((obj.get('__typename', '?'), matching_keys, obj))
                  for v in obj.values():
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v)

          for block in script_blocks:
              block = block.strip()
              if block.startswith('for (;;);'):
                  block = block[len('for (;;);'):]
              if block.startswith('<!--') and block.endswith('-->'):
                  block = block[4:-3].strip()
              if not block:
                  continue
              try:
                  data = json.loads(block)
              except json.JSONDecodeError:
                  continue
              walk(data)

          def truncate(v, n=300):
              s = repr(v)
              return s if len(s) <= n else s[:n] + '...(truncated)'

          print(f'=== {len(matches)} dict(s) with a post-like key found ===')
          for typename, keys, obj in matches:
              print(f'')
              print(f'--- __typename={typename}, matching keys={keys} ---')
              for k in keys:
                  print(f'  {k}: {truncate(obj[k])}')
          "
