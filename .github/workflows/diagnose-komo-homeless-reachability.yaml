name: Diagnose Komo + Homeless — reachability and page shape (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-12. First
# real step of building Komo/Homeless scrapers (Source.KOMO/Source.HOMELESS already exist in
# common/dorin_common/enums.py, added 2026-09-08 in anticipation of this). Same discipline this
# project already used for Yad2 (diagnose-search-page-cheap-fetch.yaml etc.): never guess a site's
# URL structure or page shape — fetch it for real through the same paid ZenRows infrastructure
# already used for Yad2 (legitimate infra this project pays for, not custom bot-detection-bypass
# code), and read what actually comes back, before writing a single line of parser code.
#
# This sandbox's own network egress cannot reach either site directly (org policy blocks arbitrary
# outbound hosts) — GitHub Actions runners have full outbound internet access, so this workflow is
# the diagnostic vehicle, exactly like every prior "diagnose-*" workflow in this repo.
#
# 2026-09-12, resolved with the owner's own live DevTools help: Komo's real two-stage pipeline —
#   1. code/nadlan/details/?modaaNum=<id> — a real per-listing detail page. CONFIRMED plain-
#      fetchable (no JS render) at 1 credit, containing the exact real data (price/address) the
#      owner was looking at live.
#   2. api/modaotservice/adscoordinates/list/ — cheap JSON [{id, uid, lat, lng}, ...] per listing.
#      Confirmed via the owner's own DevTools Payload tab: POST form data `iska=1` +
#      `sessionToken=<value>`. The token IS embedded in the search-results page's own plain HTML —
#      confirmed live (`window.sessionToken = "E327BE43D5B24F55A3AD23AA35FF5F2D"`), so the whole
#      pipeline is fully automatable end-to-end with zero DevTools/manual steps: two plain fetches
#      (search page -> token; details page -> data) + one plain POST (token -> id list), all at the
#      cheapest 1-credit ZenRows tier, no JS rendering anywhere.
#
# Added below: a step to dump the ACTUAL price/rooms/floor/size markup around the details page's
# known-real listing (modaaNum=4471462, already confirmed to contain "7,000" and "שערי ירושלים")
# — before writing komo_client.py's parser, see the real HTML structure surrounding those values
# instead of guessing CSS classes/regex shapes the way _parse_cards's Yad2 patterns were built off
# a real fetched page, not assumption.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the search page plain and hunt for an embedded sessionToken
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.komo.co.il/code/nadlan/apartments-for-rent.asp?nehes=1&cityName=ירושלים" \
            -o /tmp/search.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 100
          python3 - << 'PYEOF'
          import re
          with open('/tmp/search.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          # Look for anything that looks like a session token: a hex/base64-ish string near the
          # literal word "sessionToken", in a JS var, hidden input, or data attribute.
          hits = re.findall(r'.{0,60}sessionToken.{0,80}', html, re.I)
          print(f"'sessionToken' mentions: {len(hits)}")
          for h in hits[:10]:
              print("  ", re.sub(r'\s+', ' ', h))
          PYEOF

      - name: If a token was found, try the adscoordinates/list/ POST with it (real iska=1 form)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          TOKEN=$(python3 - << 'PYEOF'
          import re
          with open('/tmp/search.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          m = re.search(r'sessionToken["\']?\s*[:=]\s*["\']?([A-Za-z0-9]{16,64})', html)
          print(m.group(1) if m else '')
          PYEOF
          )
          echo "extracted token: ${TOKEN:-<none found>}"
          if [ -z "$TOKEN" ]; then
            echo "No token found in plain HTML — the two-stage flow needs a different source for it (real answer, not a guess)."
            exit 0
          fi
          # POST (not -G): ZenRows forwards the method + body you send them straight to the target
          # URL. apikey/url go in the query string of ZenRows' own endpoint; the real target POST
          # body (iska=1&sessionToken=...) goes as this request's own -d body.
          TARGET_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('https://www.komo.co.il/api/modaotservice/adscoordinates/list/', safe=''))")
          curl -sS "https://api.zenrows.com/v1/?apikey=${ZENROWS_API_KEY}&url=${TARGET_ENC}" \
            -d "iska=1&sessionToken=${TOKEN}" \
            -o /tmp/coords2.json \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 100
          echo "--- body (first 1500 chars) ---"
          head -c 1500 /tmp/coords2.json

      - name: Dump the real markup around price/rooms/floor/size on Komo's details page (real listing, already confirmed)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.komo.co.il/code/nadlan/details/?modaaNum=4471462" \
            -o /tmp/details.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 100
          python3 - << 'PYEOF'
          import re
          with open('/tmp/details.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          flat = re.sub(r'>\s+<', '><', html)  # collapse inter-tag whitespace only, keep tag text
          for label, pattern in [
              ("price (7,000 / ₪)", r'.{0,150}(?:7,000|₪).{0,150}'),
              # 2026-09-12 run found a repeating "firstInfoBlockWrap" stat family (floor + "mr"/size
              # confirmed so far) — widening this one to see ALL of that family's blocks in one hit,
              # to learn the rooms/total-floors class names too instead of another round-trip.
              ("stat blocks (firstInfoBlockWrap family)", r'.{0,50}firstInfoBlockWrap.{0,900}'),
              ("address (שערי ירושלים)", r'.{0,150}שערי ירושלים.{0,150}'),
          ]:
              hits = re.findall(pattern, flat)
              print(f"=== {label}: {len(hits)} hit(s) ===")
              for h in hits[:4]:
                  print("  ", h)
              print()
          PYEOF

      - name: Dump the real markup around price on Homeless's /rent/ page (already confirmed plain-fetchable, prices in initial HTML)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.homeless.co.il/rent/" \
            -o /tmp/homeless.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 100
          echo "--- raw body (in case of a non-200 / ZenRows error) ---"
          cat /tmp/homeless.html
          echo
          python3 - << 'PYEOF'
          import re
          with open('/tmp/homeless.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          flat = re.sub(r'>\s+<', '><', html)
          hits = re.findall(r'.{0,200}₪.{0,200}', flat)
          print(f"'₪' contexts: {len(hits)}")
          for h in hits[:5]:
              print("  ", h)
          print()
          # Look for one full repeating listing-card block (a real <a href=".../rent/..."> wrapper)
          # to see what real per-listing fields (rooms/floor/size/address) live alongside price.
          card = re.search(r'<a[^>]+href="[^"]*/rent/[^"]*"[^>]*>.{0,600}', flat)
          if card:
              print("=== first candidate listing-card block ===")
              print(card.group(0))
          PYEOF
