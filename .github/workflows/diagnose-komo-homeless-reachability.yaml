name: Diagnose Komo + Homeless — reachability and page shape (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-12. First
# real step of building Komo/Homeless scrapers (Source.KOMO/Source.HOMELESS already exist in
# common/dorin_common/enums.py, added 2026-09-08 in anticipation of this). Same discipline this
# project already used for Yad2 (diagnose-search-page-cheap-fetch.yaml etc.): never guess a site's
# URL structure or page shape — fetch it for real through the same paid ZenRows infrastructure
# already used for Yad2 (legitimate infra this project pays for, not custom bot-detection-bypass
# code), and read what actually comes back, before writing a single line of parser code.
#
# This sandbox's own network egress cannot reach either site directly (org policy blocks arbitrary
# outbound hosts) — same reachability gap documented for Bright Data's Scraper Studio UI earlier
# in this project. GitHub Actions runners have full outbound internet access, so this workflow is
# the diagnostic vehicle, exactly like every prior "diagnose-*" workflow in this repo.
#
# Credit-saving principle applied throughout (owner's explicit instruction, 2026-09-12): a site's
# own static JS/CSS bundle files are almost never behind the same bot-protection as its HTML page
# — they're static assets, often CDN-served. Fetching them with a PLAIN curl (no ZenRows at all)
# costs zero credits, vs. routing everything through ZenRows. Only the actual HTML page fetch
# should ever cost a credit.
#
# 2026-09-12, continued: Komo turned out to be an old-style ASP/jQuery server-rendered site (not a
# modern JS-framework SPA) — no __NEXT_DATA__/__NUXT__, no map link, no obvious client-side fetch()
# call for listings. The likely explanation for zero results on a bare /code/rent/ fetch is that
# it's an empty search-results shell awaiting real query parameters (city/region), mirroring Yad2's
# own ?city=<id> pattern — not a JS-rendering problem at all. This step inspects the page's own
# <form> for real input/select names instead of guessing param names blind.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Komo's rent page (1 credit, already-confirmed-cheap) and inspect its own
          search form for real query-parameter names
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.komo.co.il/code/rent/" \
            -o /tmp/komo_rent.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 100
          python3 - << 'PYEOF'
          import re
          with open('/tmp/komo_rent.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          # Every <form ...> block, with its action/method, and every named input/select inside it
          # — the real, authoritative list of query-parameter names this page's own search actually
          # submits, instead of guessing city=/ir=/azor=/etc. blind.
          forms = re.findall(r'<form\b[^>]*>.*?</form>', html, re.S | re.I)
          print(f"forms found: {len(forms)}")
          for i, form in enumerate(forms, 1):
              action = re.search(r'action="([^"]*)"', form)
              method = re.search(r'method="([^"]*)"', form, re.I)
              print(f"--- form {i}: action={action.group(1) if action else None} method={method.group(1) if method else 'GET'} ---")
              names = re.findall(r'<(?:input|select)\b[^>]*\bname="([^"]+)"[^>]*>', form, re.I)
              for n in names:
                  print("   field:", n)

          if not forms:
              print("--- no <form> tags at all; dumping any <select>/<input> with a name= anywhere on the page ---")
              names = re.findall(r'<(?:input|select)\b[^>]*\bname="([^"]+)"[^>]*>', html, re.I)
              for n in sorted(set(names)):
                  print("   field:", n)

          # Also look for any hardcoded city/region ID lists (e.g. <option value="5000">תל אביב</option>)
          options = re.findall(r'<option[^>]*value="([^"]+)"[^>]*>([^<]{0,30})</option>', html, re.I)
          print(f"\noption value/label pairs found: {len(options)} (first 30)")
          for v, label in options[:30]:
              print(f"   {v!r} -> {label.strip()!r}")
          PYEOF

      - name: Verify the real results page the owner found live (nadlan/apartments-for-rent.asp
          with real query params) at the cheapest tier first
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          check_one () {
            label="$1"; url="$2"; shift 2
            echo "=== $label ($url) [$*] ==="
            curl -sS -D "/tmp/${label}.headers" -G "https://api.zenrows.com/v1/" \
              --data-urlencode "apikey=$ZENROWS_API_KEY" \
              --data-urlencode "url=$url" \
              "$@" \
              -o "/tmp/${label}.html" \
              -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
              --max-time 100 || echo "curl failed for $label"
            grep -i -E "cost|credit" "/tmp/${label}.headers" 2>/dev/null || echo "(no cost headers)"
            python3 - "$label" << 'PYEOF'
          import re, sys
          label = sys.argv[1]
          with open(f'/tmp/{label}.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          print(f"length={len(html)}")
          print(f"'₪' occurrences: {len(re.findall(r'₪', html))}")
          snippet = re.sub(r'\s+', ' ', html)[:1200]
          print(f"snippet: {snippet}")
          PYEOF
            echo
          }
          check_one "komo_real_plain" "https://www.komo.co.il/code/nadlan/apartments-for-rent.asp?nehes=1&cityName=ירושלים"
