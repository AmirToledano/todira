name: Diagnose Komo + Homeless — reachability and page shape (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-12. First
# real step of building Komo/Homeless scrapers (Source.KOMO/Source.HOMELESS already exist in
# common/dorin_common/enums.py, added 2026-09-08 in anticipation of this). Same discipline this
# project already used for Yad2 (diagnose-search-page-cheap-fetch.yaml etc.): never guess a site's
# URL structure or page shape — fetch it for real through the same paid ZenRows infrastructure
# already used for Yad2 (legitimate infra this project pays for, not custom bot-detection-bypass
# code), and read what actually comes back, before writing a single line of parser code.
#
# This sandbox's own network egress cannot reach either site directly (org policy blocks arbitrary
# outbound hosts) — same reachability gap documented for Bright Data's Scraper Studio UI earlier
# in this project. GitHub Actions runners have full outbound internet access, so this workflow is
# the diagnostic vehicle, exactly like every prior "diagnose-*" workflow in this repo.
#
# Credit-saving principle applied throughout (owner's explicit instruction, 2026-09-12): a site's
# own static JS/CSS bundle files are almost never behind the same bot-protection as its HTML page
# — they're static assets, often CDN-served. Fetching them with a PLAIN curl (no ZenRows at all)
# costs zero credits, vs. routing everything through ZenRows. Only the actual HTML page fetch
# (and, if truly needed, a real listing-data API call) should ever cost a credit.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm both real URLs still work + real per-config cost (baseline, unchanged)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          mkdir -p /tmp/out
          check_one () {
            label="$1"; url="$2"; shift 2
            echo "=== $label ($url) [$*] ==="
            curl -sS -D "/tmp/out/${label}.headers" -G "https://api.zenrows.com/v1/" \
              --data-urlencode "apikey=$ZENROWS_API_KEY" \
              --data-urlencode "url=$url" \
              "$@" \
              -o "/tmp/out/${label}.html" \
              -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
              --max-time 100 || echo "curl failed for $label"
            grep -i -E "cost|credit" "/tmp/out/${label}.headers" 2>/dev/null || echo "(no cost headers)"
            echo
          }
          check_one "komo_rent" "https://www.komo.co.il/code/rent/"
          check_one "homeless_rent" "https://www.homeless.co.il/rent/"

      - name: Look for a Komo map-view link on the rent page (owner's tip — map APIs are often
          cheap/unprotected JSON, same pattern as Yad2's own map)
        run: |
          python3 - << 'PYEOF'
          import re
          with open('/tmp/out/komo_rent.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          hrefs = set(re.findall(r'href="([^"]+)"', html))
          mapish = sorted(h for h in hrefs if re.search(r'map|מפה|geo', h, re.I))
          print(f"map-looking hrefs ({len(mapish)}):")
          for h in mapish:
              print(" ", h)
          PYEOF

      - name: Extract Komo's JS bundle URLs from the page, fetch them DIRECTLY (no ZenRows, $0),
          and search for the real listing-data API endpoint (including map/geo endpoints)
        run: |
          python3 - << 'PYEOF'
          import re
          with open('/tmp/out/komo_rent.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          # Every <script src="...">, resolved to absolute URLs — these are almost always static
          # assets servable with a plain request, not behind Komo's own anti-bot config.
          srcs = re.findall(r'<script[^>]+src="([^"]+)"', html)
          abs_srcs = []
          for s in srcs:
              if s.startswith('http'):
                  abs_srcs.append(s)
              elif s.startswith('//'):
                  abs_srcs.append('https:' + s)
              elif s.startswith('/'):
                  abs_srcs.append('https://www.komo.co.il' + s)
          # Keep the app's own bundles (skip obvious third-party analytics/font/ad scripts to save
          # both fetch time and noise) — Komo's own domain, or a same-brand CDN.
          own = [s for s in abs_srcs if 'komo.co.il' in s]
          print(f"total script srcs: {len(srcs)}, own-domain: {len(own)}")
          with open('/tmp/js_urls.txt', 'w') as f:
              f.write('\n'.join(own))
          for s in own:
              print(" ", s)
          PYEOF

      - name: Fetch each JS bundle directly (plain curl, zero ZenRows credits) and grep for API hints
        run: |
          mkdir -p /tmp/js
          i=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            echo "=== bundle $i: $url ==="
            curl -sS -o "/tmp/js/bundle_$i.js" -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
              --max-time 30 "$url" || echo "plain fetch failed for $url"
          done < /tmp/js_urls.txt
          echo
          echo "=== grepping all fetched bundles for API-endpoint-shaped strings (incl. map/geo) ==="
          grep -oE '"(/[a-zA-Z0-9_/-]*(api|map|geo|marker|pin)[a-zA-Z0-9_/-]*)"' /tmp/js/*.js 2>/dev/null | sort -u | head -60
          echo "--- fetch/axios/XHR call sites (context) ---"
          grep -oE '.{0,40}(fetch\(|axios\.(get|post)\(|XMLHttpRequest).{0,80}' /tmp/js/*.js 2>/dev/null | head -40
          echo "--- any absolute URL literals pointing at komo's own domain, other than the bundles themselves ---"
          grep -oE 'https?://[a-zA-Z0-9_.-]*komo\.co\.il/[a-zA-Z0-9_/.-]*' /tmp/js/*.js 2>/dev/null | sort -u | head -40
