name: Diagnose Komo + Homeless — reachability and page shape (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-12. First
# real step of building Komo/Homeless scrapers (Source.KOMO/Source.HOMELESS already exist in
# common/dorin_common/enums.py, added 2026-09-08 in anticipation of this). Same discipline this
# project already used for Yad2 (diagnose-search-page-cheap-fetch.yaml etc.): never guess a site's
# URL structure or page shape — fetch it for real through the same paid ZenRows infrastructure
# already used for Yad2 (legitimate infra this project pays for, not custom bot-detection-bypass
# code), and read what actually comes back, before writing a single line of parser code.
#
# This sandbox's own network egress cannot reach either site directly (org policy blocks arbitrary
# outbound hosts) — same reachability gap documented for Bright Data's Scraper Studio UI earlier
# in this project. GitHub Actions runners have full outbound internet access, so this workflow is
# the diagnostic vehicle, exactly like every prior "diagnose-*" workflow in this repo.
#
# For each site, tries a small set of plausible candidate URLs for a Tel Aviv rental search (no
# single correct URL confirmed yet) and reports, per candidate: HTTP status, byte size, and a
# short snippet — so the real one can be picked from evidence instead of guessed. Writes nothing,
# costs a handful of ZenRows requests only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate Komo rental-search URLs
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          mkdir -p /tmp/komo
          i=0
          for url in \
            "https://www.komo.co.il/for-rent" \
            "https://www.komo.co.il/nadlan/for-rent" \
            "https://www.komo.co.il/code/nadlan-search-results.aspx?type=2" \
            "https://www.komo.co.il/"; do
            i=$((i+1))
            echo "=== candidate $i: $url ==="
            curl -sS -G "https://api.zenrows.com/v1/" \
              --data-urlencode "apikey=$ZENROWS_API_KEY" \
              --data-urlencode "url=$url" \
              --data-urlencode "js_render=true" \
              --data-urlencode "premium_proxy=true" \
              --data-urlencode "block_resources=image,stylesheet,font,media" \
              -o "/tmp/komo/candidate_$i.html" \
              -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
              --max-time 100 || echo "curl failed for candidate $i"
          done

      - name: Analyze Komo candidates
        run: |
          python3 - << 'PYEOF'
          import re, glob

          for path in sorted(glob.glob('/tmp/komo/candidate_*.html')):
              with open(path, encoding='utf-8', errors='replace') as f:
                  html = f.read()
              print(f"--- {path} ---")
              print(f"length={len(html)}")
              # Any obvious listing-card signal: price-like strings with ₪, or repeated anchor blocks
              price_hits = len(re.findall(r'₪', html))
              print(f"'₪' occurrences: {price_hits}")
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              print(f"__NEXT_DATA__ present: {bool(m)}")
              nuxt = re.search(r'window\.__NUXT__\s*=', html)
              print(f"__NUXT__ present: {bool(nuxt)}")
              snippet = re.sub(r'\s+', ' ', html)[:600]
              print(f"snippet: {snippet}")
              print()
          PYEOF

      - name: Try candidate Homeless rental-search URLs
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          mkdir -p /tmp/homeless
          i=0
          for url in \
            "https://www.homeless.co.il/rent/" \
            "https://www.homeless.co.il/rent" \
            "https://www.homeless.co.il/nadlanmain.php" \
            "https://www.homeless.co.il/"; do
            i=$((i+1))
            echo "=== candidate $i: $url ==="
            curl -sS -G "https://api.zenrows.com/v1/" \
              --data-urlencode "apikey=$ZENROWS_API_KEY" \
              --data-urlencode "url=$url" \
              --data-urlencode "js_render=true" \
              --data-urlencode "premium_proxy=true" \
              --data-urlencode "block_resources=image,stylesheet,font,media" \
              -o "/tmp/homeless/candidate_$i.html" \
              -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
              --max-time 100 || echo "curl failed for candidate $i"
          done

      - name: Analyze Homeless candidates
        run: |
          python3 - << 'PYEOF'
          import re, glob

          for path in sorted(glob.glob('/tmp/homeless/candidate_*.html')):
              with open(path, encoding='utf-8', errors='replace') as f:
                  html = f.read()
              print(f"--- {path} ---")
              print(f"length={len(html)}")
              price_hits = len(re.findall(r'₪', html))
              print(f"'₪' occurrences: {price_hits}")
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              print(f"__NEXT_DATA__ present: {bool(m)}")
              nuxt = re.search(r'window\.__NUXT__\s*=', html)
              print(f"__NUXT__ present: {bool(nuxt)}")
              snippet = re.sub(r'\s+', ' ', html)[:600]
              print(f"snippet: {snippet}")
              print()
          PYEOF
