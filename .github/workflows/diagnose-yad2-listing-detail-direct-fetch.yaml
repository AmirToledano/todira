name: Diagnose — does a plain, direct (no proxy, no JS render) fetch of a Yad2 LISTING page already carry the description? (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-15.
#
# Direct continuation of tonight's Bright Data investigation, now pivoting per the owner's own
# request: find the cheapest/simplest real option for Yad2 listing DESCRIPTIONS (the actual open
# problem — Bright Data's Scraper Studio collector is blocked by the account's trial tier;
# Web Unlocker needs KYC the owner cancelled; ZenRows bills Yad2 at its expensive anti-bot tier).
#
# Real reasoning for why this is worth testing before anything more complex: Yad2's search/map
# pages already work perfectly via a PLAIN, un-proxied, non-JS-rendered direct request (confirmed
# live earlier tonight — see yad2_client.py's own _fetch_direct docstring). The individual listing
# detail page's __NEXT_DATA__ (containing metaData.description, the real human-written text — see
# PROJECT_STATE.md's 2026-09-11 entry) is a Next.js server-side-rendered page, meaning the data is
# typically already embedded in the RAW server response HTML with no client-side JS execution
# needed to populate it — Bright Data's own historical "empty capture" issue on this page type was
# their own headless-browser navigation timing racing the page's OWN server response (a browser-
# automation-specific reliability bug), not proof that the raw HTML itself lacks the data. This
# tests that directly: a plain httpx-style GET, no proxy, no JS rendering, same technique already
# proven for search/map pages — checking whether __NEXT_DATA__.metaData.description is present and
# populated in the raw response. If yes, this is a $0-marginal-cost, zero-third-party-dependency
# fix — no Bright Data, no ZenRows, no KYC, nothing to build beyond a plain HTTP GET our own
# scraper pod can already make from its own IP.
on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "A real, currently-live Yad2 item URL to test"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the listing page directly, no proxy, no JS rendering
        env:
          TEST_URL: ${{ inputs.test_url }}
        run: |
          echo "=== GET $TEST_URL (direct, no proxy) ==="
          curl -sS -L --max-redirs 5 \
            -D /tmp/headers.txt \
            -o /tmp/body.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            "$TEST_URL" || true

      - name: Parse for __NEXT_DATA__ and the real description field
        run: |
          python3 -c "
          import re, json

          with open('/tmp/body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          print(f'=== Body length: {len(html)} chars ===')

          title_match = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
          print(f'Title: {title_match.group(1).strip() if title_match else \"(no title found)\"}')

          radware_signals = [s for s in ('Radware', 'challenge', 'validate.perfdrive') if s.lower() in html.lower()]
          print(f'Radware/challenge signals: {radware_signals or \"none\"}')

          m = re.search(r'<script id=\"__NEXT_DATA__\"[^>]*>(.*?)</script>', html, re.S)
          if not m:
              print('NO __NEXT_DATA__ script tag found at all.')
          else:
              print(f'__NEXT_DATA__ found, {len(m.group(1))} chars')
              try:
                  data = json.loads(m.group(1))
              except json.JSONDecodeError as exc:
                  print(f'JSON parse failed: {exc}')
                  data = None
              if data is not None:
                  def find_key(obj, target, path=''):
                      results = []
                      if isinstance(obj, dict):
                          for k, v in obj.items():
                              new_path = f'{path}.{k}' if path else k
                              if k == target:
                                  results.append((new_path, v))
                              results.extend(find_key(v, target, new_path))
                      elif isinstance(obj, list):
                          for i, v in enumerate(obj[:20]):
                              results.extend(find_key(v, target, f'{path}[{i}]'))
                      return results
                  desc_hits = find_key(data, 'description')
                  print(f'=== {len(desc_hits)} \"description\" key(s) found ===')
                  for path, val in desc_hits[:10]:
                      sval = repr(val)
                      if len(sval) > 300:
                          sval = sval[:300] + '...(truncated)'
                      print(f'  {path}: {sval}')
          "
