name: Diagnose - this morning's leads, win-back and daily summary (read-only, counts)

# 2026-11-04 (owner): did the leads group get real seekers after PR 979, did win-back go out, did the daily summary
# reach the inbox group. Log lines only, counts; nothing about any person or post text.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
      - name: Logs
        run: |
          for APP in todira-facebook-scraper todira-scraper todira-daily-summary; do
            echo "##### $APP"
            for POD in $(kubectl get pods -n todira -l app=$APP --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | tail -4); do
              echo "=== $POD started $(kubectl get pod $POD -n todira -o jsonpath='{.status.startTime} {.status.phase}')"
              kubectl logs -n todira "$POD" --all-containers > /tmp/log 2>&1 || true
              grep -E "seeker leads|Facebook groups feed|win-?back|weekly report|morning summary|Traceback" /tmp/log \
                | sed -E 's/https?:[^ ]+/<url>/g; s/"[^"]*"/"<text>"/g' | cut -c1-300 | tail -8
              grep -oE "'(winback_sent|checkins_sent|referral_notes_sent|weekly_report|channel_posts|renewal_reminders_sent)': [^,}]*" /tmp/log | sort | uniq -c
              echo "ERROR lines: $(grep -c ' ERROR ' /tmp/log)"
              echo "last lines:"; sed -E 's/https?:[^ ]+/<url>/g; s/"[^"]*"/"<text>"/g; s/[0-9]{6,}/<id>/g' /tmp/log | cut -c1-200 | tail -6
            done
          done
