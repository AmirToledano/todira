name: Set Facebook Page and Instagram keys (manual, values typed only into this form)

# 2026-11-11 (owner: "build a social media manager"; "I'll give you access through GitHub"). Patches todira-bot-secret
# with the keys todira_common/meta_api.py reads: the daily post on Todira's own Page and Instagram
# (scraper/social_poster.py) and the instant answer to "דירה" comments (website /meta/webhook).
#
# Where each value comes from (Meta for Developers, the app connected to the Todira Page):
#   page_id         the Page's id (Page settings, or Graph API Explorer: me/accounts)
#   page_token      a long-lived Page access token with pages_manage_posts, pages_read_engagement,
#                   pages_manage_engagement, instagram_basic, instagram_content_publish, instagram_manage_comments
#   ig_user_id      the Instagram professional account's id (Graph API Explorer: {page-id}?fields=instagram_business_account)
#   app_secret      App settings, Basic, App secret (checks that webhook calls really come from Meta)
#   verify_token    any long random text you choose; type the same text in the app's Webhooks settings
# Run it from the GitHub Actions UI (Actions, this workflow, "Run workflow"), typing values straight into the form
# fields there, never pasted into a chat. Every value is masked from the run's logs before anything else touches it.
# Leave a field blank to keep what is there.
on:
  workflow_dispatch:
    inputs:
      page_id:
        description: "Facebook Page id (blank to keep)"
        required: false
        type: string
      page_token:
        description: "Long-lived Page access token (blank to keep)"
        required: false
        type: string
      ig_user_id:
        description: "Instagram professional account id (blank to keep)"
        required: false
        type: string
      app_secret:
        description: "Meta app secret (blank to keep)"
        required: false
        type: string
      verify_token:
        description: "Webhook verify token, any text you choose (blank to keep)"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask every provided value from this run's own logs
        run: |
          for field in page_id page_token ig_user_id app_secret verify_token; do
            value=$(jq -r --arg f "$field" '.inputs[$f] // ""' "$GITHUB_EVENT_PATH")
            [ -n "$value" ] && echo "::add-mask::$value"
          done
          true

      - name: Patch only the keys that were actually provided
        run: |
          PATCH='{"data":{}}'
          add_key() {
            key="$1"; field="$2"
            value=$(jq -r --arg f "$field" '.inputs[$f] // ""' "$GITHUB_EVENT_PATH")
            if [ -n "$value" ]; then
              b64=$(printf '%s' "$value" | base64 | tr -d '\n')
              PATCH=$(printf '%s' "$PATCH" | jq --arg k "$key" --arg v "$b64" '.data[$k] = $v')
            fi
          }
          add_key "meta-page-id" page_id
          add_key "meta-page-token" page_token
          add_key "meta-ig-user-id" ig_user_id
          add_key "meta-app-secret" app_secret
          add_key "meta-verify-token" verify_token
          if [ "$(printf '%s' "$PATCH" | jq -c '.data')" = "{}" ]; then
            echo "No values provided - nothing to patch."
            exit 1
          fi
          kubectl patch secret todira-bot-secret -n todira --type merge -p "$PATCH"
          echo "Patched todira-bot-secret: $(printf '%s' "$PATCH" | jq -r '.data | keys | join(", ")')"

      - name: Restart the website so it reads the new keys (the scraper's next run reads them on its own)
        run: |
          kubectl rollout restart deployment todira-website -n todira
          kubectl rollout status deployment todira-website -n todira --timeout=180s

      - name: Check the Page token works (prints the Page's name only)
        run: |
          ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.meta-page-id}' | base64 -d 2>/dev/null || true)
          TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.meta-page-token}' | base64 -d 2>/dev/null || true)
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          if [ -z "$ID" ] || [ -z "$TOKEN" ]; then echo "Page id or token not set yet."; exit 0; fi
          curl -sS "https://graph.facebook.com/v23.0/$ID?fields=name,instagram_business_account" \
            -H "Authorization: Bearer $TOKEN" | jq '{name: .name, instagram_linked: (.instagram_business_account != null), error: .error.message}'
