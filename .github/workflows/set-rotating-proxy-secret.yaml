name: Set rotating proxy pool secret (manual, value typed only into this form)

# Patches the rotating-proxy-url key on todira-bot-secret. scraper-cronjob.yaml passes it to the
# scraper as ROTATING_PROXY_URL, which scraper/utils/stealth_http.py's StealthHTTPClient reads:
# one proxy URL or several separated by commas or spaces, e.g.
#   http://user:pass@host1:port,http://user:pass@host2:port
# Each retry after a 403/429 or network error uses a different proxy from the pool.
#
# Run it from the GitHub Actions UI (Actions tab, this workflow, "Run workflow") and type the value
# straight into the form, never into a chat or a committed file. The value is masked in this run's
# logs before anything else touches it. Leave the field blank to change nothing.
#
# No restart needed: the scraper is a CronJob, so its next run starts a fresh pod that reads the
# patched secret.
on:
  workflow_dispatch:
    inputs:
      proxies:
        description: "Proxy URLs, separated by commas or spaces - leave blank to skip"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask the value and every proxy in it, then patch the secret
        # Reads the raw value from $GITHUB_EVENT_PATH via jq (not ${{ inputs.x }} in the script text or
        # an env: block), so nothing is printed before the masks are registered.
        run: |
          PROXIES=$(jq -r '.inputs.proxies // ""' "$GITHUB_EVENT_PATH")
          if [ -z "$PROXIES" ]; then
            echo "No value provided - nothing to patch."
            exit 0
          fi
          echo "::add-mask::$PROXIES"
          for p in $(printf '%s' "$PROXIES" | tr ',' ' '); do
            echo "::add-mask::$p"
          done

          b64=$(printf '%s' "$PROXIES" | base64 | tr -d '\n')
          PATCH=$(jq -n --arg v "$b64" '{"data":{"rotating-proxy-url":$v}}')
          kubectl patch secret todira-bot-secret -n todira --type merge -p "$PATCH"
          COUNT=$(printf '%s' "$PROXIES" | tr ',' ' ' | wc -w)
          echo "Patched rotating-proxy-url with $COUNT proxy URL(s). The scraper's next run picks it up."
