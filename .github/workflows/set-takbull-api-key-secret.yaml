name: Set Takbull recurring-billing API key/secret (manual, values typed only into this form)

# Patches todira-bot-secret's takbull-api-key/takbull-api-secret keys — the values
# website-deployment.yaml wires into TAKBULL_API_KEY/TAKBULL_API_SECRET
# (website/takbull_client.py's recurring_api_configured() gate for the real DealType=4 recurring
# subscription API, as opposed to the old ₪0/month manual hosted-page flow).
#
# Real trigger, 2026-09-21: diagnose-takbull-recurring-config-status.yaml confirmed LIVE that these
# two secrets were never actually set anywhere (not in the GitHub Actions repo secrets ci-cd.yaml
# deploys with, not in the live k8s secret, not on the running website pod's own env) — meaning
# /upgrade has been running the OLD manual/click-trust flow the whole time, never the new recurring
# API this session built. Get the real values from app.takbull.co.il -> API settings (same place the
# Takbull_API_Documentation.pdf's own auth example headers come from: API_Key/API_Secret).
#
# Same reasoning and mechanics as set-bright-data-api-key-secret.yaml/set-whatsapp-secret.yaml (masks
# each provided value from this run's own logs before anything else touches it) — run this directly
# from the GitHub Actions UI (Actions tab -> this workflow -> "Run workflow"), typing values straight
# into the form fields there, never pasted into a chat/AI session.
#
# UNLIKE the Bright Data version: the website runs as a long-lived Deployment, not a CronJob, so an
# already-running pod does NOT pick up a patched secret's new values on its own — this workflow also
# does `kubectl rollout restart` on the website Deployment so the new keys take effect immediately,
# without waiting for the next unrelated deploy.
#
# IMPORTANT — this alone does not "go live" with real charges: also requires the owner's Takbull
# account to actually have the API-key module ("מוסף סליקת אשראי") enabled (see
# website/takbull_client.py's own module docstring) — this workflow only wires whatever key/secret
# is typed in, it can't confirm Takbull's own account-side permissions.
on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "Takbull API_Key (from app.takbull.co.il -> API settings) - leave blank to skip"
        required: false
        type: string
      api_secret:
        description: "Takbull API_Secret (from app.takbull.co.il -> API settings) - leave blank to skip"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask every provided value from this run's own logs
        # Same ordering reasoning as set-bright-data-api-key-secret.yaml's own step: reads raw
        # values from $GITHUB_EVENT_PATH via jq (not an `env:` block or ${{ inputs.x }} interpolated
        # into the script text) so nothing is echoed unmasked before the mask is registered.
        run: |
          API_KEY=$(jq -r '.inputs.api_key // ""' "$GITHUB_EVENT_PATH")
          API_SECRET=$(jq -r '.inputs.api_secret // ""' "$GITHUB_EVENT_PATH")
          [ -n "$API_KEY" ] && echo "::add-mask::$API_KEY"
          [ -n "$API_SECRET" ] && echo "::add-mask::$API_SECRET"
          true

      - name: Patch only the keys that were actually provided
        env:
          API_KEY: ${{ inputs.api_key }}
          API_SECRET: ${{ inputs.api_secret }}
        run: |
          PATCH='{"data":{}}'
          add_key() {
            key="$1"; value="$2"
            if [ -n "$value" ]; then
              b64=$(printf '%s' "$value" | base64 | tr -d '\n')
              PATCH=$(printf '%s' "$PATCH" | jq --arg k "$key" --arg v "$b64" '.data[$k] = $v')
            fi
          }
          add_key "takbull-api-key" "$API_KEY"
          add_key "takbull-api-secret" "$API_SECRET"

          if [ "$(printf '%s' "$PATCH" | jq -c '.data')" = "{}" ]; then
            echo "No values provided - nothing to patch."
            exit 1
          fi

          kubectl patch secret todira-bot-secret -n todira --type merge -p "$PATCH"
          echo "Patched todira-bot-secret."

      - name: Restart the website Deployment so the running pod picks up the new values
        # A Deployment's already-running pod does NOT re-read a patched Secret's values on its own
        # (unlike the scraper's CronJob, where the NEXT run just picks them up fresh) — this forces
        # a fresh rollout so the new keys take effect now instead of waiting for the next unrelated
        # code deploy.
        run: |
          kubectl rollout restart deployment todira-website -n todira
          kubectl rollout status deployment todira-website -n todira --timeout=120s
          echo "Website restarted with the new Takbull recurring API credentials wired in."
