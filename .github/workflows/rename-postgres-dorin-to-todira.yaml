name: Admin — rename live Postgres role/db dorin -> todira

# ONE-OFF, manual-only (workflow_dispatch, never on push) — added 2026-09-21.
#
# Renames the production Postgres role and database from the leftover "dorin" name (the original
# reference-competitor codename, see the 2026-09-21 Dorin-removal PR #362) to "todira". Everything
# that isn't the live DB objects themselves was already renamed in PR #362 — charts/todira/
# values.yaml's postgres.user/dbname were deliberately left untouched there because renaming those
# values alone, without first renaming the real role/database on the persistent volume, would break
# DATABASE_URL on the next deploy. This workflow does that missing piece, live, before
# values.yaml is updated in a follow-up PR.
#
# Owner explicitly approved doing this now ("לא באמת אכפת לי כי אף אחד לא משתמש בבוט כרגע" — nobody
# is using the bot right now, a brief connection interruption during the rename is acceptable).
#
# Order matters: this MUST run and succeed BEFORE charts/todira/values.yaml's postgres.user/dbname
# are changed to "todira" and deployed — otherwise the next deploy's DATABASE_URL would point at a
# role/database that doesn't exist yet.
#
# ALTER DATABASE requires no other active session connected to that database, so this first
# terminates every other backend connected to "dorin" (bot/website/scraper/backup connections) —
# they reconnect on their own next query/health check, same as any brief DB restart, and the owner
# confirmed that's fine right now.
on:
  workflow_dispatch: {}

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Rename role + database, then verify
        run: |
          kubectl delete pod admin-rename-dorin -n todira --ignore-not-found --wait=true
          cat <<'PODYAML' | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: admin-rename-dorin
          spec:
            restartPolicy: Never
            containers:
              - name: admin-rename-dorin
                image: postgres:16-alpine
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -e
                    # 2026-09-21 run #1 already renamed the DATABASE (dorin -> todira) but the ROLE
                    # rename failed with "session user cannot be renamed" — Postgres refuses to let
                    # a role rename itself, even as superuser, no matter which database it's
                    # connected to. Since POSTGRES_USER=dorin was the only role ever created (the
                    # official postgres image creates exactly one bootstrap superuser, named after
                    # POSTGRES_USER — there's no separate "postgres" superuser role here to use
                    # instead), the fix is to have "dorin" create a THROWAWAY second superuser,
                    # reconnect as that one, do the rename from there, then drop the throwaway role
                    # (itself from a third connection, as the now-renamed "todira" role — you can't
                    # drop your own session role either, same restriction).
                    #
                    # The secret's DATABASE_URL still says dbname=dorin (stale — the secret hasn't
                    # been redeployed since run #1 renamed the actual database), so every connection
                    # below targets "todira" explicitly instead.
                    CONN="postgresql://${DATABASE_URL#*://}"
                    TODIRA_CONN=$(echo "$CONN" | sed -E 's#^(.*)/[^/?]+(\??.*)$#\1/todira\2#')

                    echo "--- confirm current state: connect as dorin to the already-renamed todira database ---"
                    psql "$TODIRA_CONN" -c "SELECT current_database(), current_user;"
                    psql "$TODIRA_CONN" -c "SELECT rolname FROM pg_roles WHERE rolname IN ('dorin', 'todira');"

                    TEMP_PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
                    echo "--- creating a throwaway bootstrap superuser to rename dorin from ---"
                    psql "$TODIRA_CONN" -c "CREATE ROLE rename_bootstrap WITH SUPERUSER LOGIN PASSWORD '${TEMP_PASSWORD}';"

                    BOOTSTRAP_CONN=$(echo "$TODIRA_CONN" | sed -E "s#^postgresql://[^:]+:[^@]+@#postgresql://rename_bootstrap:${TEMP_PASSWORD}@#")

                    echo "--- renaming role dorin -> todira (as the bootstrap role, not as dorin itself) ---"
                    psql "$BOOTSTRAP_CONN" -c "ALTER USER dorin RENAME TO todira;"

                    echo "--- after: databases ---"
                    psql "$BOOTSTRAP_CONN" -c "SELECT datname FROM pg_database WHERE datname NOT LIKE 'template%';"
                    echo "--- after: roles ---"
                    psql "$BOOTSTRAP_CONN" -c "SELECT rolname FROM pg_roles WHERE rolname IN ('todira', 'rename_bootstrap');"

                    echo "--- sanity check: real data still there, reachable with the app's OWN eventual credentials (todira user, same password) ---"
                    FINAL_CONN=$(echo "$TODIRA_CONN" | sed -E 's#^postgresql://[^:]+:#postgresql://todira:#')
                    psql "$FINAL_CONN" -c "SELECT count(*) AS listings_count FROM listings;"
                    psql "$FINAL_CONN" -c "SELECT count(*) AS filters_count FROM filters;"

                    echo "--- cleaning up: drop the throwaway bootstrap role (as todira, not as itself) ---"
                    psql "$FINAL_CONN" -c "DROP ROLE rename_bootstrap;"
                    psql "$FINAL_CONN" -c "SELECT rolname FROM pg_roles WHERE rolname = 'rename_bootstrap';"
          PODYAML
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod admin-rename-dorin -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          echo "--- pod output ---"
          kubectl logs -n todira admin-rename-dorin
          FINAL_PHASE=$(kubectl get pod admin-rename-dorin -n todira -o jsonpath='{.status.phase}')
          kubectl delete pod admin-rename-dorin -n todira --ignore-not-found
          if [ "$FINAL_PHASE" != "Succeeded" ]; then
            echo "Rename pod did not succeed (phase=$FINAL_PHASE) — see log above."
            exit 1
          fi
