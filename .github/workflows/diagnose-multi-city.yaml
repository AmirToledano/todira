name: Diagnose multi-city Yad2 query support

# ONE-OFF, manual-only (workflow_dispatch, never on push) — deliberately NOT part of ci-cd.yaml so
# it can never run automatically on a push and spend real ZenRows credits unintentionally. Runs
# scraper/_diagnose_multi_city.py (see that file's own docstring) against the already-built,
# already-public todira-scraper image. Delete this workflow (and _diagnose_multi_city.py) once the
# multi-city question is answered — see PROJECT_STATE.md.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostic against Yad2 via ZenRows
        run: |
          docker run --rm \
            -e ZENROWS_API_KEY="${{ secrets.ZENROWS_API_KEY }}" \
            ghcr.io/amirtoledano/todira-scraper:latest \
            python -u _diagnose_multi_city.py
