name: Test - send ONE free-form WhatsApp listing message to the owner (only if the 24h window is open)

# ONE-OFF, manual-only (workflow_dispatch) - 2026-10-02. Verifies the zero-cost WhatsApp path end to end:
# runs the REAL scraper image with the REAL cronjob env (cloned from the live todira-scraper CronJob) and
# calls notifier._send_whatsapp_match_message for one real listing, to the OWNER ONLY, and ONLY when the
# owner's 24h window is open (the same _whatsapp_eligible gate production uses) - so it can never trigger
# a paid message. Optionally also sends the "still looking?" check-in buttons (also free-form).
# Never prints a phone number, message id or response body: a success body echoes the recipient and a
# message id (wamid) base64-encodes it, so on success only the HTTP status is logged.
on:
  workflow_dispatch:
    inputs:
      checkin:
        description: "Also send the still-looking check-in buttons"
        required: false
        default: "yes"
        type: choice
        options: ["yes", "no"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Run the free-form send path in a pod cloned from the live scraper CronJob
        run: |
          cat <<'PYEOF' > /tmp/free_send_test.py
          import datetime as dt
          import logging
          import os

          from sqlalchemy import select

          logging.basicConfig(level=logging.INFO)

          import notifier
          import whatsapp_checkin
          from todira_common import whatsapp_client
          from todira_common.db import get_session
          from todira_common.models import Listing, User
          from todira_common.whatsapp_window import window_open

          _orig_post = whatsapp_client._http_client.post


          def _spy_post(url, **kwargs):
              response = _orig_post(url, **kwargs)
              endpoint = url.rsplit("/", 1)[-1]
              if response.status_code >= 400:
                  print("META", endpoint, response.status_code, response.text)
              else:
                  print("META", endpoint, response.status_code, "ok")
              return response


          whatsapp_client._http_client.post = _spy_post

          with get_session() as session:
              owner_tg_id = int(os.environ["OWNER_TELEGRAM_USER_ID"])
              user = session.scalars(select(User).where(User.telegram_user_id == owner_tg_id)).first()
              if user is None:
                  raise SystemExit("RESULT: owner user row not found")
              now = dt.datetime.now(dt.timezone.utc)
              last = user.whatsapp_last_inbound_at
              print("owner linked number:", bool(user.whatsapp_phone_number))
              print("owner opted in:", bool(user.whatsapp_notifications_opted_in))
              print("last inbound:", None if last is None else f"{(now - last).total_seconds() / 3600:.1f}h ago")
              print("window_open:", window_open(last))
              print("_whatsapp_eligible:", notifier._whatsapp_eligible(user))
              if not notifier._whatsapp_eligible(user):
                  raise SystemExit(
                      "RESULT: window closed / not eligible - NOT sending (anything sent now could be billed). "
                      "Send any message to the bot on WhatsApp, then run this again."
                  )

              listing = session.scalars(
                  select(Listing)
                  .where(Listing.is_delisted.is_(False))
                  .where(Listing.duplicate_of_id.is_(None))
                  .where(Listing.description.isnot(None))
                  .where(Listing.deal_type == "rent")
                  .where(Listing.image_urls != [])
                  .order_by(Listing.first_seen_at.desc())
                  .limit(1)
              ).first()
              if listing is None:
                  raise SystemExit("RESULT: no suitable real listing found")
              print(f"using REAL listing id={listing.id} city={listing.city!r}")
              print("match message send returned:", notifier._send_whatsapp_match_message(user, listing))
              if os.environ.get("CHECKIN") == "yes":
                  print("check-in send returned:", whatsapp_checkin.send_checkin(user))
          PYEOF

          kubectl get cronjob todira-scraper -n todira -o json > /tmp/cronjob.json
          python3 - <<'PYEOF'
          import json

          cron = json.load(open("/tmp/cronjob.json"))
          pod_spec = cron["spec"]["jobTemplate"]["spec"]["template"]["spec"]
          container = pod_spec["containers"][0]
          container["name"] = "free-send-test"
          container["command"] = ["python", "-u", "-c", open("/tmp/free_send_test.py").read()]
          container.setdefault("env", []).append({"name": "CHECKIN", "value": "${{ inputs.checkin }}"})
          container.pop("args", None)
          pod_spec["restartPolicy"] = "Never"
          pod = {
              "apiVersion": "v1",
              "kind": "Pod",
              "metadata": {"name": "test-free-wa-send", "namespace": "todira"},
              "spec": pod_spec,
          }
          json.dump(pod, open("/tmp/pod.json", "w"))
          PYEOF

          kubectl delete pod test-free-wa-send -n todira --ignore-not-found --wait=true
          kubectl apply -f /tmp/pod.json
          for i in $(seq 1 60); do
            PHASE=$(kubectl get pod test-free-wa-send -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- pod logs ---"
          kubectl logs -n todira test-free-wa-send || true
          kubectl delete pod test-free-wa-send -n todira --ignore-not-found

      - name: Meta's delivery statuses for those sends, as logged by the website webhook
        run: |
          sleep 40
          POD=$(kubectl get pods -n todira -l app=todira-website -o jsonpath='{.items[0].metadata.name}')
          kubectl logs -n todira "$POD" --since=5m 2>&1 | grep "WhatsApp delivery" || echo "no delivery status lines yet"
