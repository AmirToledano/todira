name: Diagnose — does Facebook's lightweight mbasic/mobile view expose more group posts + real pagination? (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push). 2026-09-21.
#
# diagnose-facebook-group-page-structure.yaml (run twice) found the full desktop Comet UI landing
# page only ever server-renders ONE real post id — the rest of the feed loads via client-side
# GraphQL calls this project hasn't diagnosed. Facebook has historically also served a much lighter,
# server-rendered-only HTML view at mbasic.facebook.com (and a middle-ground m.facebook.com) that
# predates the heavy Comet/React app and often DOES paginate with plain "See More Posts"-style <a
# href> links, no JS required — this tests whether that's still true for a Group's own feed, using
# the SAME stored session cookie (never guessed — if the cookie doesn't carry over cleanly to that
# subdomain this will show a login wall instead, which itself is a real, useful answer).
on:
  workflow_dispatch:
    inputs:
      group_id:
        description: 'Facebook numeric group id (default: the already-confirmed פשפשוק group)'
        required: false
        type: string
        default: '1665476640352771'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Fetch the group via mbasic.facebook.com, using the stored cookie
        env:
          GROUP_ID: ${{ inputs.group_id }}
        run: |
          COOKIE=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.facebook-cookies}' | base64 -d)
          echo "::add-mask::$COOKIE"
          if [ -z "$COOKIE" ]; then
            echo "facebook-cookies is empty in todira-bot-secret — nothing to test with."
            exit 1
          fi

          for HOST in mbasic.facebook.com m.facebook.com; do
            URL="https://${HOST}/groups/${GROUP_ID}/"
            echo "=== Fetching $URL ==="
            STATUS=$(curl -sS --compressed -L --max-redirs 5 \
              -D "/tmp/fb_${HOST}_headers.txt" \
              -o "/tmp/fb_${HOST}_body.html" \
              -w "%{http_code}" \
              --max-time 30 \
              -H "Cookie: $COOKIE" \
              -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
              -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
              -H "Upgrade-Insecure-Requests: 1" \
              "$URL") || STATUS="curl_failed"
            echo "http_status=$STATUS size_bytes=$(wc -c < "/tmp/fb_${HOST}_body.html" 2>/dev/null || echo 0)"
            echo "$STATUS" > "/tmp/fb_${HOST}_status.txt"
          done

      - name: Analyze both saved pages
        run: |
          python3 -c "
          import re

          SEP = '=' * 10
          for host in ('mbasic.facebook.com', 'm.facebook.com'):
              print(f'{SEP} {host} {SEP}')
              try:
                  with open(f'/tmp/fb_{host}_body.html', encoding='utf-8', errors='replace') as f:
                      html = f.read()
              except FileNotFoundError:
                  print('(no body saved)')
                  continue
              with open(f'/tmp/fb_{host}_status.txt') as f:
                  status = f.read().strip()
              print(f'status={status} length={len(html)}')

              title_match = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
              print(f'Title: {title_match.group(1).strip() if title_match else \"(none)\"}')

              lower = html.lower()
              login_signals = [s for s in ('log in to facebook', 'loginform', 'checkpoint', 'login.php') if s in lower]
              print(f'Login/checkpoint signals: {login_signals or \"none\"}')

              post_ids = sorted(set(re.findall(r'/groups/\d+/(?:permalink|posts)/(\d+)', html)))
              print(f'Distinct post ids found: {len(post_ids)}')
              if post_ids:
                  print(f'  ids: {post_ids[:10]}')

              # mbasic/mobile-legacy pagination markers — real, well-known link text/params from
              # that era, checked generically rather than assumed present.
              more_links = re.findall(r'href=\"([^\"]*(?:more_stories|cursor|next_max_id|refid=27)[^\"]*)\"', html, re.I)
              print(f'Possible \"load more/pagination\" links found: {len(more_links)}')
              for link in more_links[:5]:
                  print(f'  {link[:200]}')
              print()
          "

      - name: Dump raw body if either fetch was non-200 (generic error/wall page, safe to print)
        run: |
          for HOST in mbasic.facebook.com m.facebook.com; do
            STATUS=$(cat "/tmp/fb_${HOST}_status.txt" 2>/dev/null || echo "")
            if [ "$STATUS" != "200" ]; then
              echo "=== Raw body for $HOST (status=$STATUS) ==="
              head -c 3000 "/tmp/fb_${HOST}_body.html" 2>/dev/null || true
              echo
            fi
          done
