name: Diagnose — memory per pod and process (read-only)

# 2026-10-14 owner request: the server (t3.small, 2 GB) runs out of memory during scraper runs and swaps. Before shrinking anything
# or paying for a bigger server: real numbers for who holds the memory, both at rest and through a scraper run.
# Read-only - prints only sizes, process NAMES (never their command lines, which can carry secrets), pod names and counts.
on:
  workflow_dispatch:
    inputs:
      watch_scraper_minutes:
        description: "Also sample every 20 s while a scraper run is in progress, for up to this many minutes (0 = snapshot only)"
        required: false
        default: "0"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Cluster add-ons that hold memory
        run: |
          kubectl get pods -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,STATUS:.status.phase' | grep -v Completed

      - name: Memory per pod right now (kubelet stats)
        run: |
          cat > /tmp/summary.py <<'PY'
          import json, sys
          s = json.load(sys.stdin)
          node = s["node"]
          mem = node.get("memory") or {}
          print(f"node: working set {mem.get('workingSetBytes', 0)/2**20:.0f} MiB, available {mem.get('availableBytes', 0)/2**20:.0f} MiB")
          for c in node.get("systemContainers") or []:
              m = c.get("memory") or {}
              print(f"  system container {c['name']:10} working set {m.get('workingSetBytes', 0)/2**20:6.0f} MiB  rss {m.get('rssBytes', 0)/2**20:6.0f} MiB")
          rows = []
          for p in s.get("pods") or []:
              m = p.get("memory") or {}
              rows.append((m.get("workingSetBytes") or 0, m.get("rssBytes") or 0, p["podRef"]["namespace"], p["podRef"]["name"]))
          for ws, rss, ns, name in sorted(rows, reverse=True):
              if ws:
                  print(f"  {ns:12} {name:55} working set {ws/2**20:6.0f} MiB  rss {rss/2**20:6.0f} MiB")
          PY
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          kubectl get --raw "/api/v1/nodes/$NODE/proxy/stats/summary" | python3 /tmp/summary.py

      - name: Memory and swap per process on the node (names only)
        run: |
          kubectl delete pod diag-memory -n todira --ignore-not-found --wait=true
          cat <<'PODYAML' | kubectl apply -n todira -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: diag-memory
          spec:
            hostPID: true
            restartPolicy: Never
            containers:
              - name: diag-memory
                image: alpine:3.20
                resources:
                  limits: { cpu: "100m", memory: "32Mi" }
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    echo '--- /proc/meminfo (host) ---'
                    grep -E '^(MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapTotal|SwapFree|SwapCached|Shmem|Slab|SReclaimable|SUnreclaim|Active\(anon\)|Inactive\(anon\)):' /proc/meminfo
                    echo '--- resident + swapped memory per process name (MiB), largest first ---'
                    for d in /proc/[0-9]*; do
                      [ -r "$d/status" ] || continue
                      awk '/^Name:/{n=$2} /^VmRSS:/{r=$2} /^VmSwap:/{s=$2} END{if (n!="") printf "%s %d %d\n", n, r+0, s+0}' "$d/status" 2>/dev/null
                    done | awk '{r[$1]+=$2; s[$1]+=$3; c[$1]++} END{for (k in r) printf "%-22s procs=%-3d rss=%6.0f swap=%6.0f total=%6.0f\n", k, c[k], r[k]/1024, s[k]/1024, (r[k]+s[k])/1024}' \
                      | sort -t= -k5 -n -r | head -30
          PODYAML
          for i in $(seq 1 60); do
            PHASE=$(kubectl get pod diag-memory -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 2
          done
          kubectl logs -n todira diag-memory || true
          kubectl delete pod diag-memory -n todira --ignore-not-found

      - name: Postgres memory settings
        run: |
          PG=$(kubectl get pods -n todira -l app=todira-postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n todira "$PG" -- sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT name, setting, unit FROM pg_settings WHERE name IN ('"'"'shared_buffers'"'"','"'"'work_mem'"'"','"'"'maintenance_work_mem'"'"','"'"'max_connections'"'"','"'"'effective_cache_size'"'"');"; psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) AS connections FROM pg_stat_activity;"' || true
          echo "--- postgres container memory (cgroup, counts shared memory once) ---"
          kubectl exec -n todira "$PG" -- sh -c 'cat /sys/fs/cgroup/memory.current 2>/dev/null | awk "{printf \"%.0f MiB\\n\", \$1/1048576}"; grep -E "^(anon|file|shmem) " /sys/fs/cgroup/memory.stat 2>/dev/null | awk "{printf \"%s %.0f MiB\\n\", \$1, \$2/1048576}"' || true

      - name: Through a scraper run (optional)
        if: ${{ inputs.watch_scraper_minutes != '0' }}
        env:
          WATCH_MINUTES: ${{ inputs.watch_scraper_minutes }}
        run: |
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          cat > /tmp/sample.py <<'PY'
          import json, sys, time
          s = json.load(sys.stdin)
          mem = s["node"].get("memory") or {}
          parts = [time.strftime("%H:%M:%S", time.gmtime()), f"node_avail={(mem.get('availableBytes') or 0)/2**20:.0f}MiB"]
          for p in s.get("pods") or []:
              name = p["podRef"]["name"]
              ws = (p.get("memory") or {}).get("workingSetBytes") or 0
              if ws and p["podRef"]["namespace"] == "todira":
                  short = name.split("-")[1] if name.startswith("todira-") else name
                  parts.append(f"{short}={ws/2**20:.0f}")
          print("  ".join(parts), flush=True)
          PY
          END=$(( $(date +%s) + WATCH_MINUTES * 60 ))
          SEEN=0
          while [ "$(date +%s)" -lt "$END" ]; do
            RUNNING=$(kubectl get pods -n todira -l app=todira-scraper --field-selector=status.phase=Running -o name 2>/dev/null | wc -l)
            if [ "$RUNNING" -gt 0 ]; then SEEN=1; fi
            if [ "$SEEN" = 1 ] && [ "$RUNNING" = 0 ]; then echo "scraper run finished"; break; fi
            if [ "$SEEN" = 1 ]; then
              kubectl get --raw "/api/v1/nodes/$NODE/proxy/stats/summary" | python3 /tmp/sample.py || true
            fi
            sleep 20
          done
          [ "$SEEN" = 1 ] || echo "no scraper run started in the window"
          SWAP=$(kubectl get pods -n todira -l app=todira-scraper -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.containerStatuses[0].state.terminated.reason}{" "}{.status.containerStatuses[0].lastState.terminated.reason}{"\n"}{end}' | tail -3)
          echo "--- last scraper pods (name, end reason) ---"; echo "$SWAP"
