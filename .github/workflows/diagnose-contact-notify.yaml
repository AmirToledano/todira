name: Diagnose OWNER_TELEGRAM_USER_ID notification

# ONE-OFF, manual-only (workflow_dispatch, never on push). Owner set OWNER_TELEGRAM_USER_ID,
# tested both the website /contact form and the bot's new contact-fallback handler, and got no
# Telegram notification from either. Checks whether the secret is actually wired into the live
# pods (without printing its value) and reads recent pod logs for the actual send attempt/error.
# Delete this workflow once resolved.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Confirm OWNER_TELEGRAM_USER_ID env is wired (names/refs only, never the value)
        run: |
          echo "--- bot deployment env (names + secretKeyRef only) ---"
          kubectl get deployment todira-bot -n todira -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}{"\n"}{end}'
          echo "--- website deployment env (names + secretKeyRef only) ---"
          kubectl get deployment todira-website -n todira -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}{"\n"}{end}'
          echo "--- does the bot-secret Secret object actually HAVE the owner-telegram-user-id key? (key name only, never the value) ---"
          kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data}' | jq -r 'keys[]'
          echo "--- pod restart/age, to see if a deploy actually happened recently ---"
          kubectl get pods -n todira -l app=todira-bot -o custom-columns='NAME:.metadata.name,CREATED:.metadata.creationTimestamp,RESTARTS:.status.containerStatuses[0].restartCount'
          kubectl get pods -n todira -l app=todira-website -o custom-columns='NAME:.metadata.name,CREATED:.metadata.creationTimestamp,RESTARTS:.status.containerStatuses[0].restartCount'

      - name: Recent bot pod logs (last 200 lines)
        run: |
          BOT_POD=$(kubectl get pods -n todira -l app=todira-bot -o jsonpath='{.items[0].metadata.name}')
          echo "pod=$BOT_POD"
          kubectl logs -n todira "$BOT_POD" --tail=200 || true

      - name: Recent website pod logs (last 100 lines)
        run: |
          WEB_POD=$(kubectl get pods -n todira -l app=todira-website -o jsonpath='{.items[0].metadata.name}')
          echo "pod=$WEB_POD"
          kubectl logs -n todira "$WEB_POD" --tail=100 || true
