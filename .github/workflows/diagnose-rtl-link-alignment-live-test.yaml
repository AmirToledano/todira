name: Diagnose — send real labeled test messages to the owner to isolate the RTL link bug

# ONE-OFF, manual-only (workflow_dispatch) — added 2026-09-29. Real owner report, with fresh
# screenshots, that PR #545/#546's RTL fix did NOT close the "message doesn't start from the
# right" bug — if anything it looks worse now, and it reproduces on effectively every listing that
# has a street address link. Every OTHER field line (price/rooms/floor/description) renders
# correctly in the owner's own screenshots; the one thing common to every broken line is that it's
# the location line's <a href="...">street</a> Google Maps link.
#
# Working hypothesis: Telegram's client may render a text_link entity as its own isolated text run
# for bidi purposes, meaning the RLE/PDF embedding characters _force_rtl currently places OUTSIDE
# the <a>...</a> tag (before "<" and after ">") never actually reach the run Telegram bidi-resolves
# for the link's own visible text — so the link renders using Telegram's own default paragraph
# direction detection instead of respecting our embedding. This cannot be confirmed by reading
# code or by unit tests (there is no real Telegram client in this sandbox) — it can only be
# confirmed by looking at how Telegram actually renders it. So: send several small, clearly
# labeled, real messages, each isolating one variable, straight to the owner's own Telegram chat
# with the bot (the exact chat in their screenshots), and ask them which ones look right.
#
# This does NOT touch production code or any cluster state — it only calls Telegram's real
# sendMessage API directly with the real bot token, exactly like a normal bot message.
on:
  workflow_dispatch: {}

jobs:
  send-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token + owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send 6 labeled test messages, each isolating one variable
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)
          RLE=$'‫'
          PDF=$'‬'
          MAPS_URL="https://www.google.com/maps/search/?api=1&query=%D7%90%D7%9C%D7%95%D7%9F+12"

          send() {
            local label="$1"
            local body="$2"
            local text="🧪 ${label}
${body}"
            curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${OWNER_ID}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
            cat /tmp/resp.json
            echo ""
          }

          echo "=== test 1: baseline plain text, no link (should already look correct) ==="
          send "בדיקה 1 — טקסט רגיל, בלי לינק (בייסליין):" \
            "${RLE}מחיר: 4,150₪${PDF}"

          echo "=== test 2: EXACT current production construction (RLE outside the <a> tag) ==="
          send "בדיקה 2 — בדיוק כמו בפרודקשן עכשיו (RLE מחוץ לתג):" \
            "${RLE}<a href=\"${MAPS_URL}\">אלון 12</a>${PDF}"

          echo "=== test 3: hypothesis fix — RLE/PDF INSIDE the <a> tag, around the visible text only ==="
          send "בדיקה 3 — השערת תיקון: RLE בתוך התג, סביב הטקסט הגלוי בלבד:" \
            "<a href=\"${MAPS_URL}\">${RLE}אלון 12${PDF}</a>"

          echo "=== test 4: same street text but NOT a link at all ==="
          send "בדיקה 4 — אותו טקסט בדיוק, בלי לינק בכלל:" \
            "${RLE}אלון 12${PDF}"

          echo "=== test 5: city+street link combined on one line, not split (matches pre-PR#546 code shape) ==="
          send "בדיקה 5 — עיר+רחוב כלינק, הכל בשורה אחת (לא מפוצל):" \
            "${RLE}עדי - עדי <a href=\"${MAPS_URL}\">אלון 12</a>${PDF}"

          echo "=== test 6: city+street, each VISIBLE piece individually RLE-wrapped ==="
          send "בדיקה 6 — עיר+רחוב, כל חלק גלוי עטוף בנפרד:" \
            "${RLE}עדי - עדי${PDF} <a href=\"${MAPS_URL}\">${RLE}אלון 12${PDF}</a>"

          echo "=== done — ask the owner which numbered messages look right-aligned vs broken ==="
