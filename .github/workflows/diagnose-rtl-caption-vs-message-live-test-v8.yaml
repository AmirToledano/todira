name: Diagnose - v8, does a real sendPhoto CAPTION break MORE lines than sendMessage did

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-29. A real, sharp owner question after
# v6/v7's results: every diagnostic so far (v3 through v7) sent a plain TEXT message via Telegram's
# sendMessage - only the physically last line ever broke. But the real bot never sends a plain text
# message for a listing - every real card is a PHOTO with a CAPTION (bot.send_photo(...,
# caption=...) in cards.py's send_listing_card), and the owner's original screenshots showed MANY
# lines broken at once, not just the last one. That's a real, previously untested gap: a caption
# attached to a photo may resolve bidi/line-wrapping completely differently from a standalone text
# message. This sends the EXACT same body as test 9 (no link, 3 fields) as a real send_photo
# caption instead of sendMessage, using the project's own mascot image
# (common/todira_common/assets/dachshunds/todi_detective.jpg, fetched by Telegram itself from this
# public repo's raw.githubusercontent.com URL - this repo is confirmed public), to see whether the
# caption context reproduces "many lines broken" instead of just the last one.
on:
  workflow_dispatch: {}

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send test 13 as a real sendPhoto CAPTION (body base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)
          PHOTO_URL="https://raw.githubusercontent.com/AmirToledano/todira/main/common/todira_common/assets/dachshunds/todi_detective.jpg"

          BODY_B64="4oCr8J+nqiDXkdeT15nXp9eUIDEzIC0g15DXldeq15Ug15TXmNen16HXmCDXm9ee15Ug15HXk9eZ16fXlCA5LCDXkNeR15wg15vXm9eZ16rXldeRINee16rXl9eqINeq157Xldeg15QgKHNlbmRQaG90bynigKwK4oCr8J+Tjdei15PXmSAtINei15PXmeKArArigKvXkNec15XXnyAxMuKArArigKvwn5KwINee15fXmdeoOiA0LDE1MOKCquKArA=="
          BODY=$(echo "$BODY_B64" | base64 -d)

          echo "=== sending test 13 as sendPhoto caption ==="
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "photo=${PHOTO_URL}" \
            --data-urlencode "caption=${BODY}" \
            --data-urlencode "parse_mode=HTML" \
            -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
          cat /tmp/resp.json
          echo ""
          echo "=== done - does this reproduce MANY broken lines, like the real owner screenshots? ==="
