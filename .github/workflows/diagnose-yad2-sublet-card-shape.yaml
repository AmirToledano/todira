name: Diagnose — Yad2 sublet (property=43) card shape vs unfiltered rent, from production's own IP (read-only, one-off pod)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push). 2026-09-16.
#
# Follow-up to diagnose-yad2-sale-sublet-shape.yaml: the owner confirmed live (via his own phone
# browser, bypassing Radware entirely) that:
#   - sale mirrors rent exactly: https://www.yad2.co.il/realestate/forsale/tel-aviv-area
#   - sublet is NOT a separate deal type/URL — it's a "סוג נכס" (property type) checkbox inside the
#     RENT search UI, confirmed live to add ?property=43 to the rent URL:
#     https://www.yad2.co.il/realestate/rent/tel-aviv-area?property=43
#
# That same sale/sublet diagnostic ALSO showed (this same morning) that a plain curl from a GitHub
# Actions runner IP now gets Radware-walled even for the plain rent search page (same "Radware
# Page"/loader-page response for both forsale and rent) — worse than the runner's historical
# reputation, matching the same "GitHub Actions runner IP is worse than production's own IP" finding
# already established for listing-detail pages (see diagnose-yad2-listing-detail-from-production-ip.yaml).
# So this reuses THAT workflow's own pattern (a standalone, throwaway Pod inside the real k8s
# cluster, same egress IP as the production scraper, never touches the actual scraper
# CronJob/Deployment) instead of running from this runner directly.
#
# Open question this diagnostic answers, never guessed: yad2_client.py's own _parse_location
# docstring already says each card's info1 breadcrumb is "<property type>, <neighborhood...>,
# <city>" — property type (parts[0]) is parsed out but currently DISCARDED. If property=43 cards
# already show up in the plain unfiltered rent fetch (just with their own property-type text
# discarded), sublet support might not need a second request at all — just capturing parts[0] and
# checking whether it reads "סאבלט".
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Create a standalone, throwaway diagnostic Pod inside the real cluster
        run: |
          POD_NAME="yad2-sublet-diag-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"

          cat > /tmp/pod.py << 'PYEOF'
          import json, re, urllib.request

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          CARD_RE = re.compile(
              r'data-nagish="feed-item-layout-link" href="([^"]+)"[\s\S]*?'
              r'data-testid="price">([^<]*)</span>[\s\S]*?'
              r'data-testid="street-name">([^<]*)</span>[\s\S]*?'
              r'data-testid="item-info-line-1st">([^<]*)</span>'
          )
          NEXT_DATA_RE = re.compile(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', re.S)

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", errors="replace")

          def parse_cards(html):
              cards = {}
              for href, price, street, info1 in CARD_RE.findall(html):
                  if "/yad1/project/" in href or href.startswith("http"):
                      continue
                  ext_id = href.rstrip("/").split("/")[-1].split("?")[0]
                  parts = [p.strip() for p in info1.split(",") if p.strip()]
                  cards[ext_id] = parts[0] if parts else None
              return cards

          sublet_status, sublet_html = fetch("https://www.yad2.co.il/realestate/rent/tel-aviv-area?property=43")
          unfiltered_status, unfiltered_html = fetch("https://www.yad2.co.il/realestate/rent/tel-aviv-area")

          print(f"=== sublet-filtered (property=43): http_status={sublet_status} size={len(sublet_html)} ===")
          print(f"=== unfiltered: http_status={unfiltered_status} size={len(unfiltered_html)} ===")

          sublet_cards = parse_cards(sublet_html)
          unfiltered_cards = parse_cards(unfiltered_html)
          print(f"sublet-filtered: {len(sublet_cards)} cards parsed")
          print(f"unfiltered: {len(unfiltered_cards)} cards parsed")

          overlap = set(sublet_cards) & set(unfiltered_cards)
          if sublet_cards:
              print(f"overlap: {len(overlap)} of {len(sublet_cards)} sublet cards also appear in the unfiltered fetch")

          print()
          print("--- sample property-type text (parts[0] of info1 breadcrumb) for sublet-filtered cards ---")
          for ext_id, prop_type in list(sublet_cards.items())[:10]:
              print(f"  id={ext_id!r} property_type={prop_type!r} also_in_unfiltered={ext_id in unfiltered_cards}")

          print()
          print("--- does __NEXT_DATA__ carry an explicit property-type id/field? (sublet-filtered page) ---")
          m = NEXT_DATA_RE.search(sublet_html)
          if m:
              try:
                  data = json.loads(m.group(1))
                  queries = data["props"]["pageProps"]["dehydratedState"]["queries"]
                  shown = 0
                  for q in queries:
                      d = q.get("state", {}).get("data")
                      if not isinstance(d, dict):
                          continue
                      for cat in ("private", "agency", "platinum", "booster"):
                          items = d.get(cat)
                          if isinstance(items, list) and items and shown < 2:
                              item = items[0]
                              print(f"  category={cat!r} sample keys: {sorted(item.keys())}")
                              for k in ("property", "propertyGroup", "assetType", "assetSubtype", "subCategory", "propertyType", "category"):
                                  if k in item:
                                      print(f"    {k} = {item[k]!r}")
                              shown += 1
              except Exception as exc:
                  print(f"  could not parse __NEXT_DATA__: {exc}")
          else:
              print("  no __NEXT_DATA__ block found (likely a Radware/blocked page instead of real content)")

          title_m = re.search(r"<title[^>]*>(.*?)</title>", sublet_html, re.S)
          print()
          print(f"sublet page title: {title_m.group(1).strip() if title_m else '?'}")
          PYEOF

          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "/script/pod.py"]
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait for completion, print logs, then clean up (always)
        if: always()
        run: |
          for i in $(seq 1 60); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "poll $i: phase=$PHASE"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then
              break
            fi
            sleep 3
          done
          echo "--- pod logs ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 || echo "(no logs captured)"
          echo "--- cleaning up throwaway pod + configmap ---"
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
