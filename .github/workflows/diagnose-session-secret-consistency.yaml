name: "Diagnose - do the website, bot and scraper sign/verify login links with the SAME secret? (read-only, same/different only)"

# Read-only, manual. The bot/scraper sign website login links (?t= / ?wid=) with SESSION_SECRET_KEY and the website
# verifies them with its own. Prints ONLY whether each workload's value equals the website's (and whether it is the
# insecure dev fallback / unset) - never the secret or any part of it.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Compare
        run: |
          h() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
          envval() { kubectl exec -n todira "$1" -- sh -c 'printf "%s" "$SESSION_SECRET_KEY"' 2>/dev/null; }
          WEB=$(kubectl get pods -n todira -l app=todira-website --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          BOT=$(kubectl get pods -n todira -l app=todira-bot --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          WV=$(envval "$WEB"); BV=$(envval "$BOT")
          DEV=$(h "dev-only-insecure-session-key")
          echo "website pod: $([ -z "$WV" ] && echo 'UNSET (dev fallback)' || { [ "$(h "$WV")" = "$DEV" ] && echo 'dev fallback' || echo 'real secret set'; })"
          echo "bot pod:     $([ -z "$BV" ] && echo 'UNSET (dev fallback)' || { [ "$(h "$BV")" = "$DEV" ] && echo 'dev fallback' || echo 'real secret set'; })"
          [ "$(h "$WV")" = "$(h "$BV")" ] && echo "bot == website: YES" || echo "bot == website: NO"
          SCR=$(kubectl get cronjob todira-scraper -n todira -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name=="SESSION_SECRET_KEY")].name}' 2>/dev/null)
          echo "scraper cronjob has SESSION_SECRET_KEY env: $([ -n "$SCR" ] && echo YES || echo NO)"
