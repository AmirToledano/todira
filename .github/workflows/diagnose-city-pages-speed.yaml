name: Diagnose — why /rent and /calculator are slow on the first visit (read-only)

# 2026-10-31: after the city pages went live, /rent took 16 s and /calculator 8.6 s on the first visit (fast after,
# from the hour's cache). Times each query with EXPLAIN ANALYZE, with and without the parking/storage test, and with that
# test's cheap half first. Also what else the database was doing. No user data, no listing text.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
      - name: Timings
        run: |
          echo "== pods running now (is a scraper run on?)"
          kubectl get pods -n todira --no-headers | awk '{print $1, $3}' | sed -E 's/-[a-z0-9]{5,10}(-[a-z0-9]{5})?$//' | sort | uniq -c
          PG=$(kubectl get pods -n todira -l app=todira-postgres -o jsonpath='{.items[0].metadata.name}')
          cat > /tmp/q.sql <<'SQL'
          \echo '== listings table: rows, size, rows in the 30-day rent window'
          SELECT (SELECT count(*) FROM listings) AS rows, pg_size_pretty(pg_total_relation_size('listings')) AS total,
                 pg_size_pretty(pg_relation_size('listings')) AS heap,
                 (SELECT count(*) FROM listings WHERE listings.deal_type = 'rent' AND listings.duplicate_of_id IS NULL AND listings.price BETWEEN 1000 AND 40000 AND (listings.property_type IS NULL OR listings.property_type != 'shared_room') AND listings.first_seen_at >= now() - interval '30 days' AND listings.city IS NOT NULL) AS rent_window;
          \echo '== indexes on listings'
          SELECT indexname, pg_size_pretty(pg_relation_size(indexname::regclass)) FROM pg_indexes WHERE tablename = 'listings';
          \echo '== other queries running right now'
          SELECT state, count(*), max(now() - query_start) AS longest FROM pg_stat_activity WHERE datname = current_database() GROUP BY state;
          \echo '== A: /rent index as it runs now'
          EXPLAIN (ANALYZE, BUFFERS) SELECT listings.city, count(*), percentile_cont(0.5) WITHIN GROUP (ORDER BY listings.price) FILTER (WHERE listings.rooms BETWEEN 3 AND 3.5) FROM listings WHERE listings.deal_type = 'rent' AND listings.duplicate_of_id IS NULL AND listings.price BETWEEN 1000 AND 40000 AND (listings.property_type IS NULL OR listings.property_type != 'shared_room') AND NOT ((lower(left(regexp_replace(coalesce(listings.description, ''), '^[^א-תa-zA-Z]+', ''), 60)) ~ '^(?:להשכרה|למכירה|להשכיר|משכיר|משכירה|מוכר|מוכרת|השכרת|מכירת|דרוש שוכר ל)?\s*(?:מקום|מקומות)?\s*(?:חניה|חנייה|חניות|חנייות|חנית|חניית)' OR lower(left(regexp_replace(coalesce(listings.description, ''), '^[^א-תa-zA-Z]+', ''), 60)) ~ '^(?:להשכרה|למכירה|להשכיר|משכיר|משכירה|מוכר|מוכרת|השכרת|מכירת|דרוש שוכר ל)?\s*(?:מקום|מקומות)?\s*(?:מחסן|מחסנים)') AND (listings.size_sqm IS NOT NULL AND listings.size_sqm > 0 AND listings.size_sqm < 25 OR listings.price IS NULL OR listings.deal_type = 'sale' AND listings.price < 800000 OR listings.deal_type != 'sale' AND listings.price < 2000)) AND listings.first_seen_at >= now() - interval '30 days' AND listings.city IS NOT NULL GROUP BY listings.city HAVING count(*) >= 30 ORDER BY count(*) DESC LIMIT 40;
          \echo '== B: same, cheap half of the test first'
          EXPLAIN (ANALYZE, BUFFERS) SELECT listings.city, count(*), percentile_cont(0.5) WITHIN GROUP (ORDER BY listings.price) FILTER (WHERE listings.rooms BETWEEN 3 AND 3.5) FROM listings WHERE listings.deal_type = 'rent' AND listings.duplicate_of_id IS NULL AND listings.price BETWEEN 1000 AND 40000 AND (listings.property_type IS NULL OR listings.property_type != 'shared_room') AND NOT ((listings.size_sqm IS NOT NULL AND listings.size_sqm > 0 AND listings.size_sqm < 25 OR listings.price IS NULL OR listings.deal_type = 'sale' AND listings.price < 800000 OR listings.deal_type != 'sale' AND listings.price < 2000) AND (lower(left(regexp_replace(coalesce(listings.description, ''), '^[^א-תa-zA-Z]+', ''), 60)) ~ '^(?:להשכרה|למכירה|להשכיר|משכיר|משכירה|מוכר|מוכרת|השכרת|מכירת|דרוש שוכר ל)?\s*(?:מקום|מקומות)?\s*(?:חניה|חנייה|חניות|חנייות|חנית|חניית)' OR lower(left(regexp_replace(coalesce(listings.description, ''), '^[^א-תa-zA-Z]+', ''), 60)) ~ '^(?:להשכרה|למכירה|להשכיר|משכיר|משכירה|מוכר|מוכרת|השכרת|מכירת|דרוש שוכר ל)?\s*(?:מקום|מקומות)?\s*(?:מחסן|מחסנים)')) AND listings.first_seen_at >= now() - interval '30 days' AND listings.city IS NOT NULL GROUP BY listings.city HAVING count(*) >= 30 ORDER BY count(*) DESC LIMIT 40;
          \echo '== C: same, no parking/storage test'
          EXPLAIN (ANALYZE, BUFFERS) SELECT listings.city, count(*), percentile_cont(0.5) WITHIN GROUP (ORDER BY listings.price) FILTER (WHERE listings.rooms BETWEEN 3 AND 3.5) FROM listings WHERE listings.deal_type = 'rent' AND listings.duplicate_of_id IS NULL AND listings.price BETWEEN 1000 AND 40000 AND (listings.property_type IS NULL OR listings.property_type != 'shared_room') AND listings.first_seen_at >= now() - interval '30 days' AND listings.city IS NOT NULL GROUP BY listings.city HAVING count(*) >= 30 ORDER BY count(*) DESC LIMIT 40;
          \echo '== D: /calculator medians'
          EXPLAIN (ANALYZE, BUFFERS) SELECT listings.city, CASE WHEN listings.rooms >= 5 THEN 5 ELSE floor(listings.rooms) END AS b,
                 percentile_cont(0.5) WITHIN GROUP (ORDER BY listings.price), count(*) FROM listings
          WHERE listings.deal_type = 'rent' AND listings.duplicate_of_id IS NULL AND listings.price BETWEEN 1000 AND 40000 AND (listings.property_type IS NULL OR listings.property_type != 'shared_room') AND listings.city IS NOT NULL AND listings.rooms BETWEEN 1 AND 12
                AND listings.scraped_at >= now() - interval '30 days' GROUP BY listings.city, b;
          \echo '== A again (warm)'
          EXPLAIN (ANALYZE, BUFFERS) SELECT listings.city, count(*), percentile_cont(0.5) WITHIN GROUP (ORDER BY listings.price) FILTER (WHERE listings.rooms BETWEEN 3 AND 3.5) FROM listings WHERE listings.deal_type = 'rent' AND listings.duplicate_of_id IS NULL AND listings.price BETWEEN 1000 AND 40000 AND (listings.property_type IS NULL OR listings.property_type != 'shared_room') AND NOT ((lower(left(regexp_replace(coalesce(listings.description, ''), '^[^א-תa-zA-Z]+', ''), 60)) ~ '^(?:להשכרה|למכירה|להשכיר|משכיר|משכירה|מוכר|מוכרת|השכרת|מכירת|דרוש שוכר ל)?\s*(?:מקום|מקומות)?\s*(?:חניה|חנייה|חניות|חנייות|חנית|חניית)' OR lower(left(regexp_replace(coalesce(listings.description, ''), '^[^א-תa-zA-Z]+', ''), 60)) ~ '^(?:להשכרה|למכירה|להשכיר|משכיר|משכירה|מוכר|מוכרת|השכרת|מכירת|דרוש שוכר ל)?\s*(?:מקום|מקומות)?\s*(?:מחסן|מחסנים)') AND (listings.size_sqm IS NOT NULL AND listings.size_sqm > 0 AND listings.size_sqm < 25 OR listings.price IS NULL OR listings.deal_type = 'sale' AND listings.price < 800000 OR listings.deal_type != 'sale' AND listings.price < 2000)) AND listings.first_seen_at >= now() - interval '30 days' AND listings.city IS NOT NULL GROUP BY listings.city HAVING count(*) >= 30 ORDER BY count(*) DESC LIMIT 40;
          SQL
          kubectl exec -i -n todira "$PG" -- sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=0 -P pager=off -f -' < /tmp/q.sql
