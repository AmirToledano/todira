name: Check — Apple Pay domain verification file is live (read-only)

# 2026-10-16: Apple fetches /.well-known/apple-developer-merchantid-domain-association from todira.app before Apple Pay
# can be turned on in Takbull. Fetches it from outside, the way Apple does (HTTPS, no redirects followed), and compares
# it with the file in the repo. Public file, no secrets used or printed.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch it the way Apple does
        run: |
          URL=https://todira.app/.well-known/apple-developer-merchantid-domain-association
          curl -sS -o /tmp/live -D /tmp/headers --max-time 20 -w "http_status=%{http_code} redirects=%{num_redirects} content_type=%{content_type}\n" "$URL"
          head -1 /tmp/headers
          if cmp -s /tmp/live website/apple-pay/apple-developer-merchantid-domain-association; then
            echo "identical to the file in the repo"
          else
            echo "DIFFERENT from the file in the repo"; exit 1
          fi

  who-fetched-it:
    # Did anyone (Takbull, Apple) actually fetch the file when the owner pressed "verify domain"? Time and status only:
    # the client address is cut off, never printed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Requests for the file in the last 3 hours (time, method, status)
        run: |
          HITS=$(kubectl logs -n todira deploy/todira-website --since=3h --timestamps 2>/dev/null \
            | grep 'apple-developer-merchantid-domain-association' \
            | sed -E 's/^([^ ]+) .*"([A-Z]+) [^"]*" ([0-9]{3}).*/\1 \2 \3/' || true)
          echo "requests: $(echo -n "$HITS" | grep -c . || true)"
          echo "$HITS"
