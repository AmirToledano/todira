name: Resume scraper (unsuspend) + trigger one manual 1-city test run

# ONE-OFF, manual-only (workflow_dispatch, never on push) — 2026-09-01/09-02. First attempt
# (run 33535579017) created a manual Job but the container crashed almost immediately and, with
# backoffLimit=0, the Job controller killed+deleted the pod within ~2 minutes — the original
# `kubectl wait --for=condition=complete` (with a `--for=condition=failed` OR fallback) waited the
# full 480s regardless, because it waits for "complete" specifically first and only falls through
# to checking "failed" after ITS OWN timeout expires — so by the time logs were read, the pod was
# long gone. Second attempt (run 33541733115, new Fetch API architecture) fixed that, but hit a
# NEW race: `kubectl logs -f` was started the instant the pod NAME existed, before the container
# had actually left ContainerCreating — `kubectl logs -f` doesn't wait/retry on that error, it
# just prints it and exits immediately, so the real output was still missed. This version retries
# starting the follow-tail in a loop (every 1s) until it actually succeeds, instead of a single
# blind attempt or a fixed sleep (a fixed sleep would just be guessing how long is enough) — so
# it's captured however early or late the container actually starts. Polls job status directly
# for either terminal condition instead of waiting on the wrong one first. The CronJob is already
# unsuspended from earlier attempts; this re-applies that (idempotent) and creates a fresh manual
# Job. Delete this workflow once a real result (success or a real captured crash reason) is in
# hand.
on:
  workflow_dispatch: {}

jobs:
  resume-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Un-suspend the CronJob (idempotent)
        run: |
          kubectl patch cronjob todira-scraper -n todira -p '{"spec":{"suspend":false}}'
          kubectl get cronjob todira-scraper -n todira -o jsonpath='{.spec.schedule} suspend={.spec.suspend}{"\n"}'

      - name: Create one manual Job from the current CronJob template, right now
        run: |
          JOB_NAME="todira-scraper-manual-test-$(date +%s)"
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"
          kubectl create job --from=cronjob/todira-scraper -n todira "$JOB_NAME"

      - name: Wait for the pod to exist, then retry-tail its logs in the background until it works
        run: |
          for i in $(seq 1 30); do
            POD=$(kubectl get pods -n todira -l job-name="$JOB_NAME" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            [ -n "$POD" ] && break
            sleep 1
          done
          echo "POD=$POD" >> "$GITHUB_ENV"
          echo "pod=$POD"
          if [ -n "$POD" ]; then
            # kubectl logs -f errors immediately (doesn't wait/retry) if the container is still
            # ContainerCreating — retry starting the tail every 1s for up to 60s, instead of one
            # blind attempt or a fixed sleep guessing how long is enough. >> (append) so an early
            # failed attempt's one-line error and the real captured output both survive.
            nohup bash -c '
              for i in $(seq 1 60); do
                kubectl logs -n todira "'"$POD"'" --timestamps -f >> /tmp/pod.log 2>&1 && break
                sleep 1
              done
            ' > /tmp/tail_wrapper.log 2>&1 &
            echo "log_tail_pid=$!" >> "$GITHUB_ENV"
          fi

      - name: Poll the Job's own status until it reaches a real terminal condition (max 5 min)
        run: |
          for i in $(seq 1 60); do
            STATUS=$(kubectl get job "$JOB_NAME" -n todira -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || echo "")
            echo "poll $i: conditions=[$STATUS]"
            if echo "$STATUS" | grep -qE "Complete|Failed"; then
              echo "Reached terminal condition: $STATUS"
              break
            fi
            sleep 5
          done
          sleep 3
          echo "--- final job status ---"
          kubectl get job "$JOB_NAME" -n todira -o wide
          echo "--- full job describe (events) ---"
          kubectl describe job "$JOB_NAME" -n todira

      - name: Captured pod logs (from the background tail, survives pod deletion)
        run: |
          echo "--- captured logs ---"
          cat /tmp/pod.log 2>/dev/null || echo "(no logs captured — pod never existed or tail never started)"

      - name: Pod describe, if it still exists (exit code / reason / OOM)
        run: |
          kubectl describe pod -n todira "$POD" 2>&1 || echo "(pod already gone)"
