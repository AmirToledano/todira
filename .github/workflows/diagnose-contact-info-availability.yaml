name: Diagnose — is poster contact info (name/phone) already present in fetches we already do? (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-13.
#
# Real owner question: building a real "contact person" section (name + WhatsApp/phone) in a new
# website listing-detail drawer, matching the reference bot's own UX — but does it cost EXTRA fetches, or
# is the contact info already sitting in pages this project already fetches for other reasons
# (Yad2: Bright Data DCA description enrichment; Komo/Homeless: the mandatory per-new-listing
# detail-page fetch)? Checks all three sources' ALREADY-FETCHED pages specifically for name/phone
# markup, before deciding whether this feature needs any new per-listing cost at all.
on:
  workflow_dispatch: {}

jobs:
  yad2-bright-data:
    runs-on: ubuntu-latest
    steps:
      # 2026-09-26: rewritten to route through Bright Data Web Unlocker instead of the DCA
      # collector this job originally used — that collector is a confirmed permanent dead end on
      # this account's trial tier (see common/todira_common/bright_data_client.py's own
      # fetch_listing_description docstring and scraper/yad2_client.py's module docstring for the
      # full story). Same __NEXT_DATA__ page this project's own real, working
      # fetch_listing_detail_via_web_unlocker/fetch_yad2_description_via_web_unlocker already
      # parse — this just dumps the FULL raw record (not just the fields those functions already
      # extract) so every nested object (customer, etc) can be hunted for a real phone/contact
      # field before any new scraping work gets built around an assumption.
      - name: Fetch a real Yad2 listing detail page via Web Unlocker, dump the FULL raw __NEXT_DATA__ record
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
        run: |
          curl -sS -X POST "https://api.brightdata.com/request" \
            -H "Authorization: Bearer ${BRIGHT_DATA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"zone": "web_unlocker1", "url": "https://www.yad2.co.il/realestate/item/center-and-sharon/etfkmgb5", "format": "raw"}' \
            -o /tmp/yad2.html -w "fetch http_status=%{http_code} size=%{size_download}\n" --max-time 90
          echo "--- full raw __NEXT_DATA__ ad record (searching for contact-ish fields) ---"
          python3 - << 'PYEOF'
          import json, re
          with open('/tmp/yad2.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          match = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
          if match is None:
              print("NO __NEXT_DATA__ FOUND — first 2000 chars of response:")
              print(html[:2000])
              raise SystemExit(0)
          next_data = json.loads(match.group(1))
          queries = next_data["props"]["pageProps"]["dehydratedState"]["queries"]
          row = None
          for q in queries:
              data = q.get("state", {}).get("data")
              if isinstance(data, dict) and "token" in data:
                  row = data
                  break
          if row is None:
              print("NO ad-data query found among", len(queries), "queries")
              raise SystemExit(0)
          print("Top-level keys:", list(row.keys()))

          def hunt(obj, path=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      lk = k.lower()
                      if any(h in lk for h in ("phone", "contact", "customer", "agent", "name", "mobile", "tel")):
                          print(f"  MATCH {path}.{k} = {v!r}"[:300])
                      hunt(v, f"{path}.{k}")
              elif isinstance(obj, list):
                  for i, v in enumerate(obj[:3]):
                      hunt(v, f"{path}[{i}]")
          hunt(row)
          print("\n--- full 'customer' object (the field most likely to carry contact info) ---")
          print(json.dumps(row.get("customer"), ensure_ascii=False, indent=2))
          PYEOF

  komo-and-homeless:
    runs-on: ubuntu-latest
    steps:
      - name: Komo detail page — search for phone/agent-name markup in the ALREADY-fetched page
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.komo.co.il/code/nadlan/details/?modaaNum=4471462" \
            -o /tmp/komo.html --max-time 60
          python3 - << 'PYEOF'
          import re
          with open('/tmp/komo.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          flat = re.sub(r'>\s+<', '><', html)
          # phone-number-shaped strings
          phones = re.findall(r'0[\d\-\s]{8,12}\d', flat)
          print(f"phone-shaped strings found: {len(set(phones))}")
          for p in list(set(phones))[:10]:
              print("  ", p)
          # the "mefarsem" (publisher/poster) block already spotted in an earlier diagnostic
          hits = re.findall(r'.{0,80}mefarsem.{0,400}', flat, re.I)
          print(f"\n'mefarsem' (publisher) context hits: {len(hits)}")
          for h in hits[:5]:
              print("  ", h)
          PYEOF

      - name: Homeless detail page — search for phone/agent-name markup in the ALREADY-fetched page
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.homeless.co.il/rent/viewad,746758.aspx" \
            -o /tmp/homeless.html --max-time 60
          python3 - << 'PYEOF'
          import re
          with open('/tmp/homeless.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          flat = re.sub(r'>\s+<', '><', html)
          phones = re.findall(r'0[\d\-\s]{8,12}\d', flat)
          print(f"phone-shaped strings found: {len(set(phones))}")
          for p in list(set(phones))[:10]:
              print("  ", p)
          hits = re.findall(r'.{0,60}(?:מפרסם|בעל הנכס|איש קשר|contact|agent).{0,200}', flat, re.I)
          print(f"\ncontact-label-ish hits: {len(hits)}")
          for h in hits[:8]:
              print("  ", h)
          PYEOF
