name: Diagnose - v10, is the <b> bold tag the real difference from every synthetic test

# ONE-OFF, manual-only (workflow_dispatch) - added 2026-09-29. v9 sent a REAL listing (id=21873)
# through the real production code path (cards.format_caption + cards.send_listing_card) and the
# owner confirmed live it's genuinely broken - price jumps to the wrong side, and there are visible
# jumps between lines. Every earlier synthetic test (v3-v8) rendered correctly, including one sent
# as a real sendPhoto caption with a real link (v13). Comparing the real caption's exact content
# (captured verbatim from v9's own log output, repr()'d) against every synthetic test finds ONE
# systematic difference none of them had: nearly every real line wraps its label in a real <b>...
# </b> HTML tag (📍<b>כפר שמריהו</b>, 💰 <b>מחיר:</b> 15,500, 🛏️ <b>חדרים:</b> 3.5, ...) - no
# synthetic test (v3-v9) ever included a <b> tag inside an RLE...PDF-embedded line.
#
# This sends the EXACT real caption content from listing 21873 (same location+link, same price/
# rooms/size/floor lines, same real multi-line description, same footer link, same total line
# count and length) as a real sendPhoto caption - with ONLY the <b>/</b> tags stripped out
# (plain text labels instead of bold). If this renders correctly where v9's real caption didn't,
# that confirms <b> tags are the real root cause.
on:
  workflow_dispatch: {}

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Read the real bot token and owner chat id from the live k8s secret
        run: |
          BOT_TOKEN=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.telegram-bot-token}' | base64 -d)
          OWNER_ID=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.owner-telegram-user-id}' | base64 -d)
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$OWNER_ID"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "telegram-bot-token or owner-telegram-user-id is empty in todira-bot-secret."
            exit 1
          fi
          echo "$BOT_TOKEN" > /tmp/bot_token.txt
          echo "$OWNER_ID" > /tmp/owner_id.txt

      - name: Send test 14 as a real sendPhoto caption - real content, no <b> tags (body base64-decoded from ASCII-only source)
        run: |
          BOT_TOKEN=$(cat /tmp/bot_token.txt)
          OWNER_ID=$(cat /tmp/owner_id.txt)
          PHOTO_URL="https://raw.githubusercontent.com/AmirToledano/todira/main/common/todira_common/assets/dachshunds/todi_detective.jpg"

          BODY_B64=""
          BODY=$(echo "$BODY_B64" | base64 -d)

          echo "=== sending test 14 as sendPhoto caption ==="
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "photo=${PHOTO_URL}" \
            --data-urlencode "caption=${BODY}" \
            --data-urlencode "parse_mode=HTML" \
            -o /tmp/resp.json -w "  -> http_status=%{http_code}\n"
          cat /tmp/resp.json
          echo ""
          echo "=== done - does removing only the <b> tags fix the real listing's broken alignment? ==="
