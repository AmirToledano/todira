name: Set Bright Data ISP proxy secret values (manual, values typed only into this form)

# Patches the todira-bot-secret K8s secret's Bright Data ISP-proxy keys (bright-data-isp-host,
# bright-data-isp-user, bright-data-isp-pass) — the values scraper-cronjob.yaml wires into
# BRIGHT_DATA_ISP_HOST / BRIGHT_DATA_ISP_USER / BRIGHT_DATA_ISP_PASS (see
# common/todira_common/bright_data_client.py's fetch_via_isp_proxy, and yad2_client.py's
# REGIONS_ON_MAP_API for which region(s) actually use this). Without these three keys set on the
# real secret, the scraper's tel-aviv-area region gets zero Yad2 coverage every run (fetch_via_
# isp_proxy returns None on missing config, same documented behavior as every other optional
# Bright Data secret already in this project) — this workflow is the last real step to make the
# 2026-09-14 partial ISP-proxy migration actually work in production, not just in diagnostics.
#
# Same reasoning and mechanics as set-whatsapp-secret.yaml (masks each value from this run's own
# logs before anything else touches it, patches only the keys actually filled in via a JSON merge)
# — run this directly from the GitHub Actions UI (Actions tab → this workflow → "Run workflow"),
# typing each value straight into the form fields there, never pasted into a chat/AI session.
#
# Where each value comes from: Bright Data dashboard → your ISP proxy zone → "Access parameters" /
# credentials tab.
#   host - the proxy host:port (e.g. "brd.superproxy.io:22225") — matches exactly what
#          diagnose-yad2-isp-proxy-single-retest.yaml's own BRIGHT_DATA_ISP_HOST secret already
#          uses for the (separate, GitHub-Actions-only) diagnostics
#   user - the zone's proxy username (often "brd-customer-<id>-zone-<name>")
#   pass - the zone's proxy password
#
# No deployment restart needed afterward (unlike set-whatsapp-secret.yaml's website restart) —
# the scraper runs as a CronJob, not a long-lived Deployment: its next scheduled (or manually
# dispatched) run spawns a fresh pod that reads the patched secret automatically.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "ISP proxy host:port - leave blank to skip"
        required: false
        type: string
      user:
        description: "ISP proxy username - leave blank to skip"
        required: false
        type: string
      pass:
        description: "ISP proxy password - leave blank to skip"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Mask every provided value from this run's own logs
        # Same ordering reasoning as set-whatsapp-secret.yaml's own step: reads raw values from
        # $GITHUB_EVENT_PATH via jq (not an `env:` block or ${{ inputs.x }} interpolated into the
        # script text) so nothing is echoed unmasked before the mask is registered.
        run: |
          HOST=$(jq -r '.inputs.host // ""' "$GITHUB_EVENT_PATH")
          USER_VAL=$(jq -r '.inputs.user // ""' "$GITHUB_EVENT_PATH")
          PASS_VAL=$(jq -r '.inputs.pass // ""' "$GITHUB_EVENT_PATH")
          [ -n "$HOST" ] && echo "::add-mask::$HOST"
          [ -n "$USER_VAL" ] && echo "::add-mask::$USER_VAL"
          [ -n "$PASS_VAL" ] && echo "::add-mask::$PASS_VAL"
          true

      - name: Patch only the keys that were actually provided
        env:
          HOST: ${{ inputs.host }}
          USER_VAL: ${{ inputs.user }}
          PASS_VAL: ${{ inputs.pass }}
        run: |
          PATCH='{"data":{}}'
          add_key() {
            key="$1"; value="$2"
            if [ -n "$value" ]; then
              b64=$(printf '%s' "$value" | base64 | tr -d '\n')
              PATCH=$(printf '%s' "$PATCH" | jq --arg k "$key" --arg v "$b64" '.data[$k] = $v')
            fi
          }
          add_key "bright-data-isp-host" "$HOST"
          add_key "bright-data-isp-user" "$USER_VAL"
          add_key "bright-data-isp-pass" "$PASS_VAL"

          if [ "$(printf '%s' "$PATCH" | jq -c '.data')" = "{}" ]; then
            echo "No values provided - nothing to patch."
            exit 0
          fi

          kubectl patch secret todira-bot-secret -n todira --type merge -p "$PATCH"
          echo "Patched. The scraper CronJob's NEXT run (scheduled or manually dispatched) will pick up the new values automatically — no restart needed for a CronJob."
