name: Diagnose — Yad2 listing PAGE from our own IP: headers-only retry + a real headless browser (read-only)

# Follow-up to diagnose-yad2-browser-tls-from-production-ip.yaml (2026-10-02): with a browser TLS
# fingerprint (curl_cffi) the Yad2 MAP API returned real JSON (200 markers) from our own IP — free —
# but the listing DETAIL page still returned Radware's challenge page. This tries the two remaining
# free ideas for the detail page, from a throwaway memory-limited pod: (1) curl_cffi with full
# browser-like headers + a cookie-warming visit; (2) a real headless Chromium (Playwright) that can
# execute Radware's JS challenge. Prints ONLY status/signals/lengths — no listing content, no PII.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Run the probe in a throwaway pod
        run: |
          POD_NAME="yad2-browser-diag-$(date +%s)"
          echo "POD_NAME=$POD_NAME" >> "$GITHUB_ENV"
          cat > /tmp/pod.py << 'PYEOF'
          import os, re, subprocess, sys, time
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "curl_cffi", "psycopg2-binary"])
          import psycopg2
          from curl_cffi import requests as cr

          dsn = "postgresql://" + os.environ["DATABASE_URL"].split("://", 1)[1]
          cur = psycopg2.connect(dsn).cursor()
          cur.execute("select url from listings where source='yad2' and is_delisted=false order by first_seen_at desc limit 3")
          urls = [r[0] for r in cur.fetchall()]
          detail = urls[0]

          def sig(body):
              low = body.lower()
              return [s for s in ("radware", "validate.perfdrive", "__uzdbm") if s in low]

          def desc_len(body):
              m = re.search(r'"description":"(.*?)","', body)
              return len(m.group(1)) if m else 0

          print("== A) curl_cffi chrome + full browser headers + home-page warmup ==")
          try:
              s = cr.Session(impersonate="chrome")
              H = {"Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                   "Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7", "Upgrade-Insecure-Requests": "1",
                   "Sec-Fetch-Dest": "document", "Sec-Fetch-Mode": "navigate", "Sec-Fetch-Site": "same-origin", "Sec-Fetch-User": "?1",
                   "Referer": "https://www.yad2.co.il/realestate/rent"}
              w = s.get("https://www.yad2.co.il/realestate/rent", headers=H, timeout=30)
              print(f"warmup status={w.status_code} size={len(w.text)} signals={sig(w.text) or 'none'} cookies={len(s.cookies)}")
              time.sleep(4)
              r = s.get(detail, headers=H, timeout=30)
              print(f"detail status={r.status_code} size={len(r.text)} next_data={'__NEXT_DATA__' in r.text} signals={sig(r.text) or 'none'} desc_len={desc_len(r.text)}")
          except Exception as e:
              print("A error", type(e).__name__)

          print("== B) real headless Chromium (Playwright) ==")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "playwright"])
          subprocess.check_call([sys.executable, "-m", "playwright", "install", "--with-deps", "chromium"], stdout=subprocess.DEVNULL)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(locale="he-IL", user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36", viewport={"width": 1366, "height": 800})
              page = ctx.new_page()
              for i, u in enumerate(urls[:2]):
                  try:
                      page.goto(u, wait_until="domcontentloaded", timeout=45000)
                      for _ in range(6):
                          page.wait_for_timeout(2500)
                          html = page.content()
                          if "__NEXT_DATA__" in html and "perfdrive" not in html.lower():
                              break
                      print(f"page{i}: next_data={'__NEXT_DATA__' in html} signals={sig(html) or 'none'} size={len(html)} desc_len={desc_len(html)}")
                  except Exception as e:
                      print(f"page{i}: error {type(e).__name__}")
              b.close()
          PYEOF
          kubectl create configmap "$POD_NAME-script" -n todira --from-file=pod.py=/tmp/pod.py
          cat > /tmp/pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: todira
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 420
            containers:
              - name: diag
                image: python:3.12-slim
                command: ["python3", "/script/pod.py"]
                resources:
                  requests: {memory: 256Mi}
                  limits: {memory: 1200Mi}
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: todira-postgres-secret
                        key: database-url
                volumeMounts:
                  - name: script
                    mountPath: /script
            volumes:
              - name: script
                configMap:
                  name: $POD_NAME-script
          EOF
          kubectl apply -f /tmp/pod.yaml

      - name: Wait, print results, clean up (always)
        if: always()
        run: |
          for i in $(seq 1 130); do
            PHASE=$(kubectl get pod "$POD_NAME" -n todira -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then break; fi
            sleep 3
          done
          echo "--- results ---"
          kubectl logs -n todira "$POD_NAME" 2>&1 | grep -E "^==|status=|page[0-9]|error" || echo "(no logs captured)"
          kubectl delete pod "$POD_NAME" -n todira --ignore-not-found=true
          kubectl delete configmap "$POD_NAME-script" -n todira --ignore-not-found=true
