name: Diagnose — is the new home page live (read-only)

# 2026-10-19: after the home page redesign, checks from outside that todira.app serves the new page, the old one is
# still reachable with ?design=classic, and /api/home-map answers. Prints status codes and counts only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pages and data
        run: |
          home=$(curl -s -w '\n%{http_code}' https://todira.app/?lang=he)
          echo "home: HTTP $(echo "$home" | tail -1), new page marker: $(echo "$home" | grep -c 'static/home.js'), old page marker: $(echo "$home" | grep -c 'id=\"root\"')"
          echo "one portrait for both themes: $(echo "$home" | grep -c 'class=\"lp-portrait\"'), dark-only image left: $(echo "$home" | grep -c 'todi-hero-dark')"
          v=$(echo "$home" | grep -o 'home.js?v=[^"]*' | head -1 | cut -d= -f2)
          echo "dot map in home.js: $(curl -s "https://todira.app/static/home.js?v=$v" | grep -c 'var OUTLINE')"
          echo "instant menu in style.css: $(curl -s "https://todira.app/static/style.css?v=$v" | grep -c 'nav-panel-in')"
          echo "2026-10-22 sections: founder $(echo "$home" | grep -c 'lp-founder'), testimonials $(echo "$home" | grep -c 'lp-said'), new FAQ $(echo "$home" | grep -c 'מה אם לא מצאתי דירה'), founder css $(curl -s "https://todira.app/static/home.css?v=$v" | grep -c 'lp-founder')"
          echo "cache headers on home: $(curl -sI https://todira.app/?lang=he | grep -i -E '^(cache-control|cf-cache-status|age):' | tr '\r\n' '  ')"
          echo "shared listing route (unsigned link should be 404): $(curl -s -o /dev/null -w '%{http_code}' https://todira.app/s/1-0000000000)"
          classic=$(curl -s https://todira.app/?design=classic)
          echo "classic: old page marker: $(echo "$classic" | grep -c 'id=\"root\"')"
          for f in home.css home.js fonts/karantina-hebrew-700-normal.woff2 todi-hero-light.webp; do
            echo "$f: $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://todira.app/static/$f)"
          done
          curl -s https://todira.app/api/home-map -o /tmp/m.json -w 'home-map: HTTP %{http_code}\n'
          python3 -c "import json; d=json.load(open('/tmp/m.json')); print('grid cells', len(d.get('grid', [])), 'new_24h', d.get('new_24h'), 'cities_24h', d.get('cities_24h'), 'recent', len(d.get('recent', [])))" || true
