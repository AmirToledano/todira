name: Diagnose Homeless — does /rent/ paginate beyond one fetch? (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push) — added 2026-09-13.
#
# homeless_client.py's own module docstring flags a real, still-open question: Komo and Yad2 both
# turned out to have far more total listings than one page/request returns (Komo: ~175 pages
# behind its own single-page view once paginated properly; Yad2: same real gap, fixed via
# fetch_region_pages). Homeless has never been checked for the same thing — fetch_search_results
# reads exactly one plain fetch of https://www.homeless.co.il/rent/ and nothing more.
#
# This checks three real things in one cheap fetch (1 ZenRows credit, same confirmed-plain tier
# homeless_client.py already uses):
#   1. How many real <tr id="ad_..."> rows does ONE fetch actually return?
#   2. Is there any real pagination control on the page (a page-number link, a "next page" href,
#      a query param like ?page=/?pg=/?p= visible in the page's own markup) — Yad2's own
#      pagination (see yad2_client.py's _region_url) was found exactly this way, by looking at
#      what the site's own UI does, not guessing a param name.
#   3. Is there any real total-count indicator on the page (e.g. "X מודעות" / "X תוצאות") that
#      would confirm whether one fetch's row count IS the total, or is a truncated page of a
#      larger real number?
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homeless.co.il/rent/ and inspect for real pagination/total-count signals
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.homeless.co.il/rent/" \
            -o /tmp/homeless.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 100
          python3 - << 'PYEOF'
          import re
          with open('/tmp/homeless.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          row_ids = re.findall(r'<tr id="ad_(\d+)"', html)
          print(f"Real <tr id=\"ad_...\"> rows in this one fetch: {len(row_ids)}")
          print(f"Unique ids: {len(set(row_ids))}")

          # Look for anything that looks like a page-number control or next-page link/param.
          page_param_hits = re.findall(r'href="[^"]*[?&](?:page|pg|p)=(\d+)[^"]*"', html, re.I)
          print(f"href with a page-like query param: {len(page_param_hits)} (values: {sorted(set(page_param_hits))[:10]})")

          pager_class_hits = re.findall(r'class="[^"]*pag(?:e|er|ination)[^"]*"', html, re.I)
          print(f"elements with a pag(e/er/ination)-like class: {len(pager_class_hits)}")
          for h in pager_class_hits[:10]:
              print("  ", h)

          # Total-count text, e.g. "1,234 מודעות" / "נמצאו X תוצאות" - loose pattern, real check.
          count_hits = re.findall(r'[\d,]{2,}\s*(?:מודעות|תוצאות|דירות)', html)
          print(f"'<number> מודעות/תוצאות/דירות' style total-count text: {count_hits[:10]}")

          # A literal "עמוד" (page) or "הבא" (next) near a link, which would indicate real UI pagination.
          next_hits = re.findall(r'.{0,60}(?:עמוד\s*\d+|הבא\s*>|>\s*הבא).{0,60}', html)
          print(f"'עמוד N' / 'הבא' (next) style hits: {len(next_hits)}")
          for h in next_hits[:10]:
              print("  ", re.sub(r'\s+', ' ', h))

          print()
          print("=== 2026-09-22: is the RESP001 failure (task #14, tracked since 2026-09-17, never")
          print("re-checked live) still happening on this exact call right now? ===")
          code_m = re.search(r'"code":"([A-Z0-9]+)"', html)
          title_m = re.search(r'"title":"([^"]*)"', html)
          if code_m:
              print(f"STILL BROKEN — ZenRows error body: code={code_m.group(1)!r} title={(title_m.group(1) if title_m else '?')!r}")
          elif row_ids:
              print(f"WORKING — {len(row_ids)} real listing rows came back, RESP001 is NOT happening right now.")
          else:
              print("Unclear — no ZenRows error code AND no real rows found; inspect the raw fetch above.")
          PYEOF

      # 2026-09-22: task #5/#6 (never started) — before wiring Homeless sale scraping, checks
      # whether a real sale-category page even exists at the obvious /rent/ -> /sale/ URL swap
      # (Homeless's own site navigation pattern, same discipline as every other source: never guess
      # a page structure, fetch it for real first).
      - name: Try a candidate Homeless sale-category URL (never guessed at without checking)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          for CANDIDATE in "sale" "buy" "forsale"; do
            echo "=== https://www.homeless.co.il/$CANDIDATE/ ==="
            curl -sS -G "https://api.zenrows.com/v1/" \
              --data-urlencode "apikey=$ZENROWS_API_KEY" \
              --data-urlencode "url=https://www.homeless.co.il/$CANDIDATE/" \
              -o "/tmp/homeless_$CANDIDATE.html" \
              -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
              --max-time 100 || true
            python3 -c "
          import re
          with open('/tmp/homeless_$CANDIDATE.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          rows = len(re.findall(r'<tr id=\"ad_\d+\"', html))
          title = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
          code_m = re.search(r'\"code\":\"([A-Z0-9]+)\"', html)
          print(f'  length={len(html)} rows={rows} title={title.group(1).strip() if title else \"?\"!r} zenrows_error={code_m.group(1) if code_m else None}')
          "
            echo
          done

      # 2026-09-22: the step above just confirmed RESP001 is real and happening RIGHT NOW in
      # production (not stale/already-fixed) — ZenRows' own error text suggests "try enabling
      # javascript rendering". js_render=true is a real cost increase (this project chose
      # Homeless specifically for its cheap 1-credit plain tier, same reasoning as Yad2's own
      # expensive js_render saga in yad2_client.py) — testing whether it actually fixes this
      # before treating a cost change as the answer, not assuming it will just because ZenRows'
      # own error message suggests it.
      - name: Test whether js_render=true actually fixes the RESP001 failure (cost implication — testing only, not switching production)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.homeless.co.il/rent/" \
            --data-urlencode "js_render=true" \
            -D /tmp/homeless_jsrender.headers \
            -o /tmp/homeless_jsrender.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 100 || true
          echo "--- real ZenRows credits this ONE request cost (X-Request-Credits header) ---"
          grep -i "^x-request-credits:" /tmp/homeless_jsrender.headers || echo "(header not found)"
          python3 -c "
          import re
          with open('/tmp/homeless_jsrender.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          rows = len(re.findall(r'<tr id=\"ad_\d+\"', html))
          code_m = re.search(r'\"code\":\"([A-Z0-9]+)\"', html)
          print(f'length={len(html)} rows={rows} zenrows_error={code_m.group(1) if code_m else None}')
          if rows > 0:
              print('js_render=true DOES fix it — real rows came back.')
          elif code_m:
              print(f'js_render=true does NOT fix it either — still {code_m.group(1)}.')
          else:
              print('Ambiguous — no rows and no ZenRows error code; inspect further.')
          "

      # 2026-09-24: neither the plain fetch (RESP001) nor js_render=true (real 200, 0 rows) is
      # currently understood — this dumps REAL raw content (not just counts) from both the
      # js_render=true /rent/ response and the real /sale/ page, so the actual current markup can
      # be read instead of guessed at further.
      - name: Dump real raw content around where listings should be (js_render=true /rent/, and /sale/)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          echo "############################################"
          echo "### /rent/ with js_render=true — real raw content"
          echo "############################################"
          python3 -c "
          import re
          with open('/tmp/homeless_jsrender.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          print(f'length={len(html)}')
          title = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
          print(f'title={title.group(1).strip() if title else \"?\"!r}')
          # Any React/Vue/Angular/Next SPA root markers - would mean the real listing grid is
          # client-side rendered and js_render's own wait timing just isn't long enough yet.
          for marker in ('__NEXT_DATA__', 'ng-version', 'data-reactroot', 'id=\"app\"', 'id=\"root\"', 'window.__INITIAL_STATE__'):
              print(f'{marker} present: {marker in html}')
          # Any real captcha/consent/bot-wall text.
          lower = html.lower()
          for signal in ('captcha', 'are you human', 'cloudflare', 'access denied', 'robot'):
              if signal in lower:
                  print(f'WALL SIGNAL FOUND: {signal!r}')
          # Real price signs anywhere at all (₪)?
          price_hits = len(re.findall(r'₪', html))
          print(f'real ₪ occurrences anywhere in the page: {price_hits}')
          if price_hits:
              pos = html.find('₪')
              print('--- context around first ₪ ---')
              print(html[max(0,pos-300):pos+100])
          print('--- first 800 chars of <body> (or start of doc if no body found) ---')
          body_m = re.search(r'<body[^>]*>', html)
          start = body_m.end() if body_m else 0
          print(html[start:start+800])
          "

          echo
          echo "############################################"
          echo "### /sale/ — real raw content"
          echo "############################################"
          python3 -c "
          import re
          with open('/tmp/homeless_sale.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          print(f'length={len(html)}')
          # Does /sale/ use a DIFFERENT id prefix than rent's ad_<id> (e.g. sale_<id>, s_<id>)?
          id_like = re.findall(r'<tr[^>]*\bid=\"([a-zA-Z_]+_?\d+)\"', html)
          print(f'ANY <tr id=\"...\"> rows (any prefix, not just ad_): {len(id_like)}')
          if id_like:
              print('sample ids:', id_like[:10])
          price_hits = len(re.findall(r'₪', html))
          print(f'real ₪ occurrences anywhere in the page: {price_hits}')
          if price_hits:
              pos = html.find('₪')
              print('--- context around first ₪ (walking back for the nearest real row/card markup) ---')
              print(html[max(0,pos-500):pos+100])
          print('--- first 800 chars of <body> ---')
          body_m = re.search(r'<body[^>]*>', html)
          start = body_m.end() if body_m else 0
          print(html[start:start+800])
          "

      # 2026-09-24: owner explicitly asked to find a cheaper alternative to js_render=true (5
      # credits vs. the old plain tier's 1) before accepting that cost increase — real, fair ask,
      # not yet actually tried. Tests real cheaper candidates instead of assuming js_render is the
      # only way past whatever's blocking the plain fetch: (1) a plain ZenRows fetch with
      # custom_headers=true + a real browser's own header set (maybe RESP001 is ZenRows' own
      # default headers looking bot-like, not a real JS-execution requirement), (2)
      # premium_proxy=true alone without js_render (a different antibot tier, cheaper than full
      # rendering), (3) a fully DIRECT fetch (no ZenRows at all) with the same real browser headers
      # — free if it works, same as how Komo/Yad2's own map API turned out to need no proxy at all
      # once actually tested instead of assumed.
      - name: Test cheaper alternatives to js_render=true (custom headers, premium_proxy alone, fully direct)
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          echo "############################################"
          echo "### candidate 1: plain ZenRows + custom_headers=true (real browser UA/Accept-Language)"
          echo "############################################"
          curl -sS -X POST "https://api.zenrows.com/v1/?apikey=${ZENROWS_API_KEY}&url=https%3A%2F%2Fwww.homeless.co.il%2Frent%2F&custom_headers=true" \
            -H "User-Agent: $UA" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -D /tmp/c1.headers -o /tmp/c1.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" --max-time 100 || true
          echo "--- credits used ---"
          grep -i "^x-request-credits:" /tmp/c1.headers || echo "(header not found)"
          python3 -c "
          import re
          with open('/tmp/c1.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          rows = len(re.findall(r'<div id=\"ad_\d+\"', html))
          code_m = re.search(r'\"code\":\"([A-Z0-9]+)\"', html)
          print(f'length={len(html)} real_ad_div_cards={rows} zenrows_error={code_m.group(1) if code_m else None}')
          "

          echo
          echo "############################################"
          echo "### candidate 2: ZenRows premium_proxy=true alone (no js_render)"
          echo "############################################"
          curl -sS -G "https://api.zenrows.com/v1/" \
            --data-urlencode "apikey=$ZENROWS_API_KEY" \
            --data-urlencode "url=https://www.homeless.co.il/rent/" \
            --data-urlencode "premium_proxy=true" \
            -D /tmp/c2.headers -o /tmp/c2.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" --max-time 100 || true
          echo "--- credits used ---"
          grep -i "^x-request-credits:" /tmp/c2.headers || echo "(header not found)"
          python3 -c "
          import re
          with open('/tmp/c2.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          rows = len(re.findall(r'<div id=\"ad_\d+\"', html))
          code_m = re.search(r'\"code\":\"([A-Z0-9]+)\"', html)
          print(f'length={len(html)} real_ad_div_cards={rows} zenrows_error={code_m.group(1) if code_m else None}')
          "

          echo
          echo "############################################"
          echo "### candidate 3: fully DIRECT fetch (no ZenRows at all), real browser headers"
          echo "############################################"
          curl -sS -L --max-redirs 5 \
            -H "User-Agent: $UA" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Upgrade-Insecure-Requests: 1" \
            -o /tmp/c3.html \
            -w "http_status=%{http_code} size_bytes=%{size_download}\n" \
            --max-time 30 "https://www.homeless.co.il/rent/" || true
          python3 -c "
          import re
          with open('/tmp/c3.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          rows = len(re.findall(r'<div id=\"ad_\d+\"', html))
          title = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
          print(f'length={len(html)} real_ad_div_cards={rows} title={title.group(1).strip() if title else \"?\"!r}')
          "

      # 2026-09-24: CONFIRMED — Homeless's real markup moved from <tr id="ad_..."> (table rows,
      # what homeless_client.py's _ROW_RE still expects) to <div id="ad_..." class="image-carousel">
      # (card-based), a real site redesign. Before rewriting the parser, this dumps the FULL real
      # markup for several complete cards (not just the price/title snippet already seen) — both a
      # promoted and a regular (non-promoted) one, since Yad2's own history shows promoted/regular
      # cards can carry different fields — to see real city/neighborhood/street/rooms/floor markup.
      - name: Dump full real card markup (rent + sale) — city/rooms/floor fields, promoted vs regular
        run: |
          for KIND in jsrender sale; do
            echo "############################################"
            echo "### full card dump: $KIND"
            echo "############################################"
            python3 -c "
          import re
          path = '/tmp/homeless_$KIND.html'
          with open(path, encoding='utf-8', errors='replace') as f:
              html = f.read()
          # Every real ad_<id> card, full span (div ... matching close div is unreliable with plain
          # regex, so just grab a generous fixed window from each id occurrence instead).
          matches = list(re.finditer(r'<div id=\"ad_(\d+)\" class=\"([^\"]*)\"', html))
          print(f'{len(matches)} real ad_<id> div cards found')
          seen_kinds = {}
          for m in matches:
              card_id, card_class = m.group(1), m.group(2)
              is_promoted = 'promotedAd' in html[m.end():m.end()+600]
              kind = 'promoted' if is_promoted else 'regular'
              if kind in seen_kinds:
                  continue
              seen_kinds[kind] = True
              print(f'--- {kind} card (id={card_id}, div class={card_class!r}) ---')
              print(html[m.start():m.start()+1500])
              print()
          "
          done
