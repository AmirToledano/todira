name: Diagnose — real Facebook Group POST detail page structure via the stored session cookie (read-only)

# ONE-OFF, READ-ONLY, manual-only (workflow_dispatch, never on push). 2026-09-21.
#
# Follow-up to diagnose-facebook-group-page-structure.yaml: that diagnostic confirmed real logged-in
# access to a Group (פשפשוק - דירות להשכרה, group_id=1665476640352771) but found the group's own
# landing page only carries ONE real post permalink id server-rendered (4728400380727033) — the rest
# of the feed is lazy-loaded client-side, same limitation Marketplace's own search feed had before
# fetch_listing_detail was built for it (see facebook_client.py's own docstring). This fetches that
# ONE real post's own permalink page directly to see whether ITS page (unlike the group landing page)
# carries the real post text/author/attachment fields server-rendered — same "never guess a page
# structure, look at one real fetch first" discipline this project's whole scraping history uses.
#
# Deliberately ONE request per run — same low-volume diagnostic posture as every other Facebook
# diagnostic here, before anything else touches the live (dedicated, not personal) account.
on:
  workflow_dispatch:
    inputs:
      group_id:
        description: 'Facebook numeric group id (default: the already-confirmed פשפשוק group)'
        required: false
        type: string
        default: '1665476640352771'
      post_id:
        description: 'Facebook numeric post id within that group (default: the one real id already found on the group landing page)'
        required: false
        type: string
        default: '4728400380727033'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Fetch the post's own permalink page, using the stored cookie
        # GROUP_ID/POST_ID are numeric ids already surfaced in a prior diagnostic's own printed
        # output (never secret) — safe to read via normal ${{ }} interpolation and to print.
        env:
          GROUP_ID: ${{ inputs.group_id }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          COOKIE=$(kubectl get secret todira-bot-secret -n todira -o jsonpath='{.data.facebook-cookies}' | base64 -d)
          echo "::add-mask::$COOKIE"
          if [ -z "$COOKIE" ]; then
            echo "facebook-cookies is empty in todira-bot-secret — nothing to test with. Re-run set-facebook-cookies-secret.yaml first."
            exit 1
          fi

          POST_URL="https://www.facebook.com/groups/${GROUP_ID}/posts/${POST_ID}/"
          echo "=== Fetching $POST_URL ==="
          STATUS=$(curl -sS --compressed -L --max-redirs 5 \
            -D /tmp/fb_post_headers.txt \
            -o /tmp/fb_post_body.html \
            -w "%{http_code}" \
            --max-time 30 \
            -H "Cookie: $COOKIE" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-User: ?1" \
            -H "Sec-Fetch-Dest: document" \
            -H "sec-ch-ua: \"Chromium\";v=\"128\", \"Not;A=Brand\";v=\"24\", \"Google Chrome\";v=\"128\"" \
            -H "sec-ch-ua-mobile: ?0" \
            -H "sec-ch-ua-platform: \"Windows\"" \
            "$POST_URL") || STATUS="curl_failed"
          echo "http_status=$STATUS size_bytes=$(wc -c < /tmp/fb_post_body.html 2>/dev/null || echo 0)"
          echo "$STATUS" > /tmp/fb_post_status.txt

      - name: Analyze the saved page
        run: |
          python3 -c "
          import re
          from collections import Counter

          with open('/tmp/fb_post_body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          print(f'=== Body length: {len(html)} chars ===')

          title_match = re.search(r'<title[^>]*>(.*?)</title>', html, re.S)
          print(f'Title: {title_match.group(1).strip() if title_match else \"(no <title> found)\"}')

          lower = html.lower()
          login_signals = [s for s in ('log in to facebook', 'loginform', 'checkpoint', 'login.php', 'two-factor', 'name=\"email\"') if s in lower]
          print(f'Login/checkpoint-wall signals present: {login_signals or \"none\"}')

          typenames = re.findall(r'\"__typename\":\"([A-Za-z0-9_]+)\"', html)
          counts = Counter(typenames)
          print(f'=== __typename occurrences found: {len(typenames)} total, {len(counts)} distinct ===')
          for name, count in counts.most_common(40):
              print(f'  {name}: {count}')

          script_json_count = len(re.findall(r'<script type=\"application/json\"', html))
          print(f'=== <script type=\"application/json\"> blocks found: {script_json_count} ===')
          "

          STATUS=$(cat /tmp/fb_post_status.txt 2>/dev/null || echo "")
          if [ "$STATUS" != "200" ]; then
            echo
            echo "=== Raw response body (status=$STATUS, non-200 — Facebook's own generic error/wall page, not real post content, so safe to print in full) ==="
            cat /tmp/fb_post_body.html
          fi

      - name: Generic key-name scan for likely post fields (text/message/story/attachment/author/time)
        # Same technique as facebook_client.py's own detail-page discovery (see its docstring for
        # GroupCommerceProductItem/redacted_description/reverse_geocode_detailed) — the real node
        # type/field names for a GROUP POST specifically are not known yet, so this walks every
        # parsed JSON object and flags any dict that owns a key whose NAME contains one of these
        # target substrings, printing the __typename and matching field(s) plus a nearby id/url if
        # present — this is the real content the Groups feature needs (post text/author/time/images).
        run: |
          STATUS=$(cat /tmp/fb_post_status.txt 2>/dev/null || echo "")
          if [ "$STATUS" != "200" ]; then
            echo "Skipping — fetch wasn't a 200 (status=$STATUS), nothing real to extract."
            exit 0
          fi
          python3 -c "
          import re, json

          with open('/tmp/fb_post_body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          script_blocks = re.findall(r'<script type=\"application/json\"[^>]*>(.*?)</script>', html, re.S)
          print(f'Scanning {len(script_blocks)} JSON script blocks for likely post fields...')

          TARGET_KEY_SUBSTRINGS = ('message', 'story', 'attachment', 'creation_time', 'author', 'permalink', 'group_id', 'actors', 'photo_image', 'url')
          seen_ids = set()
          matches = []

          def walk(obj):
              if len(matches) >= 25:
                  return
              if isinstance(obj, dict):
                  if id(obj) not in seen_ids:
                      matching_keys = [k for k in obj.keys() if any(sub in k.lower() for sub in TARGET_KEY_SUBSTRINGS)]
                      if matching_keys:
                          seen_ids.add(id(obj))
                          matches.append((obj.get('__typename', '?'), matching_keys, obj))
                  for v in obj.values():
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v)

          for block in script_blocks:
              block = block.strip()
              if block.startswith('for (;;);'):
                  block = block[len('for (;;);'):]
              if block.startswith('<!--') and block.endswith('-->'):
                  block = block[4:-3].strip()
              if not block:
                  continue
              try:
                  data = json.loads(block)
              except json.JSONDecodeError:
                  continue
              walk(data)

          def truncate(v, n=400):
              s = repr(v)
              return s if len(s) <= n else s[:n] + '...(truncated)'

          print(f'=== {len(matches)} dict(s) with a post-like key found ===')
          for typename, keys, obj in matches:
              print(f'')
              print(f'--- __typename={typename}, matching keys={keys} ---')
              for k in keys:
                  print(f'  {k}: {truncate(obj[k])}')
          "

      - name: Print full nodes by __typename (Story/TextWithEntities/Comment/Video) — the real post content
        # 2026-09-21, added after the first run of this workflow: the generic key-substring scan
        # above got swamped by ~1000s of unrelated framework/config dicts owning a key like "url"
        # (video CDN configs, static JS asset lists) before reaching the real content nodes — but
        # the run's own __typename frequency table already showed Story/TextWithEntities/Comment/
        # Video nodes DO exist on this page (unlike the group landing page), and the page's own
        # <title> already showed real post text ("יחידת הורים אחרונה ברחוב ששת הימים 7"). This scans
        # by EXACT __typename instead (same technique facebook_client.py's own _find_nodes uses for
        # Marketplace's MarketplaceFeedListingStory) to see the real field names directly.
        run: |
          STATUS=$(cat /tmp/fb_post_status.txt 2>/dev/null || echo "")
          if [ "$STATUS" != "200" ]; then
            echo "Skipping — fetch wasn't a 200 (status=$STATUS), nothing real to extract."
            exit 0
          fi
          python3 -c "
          import re, json

          with open('/tmp/fb_post_body.html', encoding='utf-8', errors='replace') as f:
              html = f.read()

          script_blocks = re.findall(r'<script type=\"application/json\"[^>]*>(.*?)</script>', html, re.S)

          TARGET_TYPENAMES = ('Story', 'TextWithEntities', 'Comment', 'Video', 'ComposedUnstyledBlockWithEntities')
          found = {t: [] for t in TARGET_TYPENAMES}

          def walk(obj):
              if isinstance(obj, dict):
                  tn = obj.get('__typename')
                  if tn in TARGET_TYPENAMES and len(found[tn]) < 3:
                      found[tn].append(obj)
                  for v in obj.values():
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v)

          for block in script_blocks:
              block = block.strip()
              if block.startswith('for (;;);'):
                  block = block[len('for (;;);'):]
              if block.startswith('<!--') and block.endswith('-->'):
                  block = block[4:-3].strip()
              if not block:
                  continue
              try:
                  data = json.loads(block)
              except json.JSONDecodeError:
                  continue
              walk(data)

          def truncate(v, n=800):
              s = json.dumps(v, ensure_ascii=False) if isinstance(v, (dict, list)) else repr(v)
              return s if len(s) <= n else s[:n] + '...(truncated)'

          for tn in TARGET_TYPENAMES:
              print(f'=== __typename={tn}: {len(found[tn])} sample(s) (of possibly more) ===')
              for obj in found[tn]:
                  keys = sorted(obj.keys())
                  print(f'  keys: {keys}')
                  print(f'  full: {truncate(obj)}')
                  print()
          "
